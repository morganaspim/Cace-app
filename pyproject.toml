[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cace-studio"
version = "3.30.0.dev1"
description = "CACE Studio verified computational research environment — confidential and proprietary to Emmanuel Spiro"
requires-python = ">=3.11"
license = {text = "Proprietary - Copyright © 2026 Emmanuel Spiro. All rights reserved."}
classifiers = ["License :: Other/Proprietary License"]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.7", "matplotlib>=3.8"]
test = ["pytest>=8", "hypothesis>=6", "matplotlib>=3.8"]
dev = ["cace-studio[gui,test]"]

[project.scripts]
cace-studio = "cace_studio.app:main"
cace = "cace_studio.cli:main"

[tool.setuptools.packages.find]
include = ["cace_studio*"]

[tool.setuptools.package-data]
cace_studio = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
