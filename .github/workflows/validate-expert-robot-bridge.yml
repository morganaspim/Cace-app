name: Validate Expert Robot bridge workflow snapshot

on:
  push:
    branches: ["executor/expert-robot-bridge"]
    paths:
      - "docs/diagnostics/expert-robot-external-bridge.snapshot.yml"
      - ".github/workflows/validate-expert-robot-bridge.yml"

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse workflow YAML and require dispatch job
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require "yaml"
          path = "docs/diagnostics/expert-robot-external-bridge.snapshot.yml"
          doc = YAML.load_file(path)
          abort "top-level document is not a mapping" unless doc.is_a?(Hash)
          jobs = doc["jobs"]
          abort "jobs mapping missing" unless jobs.is_a?(Hash)
          abort "dispatch job missing" unless jobs.key?("dispatch")
          abort "dispatch job has no steps" unless jobs["dispatch"]["steps"].is_a?(Array)
          puts "YAML_PARSE=PASS"
          puts "JOB_NAMES=#{jobs.keys.join(",")}"
          puts "DISPATCH_STEPS=#{jobs["dispatch"]["steps"].length}"
          RUBY
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Validate GitHub Actions expressions and workflow semantics
        shell: bash
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/actionlint" -ignore 'label "avrea-ubuntu-latest-8-vcpu" is unknown' docs/diagnostics/expert-robot-external-bridge.snapshot.yml
