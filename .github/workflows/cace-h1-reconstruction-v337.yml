# Fast, exact-head development probe for the unconditional H1 converse.
# This workflow is NOT qualification evidence. It may reuse compatible CACE build
# outputs to learn the next proof frontier quickly. The canonical qualification
# workflow always rebuilds CACE project outputs from a clean .lake/build tree.
name: CACE H¹ proof-frontier probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cace-h1-proof-frontier-probe
  cancel-in-progress: false

jobs:
  h1-reconstruction:
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 180
    env:
      CACE_TOOLCHAIN: leanprover/lean4:v4.32.1
      CACE_MATHLIB_COMMIT: 520045ab14e26149ee970e2e617ca04b09bde5d6
      CACE_PERSISTENT_ELAN_HOME: /var/lib/cace-cache/elan
      CACE_PACKAGE_CACHE: /var/lib/cace-cache/mathlib/v4.32.1-520045ab14e26149ee970e2e617ca04b09bde5d6/packages
      CACE_PACKAGE_CACHE_LOCK: /var/lib/cace-cache/mathlib/v330-prewarm.lock
      CACE_PERSISTENT_BUILD_CACHE_ROOT: /var/lib/cace-cache/canonical-qualification-build
      CACE_HEARTBEAT_SECONDS: '60'
      CACE_STALL_WARN_SECONDS: '1200'
      CACE_STALL_KILL_SECONDS: '5400'

    steps:
      - name: Bootstrap Git
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1; then
            run_root() { if command -v sudo >/dev/null 2>&1; then sudo "$@"; else "$@"; fi; }
            if command -v dnf >/dev/null 2>&1; then
              run_root dnf -y install git
            elif command -v yum >/dev/null 2>&1; then
              run_root yum -y install git
            elif command -v microdnf >/dev/null 2>&1; then
              run_root microdnf install -y git
            elif command -v apt-get >/dev/null 2>&1; then
              run_root apt-get update
              run_root env DEBIAN_FRONTEND=noninteractive apt-get install -y git
            else
              echo 'No supported package manager found for Git bootstrap.' >&2
              exit 1
            fi
          fi
          git --version
          command -v flock

      - name: Checkout exact probe commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Establish exact-head boundary and probe journal
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          status_dir="$RUNNER_TEMP/cace-h1-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$status_dir"
          printf '%s\n' "$actual" > "$status_dir/exact_head.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$status_dir/workflow_run_id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$status_dir/workflow_run_attempt.txt"
          echo "CACE_EXPECTED_SHA=$actual" >> "$GITHUB_ENV"
          echo "CACE_STATUS_DIR=$status_dir" >> "$GITHUB_ENV"

      - name: Prepare isolated formal build and cache identities
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d /var/tmp/cace-h1-v337.XXXXXXXX)"
          mkdir -p "$root/formal" "$root/cache" "$root/output"
          cp -a formal/cace_formal/. "$root/formal/"
          rm -rf "$root/formal/.lake/build"
          formal_tree="$(git rev-parse "$CACE_EXPECTED_SHA:formal/cace_formal")"
          toolchain_key="$(printf '%s' "$CACE_TOOLCHAIN" | tr '/:' '__')"
          cache_family="$CACE_PERSISTENT_BUILD_CACHE_ROOT/$toolchain_key/$CACE_MATHLIB_COMMIT"
          exact_cache="$cache_family/$formal_tree"
          echo "CACE_BUILD_ROOT=$root" >> "$GITHUB_ENV"
          echo "CACE_FORMAL_DIR=$root/formal" >> "$GITHUB_ENV"
          echo "CACE_OUTPUT_DIR=$root/output" >> "$GITHUB_ENV"
          echo "CACE_FORMAL_TREE_SHA=$formal_tree" >> "$GITHUB_ENV"
          echo "CACE_CACHE_FAMILY=$cache_family" >> "$GITHUB_ENV"
          echo "CACE_EXACT_BUILD_CACHE=$exact_cache" >> "$GITHUB_ENV"
          echo "ELAN_HOME=$CACE_PERSISTENT_ELAN_HOME" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$root/cache" >> "$GITHUB_ENV"
          printf '%s\n' "$formal_tree" > "$status_dir/formal_tree_sha.txt"

      - name: Seed exact-pin package tree when available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACE_FORMAL_DIR/.lake"
          rm -rf "$CACE_FORMAL_DIR/.lake/packages"
          if [[ -d "$CACE_PACKAGE_CACHE/mathlib/.git" ]]; then
            exec 9>"$CACE_PACKAGE_CACHE_LOCK"
            flock -s -w 900 9
            test "$(git -C "$CACE_PACKAGE_CACHE/mathlib" rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
            cp -a --reflink=auto "$CACE_PACKAGE_CACHE" "$CACE_FORMAL_DIR/.lake/packages"
            flock -u 9
            echo 'CACE_DEPENDENCY_CACHE_HIT'
          else
            echo 'CACE_DEPENDENCY_CACHE_MISS'
          fi
          rm -rf "$CACE_FORMAL_DIR/.lake/build"

      - name: Configure TLS trust
        shell: bash
        run: |
          set -euo pipefail
          bundle=''
          for candidate in /etc/pki/tls/certs/ca-bundle.crt /etc/ssl/certs/ca-certificates.crt /etc/ssl/cert.pem; do
            if [[ -s "$candidate" ]]; then bundle="$candidate"; break; fi
          done
          test -n "$bundle"
          echo "CURL_CA_BUNDLE=$bundle" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"

      - name: Ensure pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ELAN_HOME"
          if [[ ! -x "$ELAN_HOME/bin/elan" ]]; then
            exec 8>/var/lib/cace-cache/elan-install.lock
            flock -w 900 8
            if [[ ! -x "$ELAN_HOME/bin/elan" ]]; then
              curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$CACE_BUILD_ROOT/elan-init.sh"
              sh "$CACE_BUILD_ROOT/elan-init.sh" -y --default-toolchain none
            fi
          fi
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$ELAN_HOME/bin:$PATH"
          exec 8>/var/lib/cace-cache/elan-toolchain.lock
          flock -w 1800 8
          elan toolchain install "$CACE_TOOLCHAIN"
          test "$(cat "$CACE_FORMAL_DIR/lean-toolchain")" = "$CACE_TOOLCHAIN"
          cd "$CACE_FORMAL_DIR"
          lean --version
          lake --version

      - name: Resolve exact Mathlib pin and target cache
        shell: bash
        working-directory: ${{ env.CACE_FORMAL_DIR }}
        run: |
          set -euo pipefail
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
          lake build +Cache.Main
          timeout 3600 lake env lean --run .lake/packages/mathlib/Cache/Main.lean \
            get CACEFormal/H1GraphConverse.lean || true
          find "$XDG_CACHE_HOME" -mindepth 1 -depth -delete || true
          rm -rf .lake/build

      - name: Restore best compatible CACE build cache for probe only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACE_FORMAL_DIR/.lake"
          rm -rf "$CACE_FORMAL_DIR/.lake/build"
          candidate=''
          mode='MISS'

          if [[ -d "$CACE_EXACT_BUILD_CACHE/build" ]]; then
            candidate="$CACE_EXACT_BUILD_CACHE"
            mode='EXACT_TREE_HIT'
          elif [[ -d "$CACE_CACHE_FAMILY" ]]; then
            # Development-only cross-tree reuse: choose the newest compatible cache.
            # Lake's trace hashes invalidate any source/module whose inputs changed.
            while IFS= read -r dir; do
              [[ -d "$dir/build" ]] || continue
              [[ -f "$dir/mathlib_commit.txt" ]] || continue
              [[ -f "$dir/lean_toolchain.txt" ]] || continue
              [[ "$(cat "$dir/mathlib_commit.txt")" = "$CACE_MATHLIB_COMMIT" ]] || continue
              [[ "$(cat "$dir/lean_toolchain.txt")" = "$CACE_TOOLCHAIN" ]] || continue
              candidate="$dir"
              mode='COMPATIBLE_PRIOR_TREE_HIT'
              break
            done < <(find "$CACE_CACHE_FAMILY" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' 2>/dev/null | sort -nr | cut -d' ' -f2-)
          fi

          if [[ -n "$candidate" ]]; then
            cp -a --reflink=auto "$candidate/build" "$CACE_FORMAL_DIR/.lake/build"
            echo "CACE_PROBE_BUILD_CACHE_$mode source=$candidate current_tree=$CACE_FORMAL_TREE_SHA"
            printf '%s\n' "$mode" > "$CACE_STATUS_DIR/build_cache_mode.txt"
            printf '%s\n' "$candidate" > "$CACE_STATUS_DIR/build_cache_source.txt"
          else
            echo "CACE_PROBE_BUILD_CACHE_MISS current_tree=$CACE_FORMAL_TREE_SHA"
            printf '%s\n' 'MISS' > "$CACE_STATUS_DIR/build_cache_mode.txt"
          fi

      - name: Static frontier guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('formal/cace_formal/CACEFormal/H1DomainBridge.lean'),
              Path('formal/cace_formal/CACEFormal/GraphRegularizationCriterion.lean'),
              Path('formal/cace_formal/CACEFormal/RealGraphRegularizationCriterion.lean'),
              Path('formal/cace_formal/CACEFormal/H1BesselRieszReduction.lean'),
              Path('formal/cace_formal/CACEFormal/H1GraphConverse.lean'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              if '𝓝' in text:
                  raise SystemExit(f'fragile scoped neighborhood notation remains in {path}')
              for token in ('sorry', 'admit', 'OPEN OBLIGATION'):
                  if token in text:
                      raise SystemExit(f'forbidden unfinished token {token!r} in {path}')
          print('CACE_H1_STATIC_FRONTIER_GUARDS_PASS')
          PY

      - name: Recheck exact source before proof compile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CACE_EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          diff -qr --exclude=.lake --exclude=lake-manifest.json formal/cace_formal "$CACE_FORMAL_DIR"

      - name: Compile unconditional H1 reconstruction and graph converse
        shell: bash
        working-directory: ${{ env.CACE_FORMAL_DIR }}
        env:
          LEAN_ABORT_ON_PANIC: '1'
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/scripts/cace_run_with_heartbeat.py" \
            --phase h1-proof-frontier-probe -- \
            lake build CACEFormal.H1GraphConverse

      - name: Kernel axiom probe for H1 endpoints
        shell: bash
        working-directory: ${{ env.CACE_FORMAL_DIR }}
        run: |
          set -euo pipefail
          cat > H1ReconstructionAxiomProbe.lean <<'LEAN'
          import CACEFormal.H1GraphConverse
          #print axioms CACEFormal.Continuum.besselRiesz_reconstruction
          #print axioms CACEFormal.Continuum.inH1_of_besselRiesz_reconstruction
          #print axioms CACEFormal.Continuum.inH1_of_inL2_weakPartial_inL2
          #print axioms CACEFormal.Continuum.inH1_of_mem_H1DistributionalGraphSubmodule
          #print axioms CACEFormal.Continuum.inH1_iff_exists_distributionalGraphRepresentative
          LEAN
          output="$(lake env lean H1ReconstructionAxiomProbe.lean)"
          printf '%s\n' "$output" | tee "$CACE_OUTPUT_DIR/h1_axiom_probe.txt"
          if grep -q 'sorryAx' <<<"$output"; then
            echo 'Forbidden sorryAx dependency.' >&2
            exit 1
          fi
          python3 - "$output" <<'PY'
          import re, sys
          text = sys.argv[1]
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          expected = {
              'CACEFormal.Continuum.besselRiesz_reconstruction',
              'CACEFormal.Continuum.inH1_of_besselRiesz_reconstruction',
              'CACEFormal.Continuum.inH1_of_inL2_weakPartial_inL2',
              'CACEFormal.Continuum.inH1_of_mem_H1DistributionalGraphSubmodule',
              'CACEFormal.Continuum.inH1_iff_exists_distributionalGraphRepresentative',
          }
          found = {}
          for name, body in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text):
              found[name] = {x.strip() for x in body.split(',') if x.strip()}
          for name in re.findall(r"'([^']+)' does not depend on any axioms", text):
              found[name] = set()
          missing = expected - set(found)
          if missing:
              raise SystemExit(f'missing axiom reports: {sorted(missing)}')
          bad = {name: sorted(ax - allowed) for name, ax in found.items() if ax - allowed}
          if bad:
              raise SystemExit(f'non-whitelisted axioms: {bad}')
          print('CACE_H1_RECONSTRUCTION_AXIOM_PROBE_PASS')
          PY

      - name: Final exact-head probe check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CACE_EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          diff -qr --exclude=.lake --exclude=lake-manifest.json formal/cace_formal "$CACE_FORMAL_DIR"
          echo CACE_H1_PROOF_FRONTIER_PROBE_PASS

      - name: Persist exact-tree development cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CACE_FORMAL_DIR:-}" || ! -d "$CACE_FORMAL_DIR/.lake/build" ]]; then
            echo 'No build tree available to persist.'
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "${CACE_EXPECTED_SHA:-}"
          diff -qr --exclude=.lake --exclude=lake-manifest.json formal/cace_formal "$CACE_FORMAL_DIR" >/dev/null
          mkdir -p "$CACE_EXACT_BUILD_CACHE"
          staging="$CACE_EXACT_BUILD_CACHE/build.staging.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          rm -rf "$staging"
          cp -a --reflink=auto "$CACE_FORMAL_DIR/.lake/build" "$staging"
          rm -rf "$CACE_EXACT_BUILD_CACHE/build"
          mv "$staging" "$CACE_EXACT_BUILD_CACHE/build"
          printf '%s\n' "$CACE_FORMAL_TREE_SHA" > "$CACE_EXACT_BUILD_CACHE/formal_tree_sha.txt"
          printf '%s\n' "$CACE_MATHLIB_COMMIT" > "$CACE_EXACT_BUILD_CACHE/mathlib_commit.txt"
          printf '%s\n' "$CACE_TOOLCHAIN" > "$CACE_EXACT_BUILD_CACHE/lean_toolchain.txt"
          printf '%s\n' 'development-acceleration-only; never qualification evidence' > "$CACE_EXACT_BUILD_CACHE/cache_policy.txt"
          echo "CACE_PROBE_BUILD_CACHE_PERSISTED tree=$CACE_FORMAL_TREE_SHA"

      - name: Write probe manifest
        if: always()
        shell: bash
        env:
          CACE_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$CACE_STATUS_DIR"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          status = Path(os.environ['CACE_STATUS_DIR'])
          payload = {
              'schema': 'cace-h1-proof-frontier-probe-v1',
              'timestamp_utc': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'job_status': os.environ.get('CACE_JOB_STATUS'),
              'git_commit': os.environ.get('CACE_EXPECTED_SHA'),
              'formal_tree_sha': os.environ.get('CACE_FORMAL_TREE_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'lean_toolchain': os.environ.get('CACE_TOOLCHAIN'),
              'mathlib_commit': os.environ.get('CACE_MATHLIB_COMMIT'),
              'evidence_class': 'DEVELOPMENT_PROBE_ONLY',
              'qualification_effect': 'none',
              'cache_policy': 'compatible CACE build outputs may accelerate this probe; canonical qualification never restores them',
          }
          (status / 'probe_manifest.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-h1-proof-frontier-probe-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.CACE_STATUS_DIR }}
            ${{ env.CACE_OUTPUT_DIR }}

      - name: Remove temporary build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CACE_BUILD_ROOT:-}" == /var/tmp/cace-h1-v337.* && -O "$CACE_BUILD_ROOT" && ! -L "$CACE_BUILD_ROOT" ]]; then
            rm -rf -- "$CACE_BUILD_ROOT"
          fi
