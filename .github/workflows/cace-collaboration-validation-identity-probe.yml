name: CACE Collaboration Validation Identity Probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cace-collaboration-validation-identity-probe.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: cace-global-runner-lane
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Establish exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          printf 'exact_head=%s\n' "$expected"

      - name: Enforce repository-wide CACE Actions serialization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/cace_actions_serialization_guard.py --current-run-id "${GITHUB_RUN_ID}"

      - name: Validate collaboration record structure and hashes
        run: python scripts/verify_collaboration_records.py

      - name: Validate collaboration lifecycle
        run: python scripts/validate_collaboration_lifecycle.py
