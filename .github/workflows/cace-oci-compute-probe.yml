name: CACE OCI Compute probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cace-oci-compute-probe.yml'

permissions:
  contents: read

jobs:
  probe-oci:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Probe OCI compute prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oci-probe
          exec > >(tee oci-probe/probe.txt) 2>&1

          echo '=== environment ==='
          date -u
          uname -a
          id
          command -v oci
          oci --version
          printf 'OCI_CLI_AUTH=%s\n' "${OCI_CLI_AUTH:-<unset>}"
          printf 'OCI_CLI_CONFIG_FILE=%s\n' "${OCI_CLI_CONFIG_FILE:-<unset>}"
          printf 'OCI_CLI_PROFILE=%s\n' "${OCI_CLI_PROFILE:-<unset>}"
          printf 'OCI_CLI_REGION=%s\n' "${OCI_CLI_REGION:-<unset>}"

          CONFIG_FILE="${OCI_CLI_CONFIG_FILE:-$HOME/.oci/config}"
          PROFILE="${OCI_CLI_PROFILE:-DEFAULT}"
          test -r "$CONFIG_FILE"

          TENANCY_OCID="$(python3 - "$CONFIG_FILE" "$PROFILE" <<'PY'
          import configparser, sys
          cfg = configparser.ConfigParser()
          cfg.read(sys.argv[1])
          section = sys.argv[2]
          if section not in cfg:
              raise SystemExit(f'OCI profile not found: {section}')
          value = cfg[section].get('tenancy', '').strip()
          if not value:
              raise SystemExit('OCI tenancy OCID missing from active profile')
          print(value)
          PY
          )"
          echo "tenancy_prefix=${TENANCY_OCID:0:24}..."

          echo
          echo '=== authentication test / subscribed regions ==='
          oci iam region-subscription list --all \
            --query 'data[].{"region":"region-name","status":"status"}' \
            --output table

          echo
          echo '=== availability domains ==='
          oci iam availability-domain list --compartment-id "$TENANCY_OCID" --all \
            --query 'data[].name' --output table

          echo
          echo '=== A1 Flex shape visibility ==='
          oci compute shape list --compartment-id "$TENANCY_OCID" --all \
            --query 'data[?shape==`VM.Standard.A1.Flex`].{shape:shape,ocpus:ocpus,memory:"memory-in-gbs"}' \
            --output table || true

          echo
          echo '=== running/nonterminated root-compartment instances ==='
          oci compute instance list --compartment-id "$TENANCY_OCID" --all \
            --query 'data[?"lifecycle-state"!=`TERMINATED`].{"name":"display-name","shape":shape,"state":"lifecycle-state","ad":"availability-domain","id":id}' \
            --output table || true

          echo
          echo '=== VCNs ==='
          oci network vcn list --compartment-id "$TENANCY_OCID" --all \
            --query 'data[].{"name":"display-name","cidr":"cidr-block","state":"lifecycle-state","id":id}' \
            --output table || true

          echo
          echo '=== subnets ==='
          oci network subnet list --compartment-id "$TENANCY_OCID" --all \
            --query 'data[].{"name":"display-name","cidr":"cidr-block","public":"prohibit-public-ip-on-vnic","state":"lifecycle-state","ad":"availability-domain","id":id}' \
            --output table || true

          echo
          echo '=== recent Oracle Linux A1-compatible images ==='
          oci compute image list --compartment-id "$TENANCY_OCID" --all \
            --operating-system 'Oracle Linux' --shape 'VM.Standard.A1.Flex' \
            --sort-by TIMECREATED --sort-order DESC \
            --query 'data[0:8].{"name":"display-name","osver":"operating-system-version","created":"time-created","id":id}' \
            --output table || true

          echo
          echo '=== SSH material availability (public data only) ==='
          find "$HOME/.ssh" -maxdepth 1 -type f -name '*.pub' -printf '%f\n' 2>/dev/null || true
          if [[ -s "$HOME/.ssh/authorized_keys" ]]; then
            echo 'authorized_keys_present=yes'
          else
            echo 'authorized_keys_present=no'
          fi

          echo
          echo '=== capacity report command availability ==='
          oci compute compute-capacity-report create --help >/dev/null 2>&1 && echo 'capacity_report_cli=yes' || echo 'capacity_report_cli=no'

      - name: Upload OCI probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-oci-compute-probe
          path: oci-probe/
