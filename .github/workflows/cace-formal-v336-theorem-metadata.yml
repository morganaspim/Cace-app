name: CACE Canonical Qualification + H¹ Closure + Resumable Proof Cache
# Qualification trigger nonce: 2026-09-16-rank3-qualification-hardening

# Canonical OCI qualification is manual, with one deliberate self-trigger: a
# change to this workflow file on the locked executor branch. Formal/source
# commits cannot summon the OCI runner.
on:
  workflow_dispatch:
  push:
    branches: [executor/cace-proof-qualification-locked]
    paths:
      - '.github/workflows/cace-formal-v336-theorem-metadata.yml'

permissions:
  contents: read

# Never cancel or replace an in-flight qualification. The executor additionally
# checks repository-wide queued/running state before every deliberate dispatch.
concurrency:
  group: cace-canonical-qualification-oci
  cancel-in-progress: false

jobs:
  exact-head-formal-qualification:
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 1400
    env:
      CACE_TOOLCHAIN: leanprover/lean4:v4.32.1
      CACE_MATHLIB_COMMIT: 520045ab14e26149ee970e2e617ca04b09bde5d6
      CACE_PERSISTENT_ELAN_HOME: /var/lib/cace-cache/elan
      CACE_PACKAGE_CACHE: /var/lib/cace-cache/mathlib/v4.32.1-520045ab14e26149ee970e2e617ca04b09bde5d6/packages
      CACE_PACKAGE_CACHE_LOCK: /var/lib/cace-cache/mathlib/v330-prewarm.lock
      CACE_PERSISTENT_BUILD_CACHE_ROOT: /var/lib/cace-cache/canonical-qualification-build
      CACE_HEARTBEAT_SECONDS: '60'
      CACE_STALL_WARN_SECONDS: '1800'
      CACE_STALL_KILL_SECONDS: '7200'

    steps:
      - name: Bootstrap Git required for exact-head qualification
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1; then
            run_root() {
              if command -v sudo >/dev/null 2>&1; then sudo "$@"; else "$@"; fi
            }
            if command -v dnf >/dev/null 2>&1; then
              run_root dnf -y install git
            elif command -v yum >/dev/null 2>&1; then
              run_root yum -y install git
            elif command -v microdnf >/dev/null 2>&1; then
              run_root microdnf install -y git
            elif command -v apt-get >/dev/null 2>&1; then
              run_root apt-get update
              run_root env DEBIAN_FRONTEND=noninteractive apt-get install -y git
            else
              echo 'No supported package manager found for Git bootstrap.' >&2
              exit 1
            fi
          fi
          git --version
          command -v flock
          command -v gzip

      - name: Checkout exact event commit with bounded initial history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          # Keep the initial checkout small. The next step deepens only as much
          # as qualification inheritance actually requires.
          fetch-depth: 64
          clean: true
          # The adaptive ancestry step performs read-only deepen/unshallow fetches.
          # Keep the workflow's contents:read token available until checkout's
          # post-step removes it.
          persist-credentials: true

      - name: Establish exact-current-head boundary and status journal
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          status_dir="$RUNNER_TEMP/cace-v337-status-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$status_dir"
          printf '%s\n' "$actual" > "$status_dir/exact_head.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$status_dir/workflow_run_id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$status_dir/workflow_run_attempt.txt"
          echo "CACE_EXPECTED_SHA=$actual" >> "$GITHUB_ENV"
          echo "CACE_STATUS_DIR=$status_dir" >> "$GITHUB_ENV"
          echo "exact_current_head=$actual"

      - name: Ensure attested qualification ancestry is locally complete
        shell: bash
        run: |
          set -euo pipefail
          attested_file="$RUNNER_TEMP/cace-qualified-attested-commits.txt"
          python - "$attested_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          raw = json.loads(Path("cace_studio/data/claim_registry.json").read_text(encoding="utf-8"))
          commits = sorted(
              {
                  str(claim.get("qualification", {}).get("attested_commit", "")).strip()
                  for claim in raw.get("claims", [])
                  if claim.get("qualification", {}).get("current_head_qualified") is True
                  and claim.get("qualification", {}).get("attested_commit")
              }
          )
          output.write_text("".join(f"{commit}\n" for commit in commits), encoding="utf-8")
          PY

          while IFS= read -r attested; do
            [[ "$attested" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Invalid attested commit in canonical registry: $attested" >&2
              exit 1
            }

            if git merge-base --is-ancestor "$attested" HEAD 2>/dev/null; then
              echo "CACE_QUALIFICATION_ANCESTRY_PRESENT attested=$attested mode=initial"
              continue
            fi

            if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
              git fetch --no-tags --deepen=256 origin "$GITHUB_SHA"
            fi

            if git merge-base --is-ancestor "$attested" HEAD 2>/dev/null; then
              echo "CACE_QUALIFICATION_ANCESTRY_PRESENT attested=$attested mode=deepened"
              continue
            fi

            if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
              # Rare fallback: correctness beats checkout size. This executes
              # only when the qualified ancestor lies beyond the bounded deepen.
              git fetch --no-tags --unshallow origin "$GITHUB_SHA" ||                 git fetch --no-tags --unshallow origin
            fi

            git merge-base --is-ancestor "$attested" HEAD || {
              echo "Attested commit $attested is not an ancestor of $GITHUB_SHA." >&2
              exit 1
            }
            echo "CACE_QUALIFICATION_ANCESTRY_PRESENT attested=$attested mode=unshallow-fallback"
          done < "$attested_file"

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Set up pinned ARM64-capable Python
        shell: bash
        env:
          UV_VERSION: '0.12.13'
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" |
            env UV_INSTALL_DIR="$RUNNER_TEMP/uv-v337-bin" sh
          "$RUNNER_TEMP/uv-v337-bin/uv" python install 3.13.15
          "$RUNNER_TEMP/uv-v337-bin/uv" venv --seed --python 3.13.15 "$RUNNER_TEMP/cace-v337-venv"
          echo "$RUNNER_TEMP/cace-v337-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cace-v337-venv/bin/python" --version

      - name: Run truth architecture, proof-governance, attestation, and research tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest -q \
            tests/test_cli.py \
            tests/test_claim_registry_v331.py \
            tests/test_qualification_drift_v331.py \
            tests/test_qualification_overlay_v337.py \
            tests/test_qualification_diagnostics_v337.py \
            tests/test_bug_class_registry_v337.py \
            tests/test_research_dynamics_v337.py \
            tests/test_research_geometry_v337.py \
            tests/test_export_v330_environment_metadata.py \
            tests/test_continuum_attestation_v337.py \
            tests/test_lean_theorem_metadata_v336.py \
            tests/test_proof_contract_v336.py
          python scripts/check_bug_sweep.py

      - name: Prepare isolated formal qualification build and cache identity
        shell: bash
        run: |
          set -euo pipefail
          min_free_kb=$((5 * 1024 * 1024))
          formal_tree="$(git rev-parse "$CACE_EXPECTED_SHA:formal/cace_formal")"
          toolchain_key="$(printf '%s' "$CACE_TOOLCHAIN" | tr '/:' '__')"
          build_cache_base="$CACE_PERSISTENT_BUILD_CACHE_ROOT/$toolchain_key/$CACE_MATHLIB_COMMIT"
          build_cache="$build_cache_base/$formal_tree"

          # Per-tree proof caches are acceleration only, never qualification
          # evidence. Bound them before a new qualification so validated old
          # trees cannot exhaust the runner. Preserve the current tree (if any)
          # and the two newest compatible ancestor caches.
          available_kb="$(df -Pk /var/tmp | awk 'NR==2 {print $4}')"
          if (( available_kb < min_free_kb )); then
            mkdir -p "$build_cache_base"
            exec 7>/var/lib/cace-cache/canonical-qualification-prune.lock
            flock -w 900 7

            # Interrupted cache promotions may leave owned staging directories.
            find "$build_cache_base" -mindepth 2 -maxdepth 2 -type d \
              -name 'build.staging.*' -user "$(id -un)" -print -exec rm -rf -- {} + || true
            package_parent="$(dirname "$CACE_PACKAGE_CACHE")"
            package_name="$(basename "$CACE_PACKAGE_CACHE")"
            if [[ -d "$package_parent" ]]; then
              find "$package_parent" -mindepth 1 -maxdepth 1 -type d \
                -name "${package_name}.staging.*" -user "$(id -un)" -print -exec rm -rf -- {} + || true
            fi

            # Oldest-first deletion preserves the most useful recent ancestor
            # caches for as long as the disk reserve allows. Every per-tree cache
            # is acceleration only and may be rebuilt from pinned sources.
            mapfile -t cache_dirs < <(
              find "$build_cache_base" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
                | sort -n | awk '{print $2}'
            )
            for candidate in "${cache_dirs[@]}"; do
              [[ -d "$candidate" && ! -L "$candidate" && -O "$candidate" ]] || continue
              name="$(basename "$candidate")"
              [[ "$name" =~ ^[0-9a-f]{40}$ ]] || continue
              [[ "$name" == "$formal_tree" ]] && continue
              rm -rf -- "$candidate"
              available_kb="$(df -Pk /var/tmp | awk 'NR==2 {print $4}')"
              if (( available_kb >= min_free_kb )); then
                break
              fi
            done

            # If all ancestor caches are gone and the reserve is still short,
            # the current-tree cache is also disposable acceleration. Remove it
            # only as the final cache-pruning fallback; qualification will rebuild
            # it from the exact pinned source/dependency state.
            available_kb="$(df -Pk /var/tmp | awk 'NR==2 {print $4}')"
            if (( available_kb < min_free_kb )) && \
               [[ -d "$build_cache" && ! -L "$build_cache" && -O "$build_cache" ]] && \
               [[ "$(basename "$build_cache")" =~ ^[0-9a-f]{40}$ ]]; then
              rm -rf -- "$build_cache"
            fi
            flock -u 7
          fi

          available_kb="$(df -Pk /var/tmp | awk 'NR==2 {print $4}')"
          if (( available_kb < min_free_kb )); then
            echo "Formal qualification requires at least 5 GiB free after safe cache pruning; found ${available_kb} KiB." >&2
            exit 1
          fi

          cace_build_root="$(mktemp -d /var/tmp/cace-v337-qualification.XXXXXXXX)"
          mkdir -p "$cace_build_root/formal" "$cace_build_root/cache" "$cace_build_root/output"
          cp -a formal/cace_formal/. "$cace_build_root/formal/"
          rm -rf "$cace_build_root/formal/.lake/build"
          echo "CACE_BUILD_ROOT=$cace_build_root" >> "$GITHUB_ENV"
          echo "CACE_FORMAL_DIR=$cace_build_root/formal" >> "$GITHUB_ENV"
          echo "CACE_OUTPUT_DIR=$cace_build_root/output" >> "$GITHUB_ENV"
          echo "CACE_FORMAL_TREE_SHA=$formal_tree" >> "$GITHUB_ENV"
          echo "CACE_FORMAL_BUILD_CACHE_BASE=$build_cache_base" >> "$GITHUB_ENV"
          echo "CACE_FORMAL_BUILD_CACHE=$build_cache" >> "$GITHUB_ENV"
          echo "CACE_CACHE_MODE=miss" >> "$GITHUB_ENV"
          echo "CACE_CACHE_BASELINE_TREE=" >> "$GITHUB_ENV"
          echo "ELAN_HOME=$CACE_PERSISTENT_ELAN_HOME" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$cace_build_root/cache" >> "$GITHUB_ENV"
          printf '%s\n' "$formal_tree" > "$CACE_STATUS_DIR/formal_tree_sha.txt"

          # Keep the original post-copy safety check too: source staging itself
          # must not consume the qualification reserve.
          available_kb="$(df -Pk "$cace_build_root" | awk 'NR==2 {print $4}')"
          if (( available_kb < min_free_kb )); then
            echo "Formal qualification requires at least 5 GiB free after source staging; found ${available_kb} KiB." >&2
            exit 1
          fi
          df -h "$cace_build_root"

      - name: Seed isolated exact-pin dependency tree when available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CACE_FORMAL_DIR/.lake"
          rm -rf "$CACE_FORMAL_DIR/.lake/packages"
          if [[ -d "$CACE_PACKAGE_CACHE/mathlib/.git" ]]; then
            exec 9>"$CACE_PACKAGE_CACHE_LOCK"
            flock -s -w 900 9
            test "$(git -C "$CACE_PACKAGE_CACHE/mathlib" rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
            cp -a --reflink=auto "$CACE_PACKAGE_CACHE" "$CACE_FORMAL_DIR/.lake/packages"
            flock -u 9
            echo 'CACE_DEPENDENCY_CACHE_HIT exact-pin package tree restored.'
          else
            echo 'CACE_DEPENDENCY_CACHE_MISS persistent package cache absent; resolving from immutable pins.'
          fi
          rm -rf "$CACE_FORMAL_DIR/.lake/build"

      - name: Configure verified TLS trust
        shell: bash
        run: |
          set -euo pipefail
          cace_ca_bundle=""
          for candidate in /etc/pki/tls/certs/ca-bundle.crt /etc/ssl/certs/ca-certificates.crt /etc/ssl/cert.pem; do
            if [[ -s "$candidate" ]]; then cace_ca_bundle="$candidate"; break; fi
          done
          test -n "$cace_ca_bundle"
          echo "CURL_CA_BUNDLE=$cace_ca_bundle" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$cace_ca_bundle" >> "$GITHUB_ENV"

      - name: Ensure pinned Lean toolchain in persistent OCI cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ELAN_HOME"
          if [[ ! -x "$ELAN_HOME/bin/elan" ]]; then
            exec 8>/var/lib/cace-cache/elan-install.lock
            flock -w 900 8
            if [[ ! -x "$ELAN_HOME/bin/elan" ]]; then
              curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$CACE_BUILD_ROOT/elan-init.sh"
              sh "$CACE_BUILD_ROOT/elan-init.sh" -y --default-toolchain none
            fi
          fi
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$ELAN_HOME/bin:$PATH"
          exec 8>/var/lib/cace-cache/elan-toolchain.lock
          flock -w 1800 8
          elan toolchain install "$CACE_TOOLCHAIN"
          test "$(cat "$CACE_FORMAL_DIR/lean-toolchain")" = "$CACE_TOOLCHAIN"
          (cd "$CACE_FORMAL_DIR" && lean --version && lake --version)

      - name: Resolve and verify exact dependency closure
        shell: bash
        working-directory: ${{ env.CACE_FORMAL_DIR }}
        run: |
          set -euo pipefail
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
          lake build +Cache.Main
          lake env lean --run .lake/packages/mathlib/Cache/Main.lean \
            get CACEFormal/H1GraphConverse.lean || true
          lake env lean --run .lake/packages/mathlib/Cache/Main.lean \
            get CACEFormal/V330TheoremMetadata.lean || true
          find "$XDG_CACHE_HOME" -mindepth 1 -depth -delete || true
          rm -rf .lake/build
          echo "Resolved mathlib=$(git -C .lake/packages/mathlib rev-parse HEAD)"

      - name: Restore exact or nearest compatible resumable CACE build cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CACE_FORMAL_DIR/.lake/build"
          mkdir -p "$CACE_FORMAL_DIR/.lake"

          validate_cache_identity() {
            local cache_dir="$1"
            [[ -d "$cache_dir/build" ]] || return 1
            [[ -s "$cache_dir/mathlib_commit.txt" ]] || return 1
            [[ -s "$cache_dir/lean_toolchain.txt" ]] || return 1
            [[ "$(cat "$cache_dir/mathlib_commit.txt")" = "$CACE_MATHLIB_COMMIT" ]] || return 1
            [[ "$(cat "$cache_dir/lean_toolchain.txt")" = "$CACE_TOOLCHAIN" ]] || return 1
          }

          if validate_cache_identity "$CACE_FORMAL_BUILD_CACHE"; then
            cp -a --reflink=auto "$CACE_FORMAL_BUILD_CACHE/build" "$CACE_FORMAL_DIR/.lake/build"
            echo "CACE_CACHE_MODE=exact" >> "$GITHUB_ENV"
            echo "CACE_CACHE_BASELINE_TREE=$CACE_FORMAL_TREE_SHA" >> "$GITHUB_ENV"
            printf '%s\n' 'exact' > "$CACE_STATUS_DIR/cache_mode.txt"
            printf '%s\n' "$CACE_FORMAL_TREE_SHA" > "$CACE_STATUS_DIR/cache_baseline_tree.txt"
            echo "CACE_FORMAL_BUILD_CACHE_HIT exact tree=$CACE_FORMAL_TREE_SHA"
            exit 0
          fi

          # Cross-tree reuse is acceleration only. It is permitted only from a
          # first-parent ancestor with the same pinned Lean and Mathlib identity.
          # Lake still recompiles every changed module and all reverse CACE import
          # dependents before any theorem metadata or kernel audit is accepted.
          baseline_commit=''
          baseline_tree=''
          baseline_cache=''
          while read -r ancestor; do
            [[ -n "$ancestor" ]] || continue
            tree="$(git rev-parse "$ancestor:formal/cace_formal" 2>/dev/null || true)"
            [[ -n "$tree" ]] || continue
            candidate="$CACE_FORMAL_BUILD_CACHE_BASE/$tree"
            if validate_cache_identity "$candidate"; then
              baseline_commit="$ancestor"
              baseline_tree="$tree"
              baseline_cache="$candidate"
              break
            fi
          done < <(git rev-list --first-parent --max-count=63 HEAD^ 2>/dev/null || true)

          if [[ -z "$baseline_cache" ]]; then
            echo "CACE_FORMAL_BUILD_CACHE_MISS tree=$CACE_FORMAL_TREE_SHA no-compatible-ancestor"
            printf '%s\n' 'miss' > "$CACE_STATUS_DIR/cache_mode.txt"
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "$baseline_commit" "$CACE_EXPECTED_SHA" -- formal/cace_formal)
          printf '%s\n' "${changed[@]}" > "$CACE_STATUS_DIR/cache_changed_paths.txt"

          # Build-system or toolchain edits invalidate all project build reuse.
          for path in "${changed[@]}"; do
            case "$path" in
              formal/cace_formal/lean-toolchain|formal/cace_formal/lakefile.lean|formal/cace_formal/lakefile.toml|formal/cace_formal/lake-manifest.json)
                echo "CACE_FORMAL_BUILD_CACHE_COLD_CONFIG_CHANGE path=$path"
                printf '%s\n' 'miss-config-change' > "$CACE_STATUS_DIR/cache_mode.txt"
                exit 0
                ;;
            esac
          done

          cp -a --reflink=auto "$baseline_cache/build" "$CACE_FORMAL_DIR/.lake/build"
          echo "CACE_CACHE_MODE=ancestor" >> "$GITHUB_ENV"
          echo "CACE_CACHE_BASELINE_TREE=$baseline_tree" >> "$GITHUB_ENV"
          printf '%s\n' 'ancestor' > "$CACE_STATUS_DIR/cache_mode.txt"
          printf '%s\n' "$baseline_tree" > "$CACE_STATUS_DIR/cache_baseline_tree.txt"
          printf '%s\n' "$baseline_commit" > "$CACE_STATUS_DIR/cache_baseline_commit.txt"

          # Compute a conservative reverse-import closure among CACE-owned Lean
          # modules. If any changed formal path cannot be mapped to a current
          # module, invalidate the full CACE module set rather than risk stale
          # ancestor artifacts. Qualification remains fresh exact-head evidence.
          python - "$baseline_commit" "$CACE_EXPECTED_SHA" "$CACE_FORMAL_DIR" "$CACE_STATUS_DIR" <<'PY'
          import re
          import subprocess
          import sys
          from collections import defaultdict, deque
          from pathlib import Path

          baseline, head, formal_dir_s, status_dir_s = sys.argv[1:]
          formal_dir = Path(formal_dir_s)
          status_dir = Path(status_dir_s)
          prefix = 'formal/cace_formal/'
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', baseline, head, '--', 'formal/cace_formal'],
              text=True,
          ).splitlines()

          source_files = sorted((formal_dir / 'CACEFormal').rglob('*.lean'))
          module_to_path = {
              '.'.join(path.relative_to(formal_dir).with_suffix('').parts): path
              for path in source_files
          }
          reverse = defaultdict(set)
          import_re = re.compile(r'^\s*import\s+(.+?)\s*$')
          for module, path in module_to_path.items():
              for line in path.read_text(encoding='utf-8').splitlines():
                  m = import_re.match(line)
                  if not m:
                      continue
                  for imported in m.group(1).split():
                      if imported in module_to_path:
                          reverse[imported].add(module)

          path_to_module = {
              prefix + path.relative_to(formal_dir).as_posix(): module
              for module, path in module_to_path.items()
          }
          seeds = set()
          unrecognized = []
          for rel in changed:
              module = path_to_module.get(rel)
              if module is None:
                  unrecognized.append(rel)
              else:
                  seeds.add(module)

          if unrecognized:
              invalidation_mode = 'full-unrecognized-formal-change'
              affected = set(module_to_path)
          else:
              invalidation_mode = 'reverse-import-closure'
              affected = set(seeds)
              q = deque(sorted(seeds))
              while q:
                  module = q.popleft()
                  for dependent in sorted(reverse.get(module, ())):
                      if dependent not in affected:
                          affected.add(dependent)
                          q.append(dependent)

          # Always refresh the two qualification aggregators on an ancestor seed.
          for module in ('CACEFormal.V330AxiomAudit', 'CACEFormal.V330TheoremMetadata'):
              if module in module_to_path:
                  affected.add(module)

          for module in sorted(affected):
              module_to_path[module].touch()

          (status_dir / 'cache_invalidated_modules.txt').write_text(
              ''.join(f'{m}\n' for m in sorted(affected)), encoding='utf-8'
          )
          (status_dir / 'cache_unrecognized_formal_paths.txt').write_text(
              ''.join(f'{rel}\n' for rel in unrecognized), encoding='utf-8'
          )
          (status_dir / 'cache_invalidation_mode.txt').write_text(
              invalidation_mode + '\n', encoding='utf-8'
          )
          print(
              'CACE_ANCESTOR_CACHE_INVALIDATION '
              f'changed_paths={len(changed)} seeds={len(seeds)} '
              f'unrecognized={len(unrecognized)} affected={len(affected)} '
              f'mode={invalidation_mode}'
          )
          PY

          echo "CACE_FORMAL_BUILD_CACHE_HIT ancestor_tree=$baseline_tree current_tree=$CACE_FORMAL_TREE_SHA"

      - name: Reject unfinished proof tokens across audited source bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          from cace_studio.core.proof_contract import ProofContractRegistry

          contract = ProofContractRegistry.load_default().for_claim('cace.v330.continuum-proof-strengthening')
          if contract is None:
              raise SystemExit('missing ProofContract')
          pattern = re.compile(r'\bsorry\b|\badmit\b|OPEN OBLIGATION')
          failures = []
          root = Path('formal/cace_formal')
          for relative in contract.audited_source_files:
              text = (root / relative).read_text(encoding='utf-8')
              if pattern.search(text):
                  failures.append(relative)
          if failures:
              raise SystemExit(f'Unfinished proof tokens in audited sources: {failures}')
          print(f'CACE_UNFINISHED_TOKEN_GUARD_PASS:{len(contract.audited_source_files)}')
          PY

      - name: Re-verify exact source state before formal qualification work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CACE_EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          diff -qr --exclude=.lake --exclude=lake-manifest.json formal/cace_formal "$CACE_FORMAL_DIR"

      - name: Compile unconditional H1 reconstruction and graph converse
        shell: bash
        working-directory: ${{ env.CACE_FORMAL_DIR }}
        env:
          LEAN_ABORT_ON_PANIC: '1'
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/scripts/cace_run_with_heartbeat.py" \
            --phase h1-graph-converse -- \
            lake build CACEFormal.H1GraphConverse

      - name: Compile audited continuum dependency closure
        shell: bash
        working-directory: ${{ env.CACE_FORMAL_DIR }}
        env:
          LEAN_ABORT_ON_PANIC: '1'
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/scripts/cace_run_with_heartbeat.py" \
            --phase continuum-axiom-audit-build -- \
            lake build CACEFormal.V330AxiomAudit
          python "$GITHUB_WORKSPACE/scripts/cace_run_with_heartbeat.py" \
            --phase theorem-metadata-build -- \
            lake build CACEFormal.V330TheoremMetadata

      - name: Emit loaded-environment theorem metadata
        shell: bash
        working-directory: ${{ env.CACE_FORMAL_DIR }}
        run: |
          set -euo pipefail
          lake env lean CACEFormal/V330TheoremMetadata.lean \
            | tee "$CACE_OUTPUT_DIR/v330_lean_environment_metadata.raw.txt"

      - name: Canonicalize metadata and run fail-closed kernel axiom audit
        shell: bash
        working-directory: ${{ env.CACE_FORMAL_DIR }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/scripts/export_v330_environment_metadata.py" \
            --formal-dir "$CACE_FORMAL_DIR" \
            --raw-output "$CACE_OUTPUT_DIR/v330_lean_environment_metadata.raw.txt" \
            --git-commit "$CACE_EXPECTED_SHA" \
            --output "$CACE_OUTPUT_DIR/v330_lean_environment_metadata.json"

      - name: Verify canonical metadata and audit binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from cace_studio.core.proof_contract import ProofContractRegistry

          output = Path(os.environ['CACE_OUTPUT_DIR'])
          artifact = json.loads((output / 'v330_lean_environment_metadata.json').read_text())
          contract = ProofContractRegistry.load_default().for_claim('cace.v330.continuum-proof-strengthening')
          if contract is None:
              raise SystemExit('missing proof contract')
          assert artifact['artifact_schema'] == 'cace-lean-theorem-metadata-v3'
          assert artifact['metadata_state'] == 'LEAN_GENERATED'
          assert artifact['claim_id'] == contract.claim_id
          assert artifact['proof_contract_id'] == contract.contract_id
          assert artifact['proof_contract_sha256'] == contract.contract_sha256
          assert artifact['git_commit'] == os.environ['CACE_EXPECTED_SHA']
          assert artifact['mathlib_commit'] == os.environ['CACE_MATHLIB_COMMIT']
          assert artifact['endpoint_count'] == len(contract.endpoint_theorems)
          assert artifact['kernel_axiom_audit_theorem_count'] == len(contract.endpoint_theorems)
          assert len(artifact['kernel_axiom_audit_sha256']) == 64
          assert (output / 'v330_kernel_axiom_audit.json').is_file()
          assert (output / 'v330_kernel_axiom_audit.json.sha256').is_file()
          assert (output / 'v330_kernel_axiom_audit.raw.txt').is_file()
          print('CACE_V337_METADATA_AND_KERNEL_AUDIT_BINDING_PASS')
          PY

      - name: Verify exact-current-head attestation preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CACE_EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          diff -qr --exclude=.lake --exclude=lake-manifest.json formal/cace_formal "$CACE_FORMAL_DIR"
          test "$(git -C "$CACE_FORMAL_DIR/.lake/packages/mathlib" rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
          test -s "$CACE_FORMAL_DIR/lake-manifest.json"
          test -s "$CACE_OUTPUT_DIR/v330_kernel_axiom_audit.json"
          test -s "$CACE_OUTPUT_DIR/v330_lean_environment_metadata.json"

      - name: Build exact-current-head continuum proof attestation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/build_continuum_attestation.py \
            --formal-dir "$CACE_FORMAL_DIR" \
            --metadata "$CACE_OUTPUT_DIR/v330_lean_environment_metadata.json" \
            --axiom-audit "$CACE_OUTPUT_DIR/v330_kernel_axiom_audit.json" \
            --git-commit "$CACE_EXPECTED_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$CACE_OUTPUT_DIR/cace_continuum_qualification_attestation.json"

      - name: Final exact-head and artifact-integrity gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CACE_EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          diff -qr --exclude=.lake --exclude=lake-manifest.json formal/cace_formal "$CACE_FORMAL_DIR"
          cd "$CACE_OUTPUT_DIR"
          sha256sum -c cace_continuum_qualification_attestation.json.sha256
          sha256sum -c v330_lean_environment_metadata.json.sha256
          sha256sum -c v330_kernel_axiom_audit.json.sha256
          printf '%s\n' "$CACE_EXPECTED_SHA" > commit.txt
          printf '%s\n' "$GITHUB_RUN_ID" > workflow_run_id.txt
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > workflow_run_attempt.txt
          echo CACE_V337_EXACT_HEAD_QUALIFICATION_PASS

      - name: Upload exact-head continuum qualification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-v337-exact-head-formal-qualification
          path: |
            ${{ env.CACE_OUTPUT_DIR }}/cace_continuum_qualification_attestation.json
            ${{ env.CACE_OUTPUT_DIR }}/cace_continuum_qualification_attestation.json.sha256
            ${{ env.CACE_OUTPUT_DIR }}/v330_lean_environment_metadata.json
            ${{ env.CACE_OUTPUT_DIR }}/v330_lean_environment_metadata.json.sha256
            ${{ env.CACE_OUTPUT_DIR }}/v330_lean_environment_metadata.raw.txt
            ${{ env.CACE_OUTPUT_DIR }}/v330_kernel_axiom_audit.json
            ${{ env.CACE_OUTPUT_DIR }}/v330_kernel_axiom_audit.json.sha256
            ${{ env.CACE_OUTPUT_DIR }}/v330_kernel_axiom_audit.raw.txt
            ${{ env.CACE_OUTPUT_DIR }}/commit.txt
            ${{ env.CACE_OUTPUT_DIR }}/workflow_run_id.txt
            ${{ env.CACE_OUTPUT_DIR }}/workflow_run_attempt.txt

      - name: Persist validated resumable proof caches
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CACE_FORMAL_DIR:-}" || ! -d "$CACE_FORMAL_DIR/.lake" ]]; then
            echo 'No formal build tree available to persist.'
            exit 0
          fi
          if [[ "$(git rev-parse HEAD)" != "${CACE_EXPECTED_SHA:-}" ]]; then
            echo 'Refusing cache promotion: exact-head drift.' >&2
            exit 1
          fi
          if ! diff -qr --exclude=.lake --exclude=lake-manifest.json formal/cace_formal "$CACE_FORMAL_DIR" >/dev/null; then
            echo 'Refusing cache promotion: formal source drift.' >&2
            exit 1
          fi

          if [[ -d "$CACE_FORMAL_DIR/.lake/packages/mathlib/.git" ]]; then
            test "$(git -C "$CACE_FORMAL_DIR/.lake/packages/mathlib" rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
            mkdir -p "$(dirname "$CACE_PACKAGE_CACHE")"
            exec 9>"$CACE_PACKAGE_CACHE_LOCK"
            flock -w 1800 9
            package_staging="${CACE_PACKAGE_CACHE}.staging.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            rm -rf "$package_staging"
            cp -a --reflink=auto "$CACE_FORMAL_DIR/.lake/packages" "$package_staging"
            test "$(git -C "$package_staging/mathlib" rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
            rm -rf "$CACE_PACKAGE_CACHE"
            mv "$package_staging" "$CACE_PACKAGE_CACHE"
            flock -u 9
            echo 'CACE_DEPENDENCY_CACHE_PROMOTED exact-pin package/build tree.'
          fi

          if [[ -d "$CACE_FORMAL_DIR/.lake/build" && -n "${CACE_FORMAL_BUILD_CACHE:-}" ]]; then
            mkdir -p "$CACE_FORMAL_BUILD_CACHE"
            build_staging="$CACE_FORMAL_BUILD_CACHE/build.staging.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            rm -rf "$build_staging"
            cp -a --reflink=auto "$CACE_FORMAL_DIR/.lake/build" "$build_staging"
            rm -rf "$CACE_FORMAL_BUILD_CACHE/build"
            mv "$build_staging" "$CACE_FORMAL_BUILD_CACHE/build"
            printf '%s\n' "$CACE_FORMAL_TREE_SHA" > "$CACE_FORMAL_BUILD_CACHE/formal_tree_sha.txt"
            printf '%s\n' "$CACE_MATHLIB_COMMIT" > "$CACE_FORMAL_BUILD_CACHE/mathlib_commit.txt"
            printf '%s\n' "$CACE_TOOLCHAIN" > "$CACE_FORMAL_BUILD_CACHE/lean_toolchain.txt"
            echo "CACE_FORMAL_BUILD_CACHE_PROMOTED tree=$CACE_FORMAL_TREE_SHA"
          fi

      - name: Finalize compressed heartbeat and diagnostic manifest
        if: always()
        shell: bash
        env:
          CACE_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ ! -f scripts/finalize_qualification_diagnostics.py ]]; then
            if [[ "$CACE_JOB_STATUS" == success ]]; then
              echo 'Diagnostic finalizer is missing after an otherwise successful job.' >&2
              exit 1
            fi
            echo 'Diagnostic finalizer unavailable after an earlier failure; preserving primary job status.' >&2
            exit 0
          fi
          if ! python scripts/finalize_qualification_diagnostics.py; then
            if [[ "$CACE_JOB_STATUS" == success ]]; then
              echo 'Diagnostic finalizer failed after an otherwise successful job.' >&2
              exit 1
            fi
            echo 'Diagnostic finalizer failed after an earlier failure; preserving primary job status.' >&2
            exit 0
          fi

      - name: Upload qualification diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-v337-qualification-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.CACE_STATUS_DIR }}
            ${{ env.CACE_OUTPUT_DIR }}

      - name: Remove temporary formal build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CACE_BUILD_ROOT:-}" == /var/tmp/cace-v337-qualification.* && -O "$CACE_BUILD_ROOT" && ! -L "$CACE_BUILD_ROOT" ]]; then
            rm -rf -- "$CACE_BUILD_ROOT"
          fi
