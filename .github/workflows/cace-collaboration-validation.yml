name: CACE Collaboration Coordination Validation

on:
  workflow_dispatch:
  pull_request:
    # Keep automatic PR validation inexpensive. Heavy formal proof validation
    # is manual-only via CACE Exact-Pin Lean Preflight / canonical qualification.
    paths:
      - 'collaboration/**'
      - 'quality/**'
      - 'security/**'
      - 'scripts/**'
      - 'ops/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/cace-*.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: cace-canonical-qualification-oci
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Establish exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          printf 'exact_head=%s\n' "$expected"

      - name: Enforce repository-wide CACE Actions serialization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/cace_actions_serialization_guard.py --current-run-id "${GITHUB_RUN_ID}" --ignore-workflow-name "CACE Lean Source Sanity"

      - name: Enforce repository-wide CACE Actions policy
        run: python scripts/audit_cace_actions_policy.py

      - name: Validate collaboration record structure and hashes
        run: python scripts/verify_collaboration_records.py

      - name: Validate collaboration lifecycle
        run: python scripts/validate_collaboration_lifecycle.py

      - name: Bootstrap pinned formal-preflight Python environment
        shell: bash
        env:
          UV_VERSION: '0.12.13'
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" |
            env UV_INSTALL_DIR="$RUNNER_TEMP/uv-collaboration-bin" sh
          "$RUNNER_TEMP/uv-collaboration-bin/uv" python install 3.13.15
          "$RUNNER_TEMP/uv-collaboration-bin/uv" venv --seed --python 3.13.15 "$RUNNER_TEMP/cace-collaboration-tests"
          "$RUNNER_TEMP/cace-collaboration-tests/bin/python" --version
          "$RUNNER_TEMP/cace-collaboration-tests/bin/python" -m pip install --disable-pip-version-check -e '.[test]'
          "$RUNNER_TEMP/cace-collaboration-tests/bin/python" -m pip freeze > collaboration-test-environment.txt

      - name: Run collaboration plus canonical formal-preflight tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cace-collaboration-tests/bin/python" -m pytest -q \
            tests/test_collaboration_records.py \
            tests/test_collaboration_lifecycle.py \
            tests/test_actions_serialization_guard.py \
            tests/test_actions_policy_audit.py \
            tests/test_cace_batch_proof_targets.py \
            tests/test_lean_source_sanity.py \
            tests/test_oci_mcp_policy.py \
            tests/test_cli.py \
            tests/test_claim_registry_v331.py \
            tests/test_qualification_drift_v331.py \
            tests/test_qualification_overlay_v337.py \
            tests/test_qualification_diagnostics_v337.py \
            tests/test_bug_class_registry_v337.py \
            tests/test_research_dynamics_v337.py \
            tests/test_research_geometry_v337.py \
            tests/test_reasoning_curriculum.py \
            tests/test_release_secrecy.py \
            tests/test_export_v330_environment_metadata.py \
            tests/test_continuum_attestation_v337.py \
            tests/test_lean_theorem_metadata_v336.py \
            tests/test_proof_contract_v336.py \
            tests/test_rmk_formal_qualification.py \
            tests/test_qualification_bundle_verifier_v338.py \
            tests/test_qualification_source_binding_v339.py \
            tests/test_qualification_promotion_v339.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$RUNNER_TEMP/cace-collaboration-tests/bin/python" scripts/check_bug_sweep.py

      - name: Verify canonical qualified baseline remains an ancestor
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(python - <<'PY'
          import json
          from pathlib import Path

          claim_id = 'cace.v330.continuum-proof-strengthening'
          claims = json.loads(Path('cace_studio/data/claim_registry.json').read_text())['claims']
          entries = json.loads(Path('cace_studio/data/proof_ledger.json').read_text())['entries']
          claim = next(item for item in claims if item['claim_id'] == claim_id)
          ledger = next(item for item in entries if claim_id in item['claim_ids'])
          qualification = claim['qualification']
          if not qualification.get('current_head_qualified') or not ledger.get('current_head_qualified'):
              raise SystemExit('canonical continuum claim is not current-head qualified')
          if qualification.get('attested_commit') != ledger.get('commit'):
              raise SystemExit('claim registry/proof ledger qualified commit mismatch')
          if qualification.get('proof_artifact_sha256') != ledger.get('proof_artifact_sha256'):
              raise SystemExit('claim registry/proof ledger proof artifact mismatch')
          print(qualification['attested_commit'])
          PY
          )"
          git merge-base --is-ancestor "$baseline" HEAD
          printf 'qualified_baseline=%s\n' "$baseline"

      - name: Emit engineering-only validation summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess

          # Hash repository evidence only. Runtime environments and caches are
          # execution state rather than source evidence and must not be swept into
          # this engineering summary.
          source_prefixes = (
            'collaboration/',
            'quality/',
            'security/',
            'formal/',
            'cace_studio/',
            'schema/',
            'scripts/',
            'ops/',
            'tests/',
          )
          tracked = subprocess.check_output(['git', 'ls-files', '-z'])
          files = set()
          for raw in tracked.split(b'\\0'):
            if not raw:
              continue
            rel = raw.decode('utf-8')
            in_scope = (
              rel == 'pyproject.toml'
              or any(rel.startswith(prefix) for prefix in source_prefixes)
              or (rel.startswith('.github/workflows/cace-') and rel.endswith('.yml'))
            )
            if in_scope:
              path = pathlib.Path(rel)
              if not path.is_file():
                raise SystemExit(f'tracked validation source missing from checkout: {rel}')
              files.add(path)
          files = sorted(files)

          claim_id='cace.v330.continuum-proof-strengthening'
          claims=json.loads(pathlib.Path('cace_studio/data/claim_registry.json').read_text())['claims']
          entries=json.loads(pathlib.Path('cace_studio/data/proof_ledger.json').read_text())['entries']
          claim=next(item for item in claims if item['claim_id']==claim_id)
          ledger=next(item for item in entries if claim_id in item['claim_ids'])
          qualification=claim['qualification']
          if qualification.get('attested_commit') != ledger.get('commit'):
            raise SystemExit('claim registry/proof ledger qualified commit mismatch')
          if qualification.get('proof_artifact_sha256') != ledger.get('proof_artifact_sha256'):
            raise SystemExit('claim registry/proof ledger proof artifact mismatch')
          summary={
            'schema':'cace-collaboration-validation-v9',
            'evidence_class':'ENGINEERING_VERIFIED',
            'proof_implication':'none',
            'head_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'qualified_baseline':qualification['attested_commit'],
            'qualified_proof_artifact_sha256':qualification['proof_artifact_sha256'],
            'covered_file_count':len(files),
            'sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
          }
          pathlib.Path('collaboration-validation-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-collaboration-validation
          path: |
            collaboration-validation-summary.json
            collaboration-test-environment.txt
          if-no-files-found: error
