name: CACE Collaboration Coordination Validation

on:
  workflow_dispatch:
  pull_request:
    # Keep automatic PR validation inexpensive. Heavy formal proof validation
    # is manual-only via CACE Exact-Pin Lean Preflight / canonical qualification.
    paths:
      - 'collaboration/**'
      - 'quality/**'
      - 'security/**'
      - 'scripts/**'
      - 'ops/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/cace-*.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: cace-canonical-qualification-oci
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 20
    env:
      CACE_ARTIFACT_DIR: cace-collaboration-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - name: Establish exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          printf 'exact_head=%s\n' "$expected"

      - name: Prepare bounded evidence directory
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/$CACE_ARTIFACT_DIR"
          if [[ -e "$artifact_dir" ]]; then
            echo "refusing to overwrite existing evidence directory"
            exit 1
          fi
          mkdir -p "$artifact_dir"

      - name: Capture exact PR checkout file manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          head_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tracked = subprocess.check_output(["git", "ls-files", "--stage", "-z"])
          tracked_files = []
          missing_tracked = []
          for raw in tracked.split(b'\0'):
              if not raw:
                  continue
              metadata, raw_path = raw.split(b'\t', 1)
              mode, blob_sha, stage = metadata.decode("ascii").split()
              rel = raw_path.decode("utf-8")
              if mode == "160000":
                  tracked_files.append({
                      "path": rel, "mode": mode, "gitlink_commit_sha": blob_sha,
                      "sha256": None, "size_bytes": None,
                  })
                  continue
              path = pathlib.Path(rel)
              if path.is_symlink():
                  payload = os.fsencode(os.readlink(path))
              elif path.is_file():
                  payload = path.read_bytes()
              else:
                  missing_tracked.append(rel)
                  continue
              tracked_files.append({
                  "path": rel, "mode": mode, "git_blob_sha": blob_sha,
                  "sha256": hashlib.sha256(payload).hexdigest(),
                  "size_bytes": len(payload),
              })
          tracked_files.sort(key=lambda item: item["path"])
          modified = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD", "--"], text=True
          ).splitlines()
          staged = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          raw_untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard", "-z"]
          )
          untracked = [x.decode("utf-8") for x in raw_untracked.split(b'\0') if x]
          safe_suffixes = {
              ".py", ".md", ".json", ".yml", ".yaml", ".toml", ".txt",
              ".ts", ".tsx", ".js", ".jsx", ".html", ".css", ".lean",
              ".sh", ".sql", ".csv",
          }
          sensitive_tokens = {
              ".env", ".ssh", ".oci", ".aws", "credential", "secret",
              "token", "private", "key", "cache", "node_modules", ".lake",
              ".venv", "venv",
          }
          candidates = []
          excluded = 0
          for rel in untracked:
              path = pathlib.Path(rel)
              parts = {part.lower() for part in path.parts}
              sensitive = any(token in part for part in parts for token in sensitive_tokens)
              sensitive = sensitive or path.name.lower().startswith(".env")
              if sensitive or path.suffix.lower() not in safe_suffixes or not path.is_file():
                  excluded += 1
                  continue
              payload = path.read_bytes()
              candidates.append({
                  "path": rel,
                  "sha256": hashlib.sha256(payload).hexdigest(),
                  "size_bytes": len(payload),
                  "saved_in_git_head": False,
              })
          candidates.sort(key=lambda item: item["path"])
          artifact_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / os.environ["CACE_ARTIFACT_DIR"]
          manifest = {
              "schema": "cace-oci-pr-checkout-manifest-v1",
              "head_sha": head_sha,
              "workspace": os.environ.get("GITHUB_WORKSPACE"),
              "tracked_file_count": len(tracked_files),
              "tracked_files": tracked_files,
              "missing_tracked_paths": sorted(missing_tracked),
              "modified_tracked_paths": sorted(set(modified)),
              "staged_tracked_paths": sorted(set(staged)),
              "untracked_candidate_count": len(candidates),
              "untracked_candidate_files": candidates,
              "excluded_untracked_count": excluded,
              "all_tracked_files_present": not missing_tracked,
              "tracked_worktree_clean": not modified and not staged,
              "scope": "GitHub PR checkout workspace only; not the full OCI filesystem",
              "content_exported": False,
              "host_mutations": False,
          }
          target = artifact_dir / "oci-pr-checkout-manifest.json"
          target.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "head_sha": head_sha,
              "tracked_file_count": len(tracked_files),
              "missing_tracked_count": len(missing_tracked),
              "modified_tracked_count": len(set(modified)),
              "untracked_candidate_count": len(candidates),
              "excluded_untracked_count": excluded,
              "manifest_path": str(target),
          }, indent=2, sort_keys=True))
          PY

      - name: Enforce repository-wide CACE Actions serialization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/cace_actions_serialization_guard.py --current-run-id "${GITHUB_RUN_ID}" --ignore-workflow-name "CACE Lean Source Sanity" --ignore-workflow-name "CACE Collaboration Coordination Validation"

      - name: Enforce repository-wide CACE Actions policy
        run: python scripts/audit_cace_actions_policy.py

      - name: Validate collaboration record structure and hashes
        run: python scripts/verify_collaboration_records.py

      - name: Validate collaboration lifecycle
        run: python scripts/validate_collaboration_lifecycle.py

      - name: Capture read-only OCI runner inventory
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import json
          from pathlib import Path
          from ops.oci_mcp.runner_inventory import collect_runner_status

          artifact_dir = Path(__import__("os").environ["RUNNER_TEMP"]) / __import__("os").environ["CACE_ARTIFACT_DIR"]
          if not artifact_dir.is_dir():
              raise SystemExit("evidence directory was not prepared")
          inventory_path = artifact_dir / "oci-runner-inventory.json"
          if inventory_path.exists():
              raise SystemExit("refusing to overwrite an existing runner inventory")
          inventory = collect_runner_status()
          rendered = json.dumps(inventory, indent=2, sort_keys=True) + "\n"
          inventory_path.write_text(rendered, encoding="utf-8")
          print(rendered)
          PY

      - name: Probe local CACE OCI MCP read-only protocol
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from ops.oci_mcp.health_probe import probe_local_mcp

          result = probe_local_mcp()
          artifact_dir = Path(os.environ["RUNNER_TEMP"]) / os.environ["CACE_ARTIFACT_DIR"]
          (artifact_dir / "mcp-readonly-probe.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          if result["status"] != "succeeded":
              raise SystemExit("required read-only MCP tools were unavailable or returned errors")
          PY

      - name: Bootstrap pinned formal-preflight Python environment
        shell: bash
        env:
          UV_VERSION: '0.12.13'
          UV_INSTALL_DIR: ${{ runner.temp }}/uv-collaboration-bin-${{ github.run_id }}-${{ github.run_attempt }}
          TEST_ENV: ${{ runner.temp }}/cace-collaboration-tests-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" |
            env UV_INSTALL_DIR="$UV_INSTALL_DIR" sh
          "$UV_INSTALL_DIR/uv" python install 3.13.15
          "$UV_INSTALL_DIR/uv" venv --seed --python 3.13.15 "$TEST_ENV"
          "$TEST_ENV/bin/python" --version
          "$TEST_ENV/bin/python" -m pip install --disable-pip-version-check -e '.[test]'
          "$TEST_ENV/bin/python" -m pip freeze > "$RUNNER_TEMP/$CACE_ARTIFACT_DIR/collaboration-test-environment.txt"

      # Compatibility contract retained for the repository bug-class guard:
      # PYTHONPATH="$GITHUB_WORKSPACE" "$RUNNER_TEMP/cace-collaboration-tests/bin/python" scripts/check_bug_sweep.py
      - name: Run collaboration plus canonical formal-preflight tests
        shell: bash
        env:
          TEST_ENV: ${{ runner.temp }}/cace-collaboration-tests-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          "$TEST_ENV/bin/python" -m pytest -q \
            tests/test_collaboration_records.py \
            tests/test_collaboration_lifecycle.py \
            tests/test_actions_serialization_guard.py \
            tests/test_actions_policy_audit.py \
            tests/test_cace_batch_proof_targets.py \
            tests/test_lean_source_sanity.py \
            tests/test_oci_mcp_policy.py \
            tests/test_merlin_rsi_cace_verifier.py \
            tests/test_oci_mcp_runner_inventory.py \
            tests/test_oci_mcp_health_probe.py \
            tests/test_cli.py \
            tests/test_claim_registry_v331.py \
            tests/test_qualification_drift_v331.py \
            tests/test_qualification_overlay_v337.py \
            tests/test_qualification_diagnostics_v337.py \
            tests/test_bug_class_registry_v337.py \
            tests/test_research_dynamics_v337.py \
            tests/test_research_geometry_v337.py \
            tests/test_reasoning_curriculum.py \
            tests/test_release_secrecy.py \
            tests/test_export_v330_environment_metadata.py \
            tests/test_continuum_attestation_v337.py \
            tests/test_lean_theorem_metadata_v336.py \
            tests/test_proof_contract_v336.py \
            tests/test_rmk_formal_qualification.py \
            tests/test_qualification_bundle_verifier_v338.py \
            tests/test_qualification_source_binding_v339.py \
            tests/test_merlin_continuum_cpp_smoke.py collaboration/merlin-continuum/tests/test_continuum_structure_ir.py \
            tests/test_qualification_promotion_v339.py
          PYTHONPATH="$GITHUB_WORKSPACE" "$TEST_ENV/bin/python" scripts/check_bug_sweep.py

      - name: Verify canonical qualified baseline remains an ancestor
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(python - <<'PY'
          import json
          from pathlib import Path

          claim_id = 'cace.v330.continuum-proof-strengthening'
          claims = json.loads(Path('cace_studio/data/claim_registry.json').read_text())['claims']
          entries = json.loads(Path('cace_studio/data/proof_ledger.json').read_text())['entries']
          claim = next(item for item in claims if item['claim_id'] == claim_id)
          ledger = next(item for item in entries if claim_id in item['claim_ids'])
          qualification = claim['qualification']
          if not qualification.get('current_head_qualified') or not ledger.get('current_head_qualified'):
              raise SystemExit('canonical continuum claim is not current-head qualified')
          if qualification.get('attested_commit') != ledger.get('commit'):
              raise SystemExit('claim registry/proof ledger qualified commit mismatch')
          if qualification.get('proof_artifact_sha256') != ledger.get('proof_artifact_sha256'):
              raise SystemExit('claim registry/proof ledger proof artifact mismatch')
          print(qualification['attested_commit'])
          PY
          )"
          git merge-base --is-ancestor "$baseline" HEAD
          printf 'qualified_baseline=%s\n' "$baseline"

      - name: Emit engineering-only validation summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess

          # Hash repository evidence only. Runtime environments and caches are
          # execution state rather than source evidence and must not be swept into
          # this engineering summary.
          tracked = subprocess.check_output(['git', 'ls-files', '--stage', '-z'])
          tracked_hashes = {}
          missing_tracked = []
          for raw in tracked.split(b'\0'):
            if not raw:
              continue
            metadata, raw_path = raw.split(b'\t', 1)
            mode, blob_sha, stage = metadata.decode('ascii').split()
            rel = raw_path.decode('utf-8')
            if mode == '160000':
              tracked_hashes[rel] = {
                'mode': mode,
                'gitlink_commit_sha': blob_sha,
                'sha256': None,
              }
              continue
            path = pathlib.Path(rel)
            if path.is_symlink():
              payload = os.fsencode(os.readlink(path))
            elif path.is_file():
              payload = path.read_bytes()
            else:
              missing_tracked.append(rel)
              continue
            tracked_hashes[rel] = {
              'mode': mode,
              'git_blob_sha': blob_sha,
              'sha256': hashlib.sha256(payload).hexdigest(),
              'size_bytes': len(payload),
            }
          if missing_tracked:
            raise SystemExit('tracked files missing from runner checkout: ' + ', '.join(missing_tracked[:20]))

          modified_tracked = subprocess.check_output(
            ['git', 'diff', '--name-only', 'HEAD', '--'], text=True
          ).splitlines()
          staged_tracked = subprocess.check_output(
            ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()
          untracked_raw = subprocess.check_output(
            ['git', 'ls-files', '--others', '--exclude-standard', '-z']
          )
          untracked_paths = [raw.decode('utf-8') for raw in untracked_raw.split(b'\0') if raw]
          safe_suffixes = {
            '.py', '.md', '.json', '.yml', '.yaml', '.toml', '.txt',
            '.ts', '.tsx', '.js', '.jsx', '.html', '.css', '.lean',
            '.sh', '.sql', '.csv'
          }
          sensitive_tokens = {
            '.env', '.ssh', '.oci', '.aws', 'credential', 'secret',
            'token', 'private', 'key', 'cache', 'node_modules', '.lake',
            '.venv', 'venv'
          }
          untracked_candidates = []
          excluded_untracked_count = 0
          for rel in untracked_paths:
            path = pathlib.Path(rel)
            parts = {part.lower() for part in path.parts}
            suffix = path.suffix.lower()
            sensitive = any(
              token in part for part in parts for token in sensitive_tokens
            ) or path.name.lower().startswith('.env')
            if sensitive or suffix not in safe_suffixes or not path.is_file():
              excluded_untracked_count += 1
              continue
            untracked_candidates.append({
              'path': rel,
              'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'size_bytes': path.stat().st_size,
              'saved_in_git_head': False,
            })
          untracked_candidates.sort(key=lambda item: item['path'])

          claim_id='cace.v330.continuum-proof-strengthening'
          claims=json.loads(pathlib.Path('cace_studio/data/claim_registry.json').read_text())['claims']
          entries=json.loads(pathlib.Path('cace_studio/data/proof_ledger.json').read_text())['entries']
          claim=next(item for item in claims if item['claim_id']==claim_id)
          ledger=next(item for item in entries if claim_id in item['claim_ids'])
          qualification=claim['qualification']
          if qualification.get('attested_commit') != ledger.get('commit'):
            raise SystemExit('claim registry/proof ledger qualified commit mismatch')
          if qualification.get('proof_artifact_sha256') != ledger.get('proof_artifact_sha256'):
            raise SystemExit('claim registry/proof ledger proof artifact mismatch')
          summary={
            'schema':'cace-collaboration-validation-v10',
            'evidence_class':'ENGINEERING_VERIFIED',
            'proof_implication':'none',
            'head_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'qualified_baseline':qualification['attested_commit'],
            'qualified_proof_artifact_sha256':qualification['proof_artifact_sha256'],
            'tracked_file_count':len(tracked_hashes),
            'tracked_file_sha256':tracked_hashes,
            'modified_tracked_paths':sorted(set(modified_tracked)),
            'staged_tracked_paths':sorted(set(staged_tracked)),
            'untracked_candidate_count':len(untracked_candidates),
            'untracked_candidate_files':untracked_candidates,
            'excluded_untracked_count':excluded_untracked_count,
            'all_tracked_files_present':not missing_tracked,
          }
          artifact_dir = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['CACE_ARTIFACT_DIR']
          (artifact_dir / 'collaboration-validation-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cace-collaboration-validation
          path: ${{ runner.temp }}/cace-collaboration-artifacts-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
