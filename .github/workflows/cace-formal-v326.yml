name: CACE Formal v3.26

# Historical validation workflow. Manual-only so current CACE work cannot fan out
# into overlapping proof jobs; the canonical exact-head qualification path owns
# formal acceptance.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuum-sobolev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean toolchain
        working-directory: formal/cace_formal
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(cat lean-toolchain)"
          elan toolchain install "$TOOLCHAIN"
          elan default "$TOOLCHAIN"
          lean --version
          lake --version

      - name: Resolve pinned mathlib
        working-directory: formal/cace_formal
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Check continuum proof source is closed
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\bsorry\b|\badmit\b|OPEN OBLIGATION' formal/cace_formal/CACEFormal/ContinuumSobolev.lean; then
            echo 'Unclosed v3.26 proof obligation found.' >&2
            exit 1
          fi

      - name: Compile v3.26 continuum Sobolev module
        working-directory: formal/cace_formal
        shell: bash
        env:
          LEAN_ABORT_ON_PANIC: '1'
        run: |
          set -euo pipefail
          lake env lean CACEFormal/ContinuumSobolev.lean
          lake build CACEFormal

      - name: Write v3.26 attestation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          def out(cmd, cwd=None):
              return subprocess.check_output(cmd, cwd=cwd, text=True).strip()
          data = {
              'release': '3.26.0',
              'status': 'PASS',
              'commit': out(['git', 'rev-parse', 'HEAD']),
              'lean_version': out(['lean', '--version']),
              'theorems': [
                  'CACEFormal.Continuum.h1_weakPartial_l2',
                  'CACEFormal.Continuum.h1_l2',
                  'CACEFormal.Continuum.hdiv_component_l2',
                  'CACEFormal.Continuum.hdiv_divergence_l2',
              ],
              'interfaces': [
                  'CACEFormal.Continuum.InH1',
                  'CACEFormal.Continuum.InHDiv',
                  'CACEFormal.Continuum.distributionalDivergence',
              ],
              'scope': 'whole-space Bessel-potential Sobolev/distributional core on R^n',
              'nonclaims': [
                  'No bounded-domain normal trace theorem is claimed in v3.26.',
                  'No general Lipschitz-domain weak Green identity is claimed in v3.26.',
              ],
          }
          open('v326_github_formal_build_attestation.json', 'w', encoding='utf-8').write(
              json.dumps(data, indent=2, sort_keys=True) + '\n\n'
          )
          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      - name: Upload v3.26 attestation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cace-v326-formal-attestation
          path: v326_github_formal_build_attestation.json
