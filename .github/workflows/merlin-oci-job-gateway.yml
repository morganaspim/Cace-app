name: Merlin OCI typed job gateway

on:
  push:
    branches:
      - 'merlin/oci-jobs/**'
    paths:
      - 'merlin/oci-requests/**'

permissions:
  contents: read

concurrency:
  group: merlin-oci-job-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-approved-profile:
    if: github.event_name == 'push'
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Validate request and execute fixed inventory profile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import types
          import urllib.parse
          import urllib.request
          import uuid
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["GITHUB_SHA"]
          event_path = Path(os.environ["GITHUB_EVENT_PATH"])
          token = os.environ["GITHUB_TOKEN"]
          event = json.loads(event_path.read_text(encoding="utf-8"))

          if not os.environ.get("GITHUB_REF", "").startswith("refs/heads/merlin/oci-jobs/"):
              raise SystemExit("request rejected: branch is outside the OCI job namespace")

          def fetch_json(url: str) -> dict:
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Merlin-OCI-Job-Gateway",
                  },
              )
              with urllib.request.urlopen(req, timeout=12) as response:
                  return json.loads(response.read().decode("utf-8"))

          commit_details = fetch_json(f"https://api.github.com/repos/{repo}/commits/{commit}")
          changed_files = commit_details.get("files") or []
          if len(changed_files) != 1 or changed_files[0].get("status") not in {"added", "modified"}:
              raise SystemExit("request rejected: commit must add or modify exactly one request file")

          request_path = changed_files[0].get("filename", "")
          match = re.fullmatch(r"merlin/oci-requests/([0-9a-fA-F-]{36})\.json", request_path)
          if not match:
              raise SystemExit("request rejected: invalid request path")
          path_request_id = str(uuid.UUID(match.group(1)))

          def fetch_contents(path: str) -> tuple[bytes, str]:
              encoded_path = urllib.parse.quote(path, safe="/")
              url = f"https://api.github.com/repos/{repo}/contents/{encoded_path}?ref={commit}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Merlin-OCI-Job-Gateway",
                  },
              )
              with urllib.request.urlopen(req, timeout=12) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if payload.get("encoding") != "base64" or not isinstance(payload.get("content"), str):
                  raise SystemExit(f"request rejected: unsupported GitHub content encoding for {path}")
              raw = base64.b64decode("".join(payload["content"].split()), validate=True)
              return raw, str(payload.get("sha", ""))

          request_bytes, request_blob_sha = fetch_contents(request_path)
          request = json.loads(request_bytes.decode("utf-8"))
          expected_fields = {"schema", "request_id", "operation", "reason", "created_at"}
          if not isinstance(request, dict) or set(request) != expected_fields:
              raise SystemExit("request rejected: schema fields do not match the allowlisted contract")
          if request["schema"] != "merlin-oci-job-request-v1":
              raise SystemExit("request rejected: unsupported schema")
          if str(uuid.UUID(request["request_id"])) != path_request_id:
              raise SystemExit("request rejected: request ID does not match its path")
          if request["operation"] != "inventory_snapshot":
              raise SystemExit("request rejected: operation is not enabled")
          reason = request["reason"]
          if not isinstance(reason, str) or not reason.strip() or len(reason) > 300:
              raise SystemExit("request rejected: reason must be 1-300 characters")
          created_at = request["created_at"]
          if not isinstance(created_at, str) or len(created_at) > 40:
              raise SystemExit("request rejected: invalid created_at")
          datetime.fromisoformat(created_at.replace("Z", "+00:00"))

          # Pin the executable inventory module to the reviewed blob from PR #85.
          module_path = "ops/oci_mcp/runner_inventory.py"
          module_bytes, module_blob_sha = fetch_contents(module_path)
          expected_module_blob_sha = "bb9f789e3cf0f76356dea0eab5e693ac91ef5838"
          if module_blob_sha != expected_module_blob_sha:
              raise SystemExit("request rejected: runner inventory module blob is not the reviewed version")
          module_sha256 = hashlib.sha256(module_bytes).hexdigest()
          module = types.ModuleType("merlin_oci_runner_inventory")
          module.__file__ = module_path
          exec(compile(module_bytes.decode("utf-8"), module_path, "exec"), module.__dict__)

          artifact_dir = (
              Path(os.environ["RUNNER_TEMP"])
              / f"merlin-oci-job-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          )
          if artifact_dir.exists():
              raise SystemExit("refusing to overwrite an existing job artifact directory")
          artifact_dir.mkdir(parents=True)

          started_at = datetime.now(timezone.utc).isoformat()
          inventory = module.collect_runner_status()
          completed_at = datetime.now(timezone.utc).isoformat()
          receipt = {
              "schema": "merlin-oci-job-receipt-v1",
              "request_id": path_request_id,
              "request_blob_sha": request_blob_sha,
              "request_sha256": hashlib.sha256(request_bytes).hexdigest(),
              "operation": "inventory_snapshot",
              "actor_id": (event.get("sender") or {}).get("login", "unknown"),
              "repository": repo,
              "request_commit_sha": commit,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name": os.environ.get("RUNNER_NAME", "unknown"),
              "runner_os": os.environ.get("RUNNER_OS", "unknown"),
              "runner_arch": os.environ.get("RUNNER_ARCH", "unknown"),
              "inventory_module_blob_sha": module_blob_sha,
              "inventory_module_sha256": module_sha256,
              "started_at_utc": started_at,
              "completed_at_utc": completed_at,
              "status": "succeeded",
              "qualification": False,
              "proof_implication": "none",
              "host_mutations": False,
              "arbitrary_shell_enabled": False,
              "resource_limits": {
                  "job_timeout_minutes": 3,
                  "per_probe_timeout_seconds": 5,
                  "network_scope": "GitHub API content reads only",
                  "package_installation": False,
                  "cache_mutation": False,
              },
              "inventory": inventory,
          }
          (artifact_dir / "job-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (artifact_dir / "runner-inventory.json").write_text(
              json.dumps(inventory, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({k: v for k, v in receipt.items() if k != "inventory"}, indent=2, sort_keys=True))
          print("MERLIN_OCI_JOB_STATUS=succeeded")
          PY

      - name: Upload job receipt and inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merlin-oci-job-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merlin-oci-job-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
