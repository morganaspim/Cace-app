name: Merlin OCI typed job gateway

on:
  push:
    branches:
      - 'merlin/oci-jobs/**'
    paths:
      - 'merlin/oci-requests/**'

permissions:
  contents: read

concurrency:
  group: merlin-oci-job-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-approved-profile:
    if: github.event_name == 'push'
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Validate request and execute fixed inventory profile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import ctypes.util
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import types
          import urllib.parse
          import urllib.request
          import uuid
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["GITHUB_SHA"]
          event_path = Path(os.environ["GITHUB_EVENT_PATH"])
          token = os.environ["GITHUB_TOKEN"]
          event = json.loads(event_path.read_text(encoding="utf-8"))

          if not os.environ.get("GITHUB_REF", "").startswith("refs/heads/merlin/oci-jobs/"):
              raise SystemExit("request rejected: branch is outside the OCI job namespace")

          def fetch_json(url: str) -> dict:
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Merlin-OCI-Job-Gateway",
                  },
              )
              with urllib.request.urlopen(req, timeout=12) as response:
                  return json.loads(response.read().decode("utf-8"))

          commit_details = fetch_json(f"https://api.github.com/repos/{repo}/commits/{commit}")
          changed_files = commit_details.get("files") or []
          if len(changed_files) != 1 or changed_files[0].get("status") not in {"added", "modified"}:
              raise SystemExit("request rejected: commit must add or modify exactly one request file")

          request_path = changed_files[0].get("filename", "")
          match = re.fullmatch(r"merlin/oci-requests/([0-9a-fA-F-]{36})\.json", request_path)
          if not match:
              raise SystemExit("request rejected: invalid request path")
          path_request_id = str(uuid.UUID(match.group(1)))

          def fetch_contents(path: str) -> tuple[bytes, str]:
              encoded_path = urllib.parse.quote(path, safe="/")
              url = f"https://api.github.com/repos/{repo}/contents/{encoded_path}?ref={commit}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Merlin-OCI-Job-Gateway",
                  },
              )
              with urllib.request.urlopen(req, timeout=12) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if payload.get("encoding") != "base64" or not isinstance(payload.get("content"), str):
                  raise SystemExit(f"request rejected: unsupported GitHub content encoding for {path}")
              raw = base64.b64decode("".join(payload["content"].split()), validate=True)
              return raw, str(payload.get("sha", ""))

          request_bytes, request_blob_sha = fetch_contents(request_path)
          request = json.loads(request_bytes.decode("utf-8"))
          base_fields = {"schema", "request_id", "operation", "reason", "created_at"}
          cace_fields = {
              "candidate_id", "candidate_digest", "benchmark_manifest_sha256",
              "evaluator_receipt_sha256", "source_repo", "source_commit",
              "expected_bundle_sha256",
          }
          cpp_test_fields = {"source_repo", "source_commit", "cpp_blob_shas"}
          operation = request.get("operation") if isinstance(request, dict) else None
          allowed_operations = {
              "inventory_snapshot", "mcp_readonly_probe", "rsi_validation",
              "cace_rsi_bundle_contract", "merlin_cpp_ledger_tests",
          }
          if not isinstance(request, dict) or not base_fields.issubset(request):
              raise SystemExit("request rejected: base schema fields are missing")
          if not isinstance(operation, str) or operation not in allowed_operations:
              raise SystemExit("request rejected: operation is not enabled")
          if operation == "rsi_validation":
              expected_fields = base_fields | {"source_repo", "source_commit"}
          elif operation == "cace_rsi_bundle_contract":
              expected_fields = base_fields | cace_fields
          elif operation == "merlin_cpp_ledger_tests":
              expected_fields = base_fields | cpp_test_fields
          else:
              expected_fields = base_fields
          if set(request) != expected_fields:
              raise SystemExit("request rejected: schema fields do not match the fixed operation contract")
          if request["schema"] != "merlin-oci-job-request-v1":
              raise SystemExit("request rejected: unsupported schema")
          if str(uuid.UUID(request["request_id"])) != path_request_id:
              raise SystemExit("request rejected: request ID does not match its path")
          if operation == "rsi_validation":
              if request["source_repo"] != "Mannyspiro/expert-robot":
                  raise SystemExit("request rejected: RSI source repository is not allowlisted")
              if request["source_commit"] != "e4fcb16ced5b6ff9e2f64f73869695d640eb1c27":
                  raise SystemExit("request rejected: RSI source commit is not the pinned snapshot")
          reason = request["reason"]
          if not isinstance(reason, str) or not reason.strip() or len(reason) > 300:
              raise SystemExit("request rejected: reason must be 1-300 characters")
          created_at = request["created_at"]
          if not isinstance(created_at, str) or len(created_at) > 40:
              raise SystemExit("request rejected: invalid created_at")
          datetime.fromisoformat(created_at.replace("Z", "+00:00"))

          # Pin the executable inventory module to the reviewed blob from PR #85.
          module_path = "ops/oci_mcp/runner_inventory.py"
          module_bytes, module_blob_sha = fetch_contents(module_path)
          expected_module_blob_sha = "bb9f789e3cf0f76356dea0eab5e693ac91ef5838"
          if module_blob_sha != expected_module_blob_sha:
              raise SystemExit("request rejected: runner inventory module blob is not the reviewed version")
          module_sha256 = hashlib.sha256(module_bytes).hexdigest()
          module = types.ModuleType("merlin_oci_runner_inventory")
          module.__file__ = module_path
          exec(compile(module_bytes.decode("utf-8"), module_path, "exec"), module.__dict__)

          artifact_dir = (
              Path(os.environ["RUNNER_TEMP"])
              / f"merlin-oci-job-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          )
          if artifact_dir.exists():
              raise SystemExit("refusing to overwrite an existing job artifact directory")
          artifact_dir.mkdir(parents=True)

          def probe_local_mcp() -> dict:
              endpoint = "http://127.0.0.1:8765/mcp"
              session_id = None
              protocol_version = "2025-03-26"

              def rpc(method: str, request_id, params=None):
                  nonlocal session_id
                  payload = {"jsonrpc": "2.0", "method": method}
                  if request_id is not None:
                      payload["id"] = request_id
                  if params is not None:
                      payload["params"] = params
                  headers = {
                      "Content-Type": "application/json",
                      "Accept": "application/json, text/event-stream",
                      "MCP-Protocol-Version": protocol_version,
                  }
                  if session_id:
                      headers["Mcp-Session-Id"] = session_id
                  req = urllib.request.Request(
                      endpoint,
                      data=json.dumps(payload).encode("utf-8"),
                      headers=headers,
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=8) as response:
                          response_body = response.read(1024 * 1024 + 1)
                          if len(response_body) > 1024 * 1024:
                              raise RuntimeError("MCP response exceeded the 1 MiB limit")
                          response_type = response.headers.get("Content-Type", "")
                          session_id = response.headers.get("Mcp-Session-Id", session_id)
                  except Exception as exc:
                      raise RuntimeError(f"MCP HTTP request failed: {type(exc).__name__}") from None
                  if not response_body:
                      return {}
                  text_body = response_body.decode("utf-8", errors="replace")
                  if "text/event-stream" in response_type:
                      blocks = []
                      current = []
                      for line in text_body.splitlines():
                          if line.startswith("data:"):
                              current.append(line[5:].lstrip())
                          elif not line and current:
                              blocks.append("\n".join(current))
                              current = []
                      if current:
                          blocks.append("\n".join(current))
                      messages = [json.loads(block) for block in blocks if block and block != "[DONE]"]
                      if not messages:
                          raise RuntimeError("MCP SSE response contained no JSON-RPC message")
                      message = messages[-1]
                  else:
                      message = json.loads(text_body)
                  if isinstance(message, dict) and message.get("error"):
                      raise RuntimeError("MCP JSON-RPC returned an error")
                  return message

              initialized = rpc(
                  "initialize",
                  1,
                  {
                      "protocolVersion": protocol_version,
                      "capabilities": {},
                      "clientInfo": {"name": "merlin-oci-job-gateway", "version": "1.0.0"},
                  },
              )
              init_result = initialized.get("result") or {}
              negotiated_version = init_result.get("protocolVersion")
              if not negotiated_version:
                  raise RuntimeError("MCP initialize response omitted protocolVersion")
              protocol_version = negotiated_version
              rpc("notifications/initialized", None)
              listed = rpc("tools/list", 2, {})
              tools = (listed.get("result") or {}).get("tools") or []
              tool_names = sorted(
                  tool.get("name") for tool in tools
                  if isinstance(tool, dict) and isinstance(tool.get("name"), str)
              )
              results = {}
              for request_id, tool_name in enumerate(
                  ("get_control_capabilities", "get_cace_runtime_status", "get_github_runner_status"),
                  start=3,
              ):
                  if tool_name not in tool_names:
                      results[tool_name] = {"available": False}
                      continue
                  response = rpc(
                      "tools/call",
                      request_id,
                      {"name": tool_name, "arguments": {}},
                  )
                  result = response.get("result") or {}
                  results[tool_name] = {
                      "available": True,
                      "is_error": bool(result.get("isError", False)),
                      "structured_content": result.get("structuredContent"),
                      "content": result.get("content", []),
                  }
              required_tools_ok = all(
                  results.get(name, {}).get("available") and not results.get(name, {}).get("is_error")
                  for name in ("get_control_capabilities", "get_cace_runtime_status")
              )
              return {
                  "status": "succeeded" if required_tools_ok else "partial",
                  "endpoint": endpoint,
                  "protocol_version": protocol_version,
                  "tool_names": tool_names,
                  "read_only_tool_results": results,
              }

          started_at = datetime.now(timezone.utc).isoformat()
          inventory = module.collect_runner_status()
          mcp_probe = None
          if request["operation"] == "mcp_readonly_probe":
              try:
                  mcp_probe = probe_local_mcp()
              except Exception as exc:
                  mcp_probe = {
                      "status": "failed",
                      "error_type": type(exc).__name__,
                      "error_message": str(exc)[:300],
                  }
          rsi_validation = None
          if request["operation"] == "rsi_validation":
              try:
                  import cryptography
              except ImportError:
                  raise SystemExit("RSI validation unavailable: cryptography is not preinstalled; no packages will be installed")
              profile_root = artifact_dir / "rsi-workspace"
              profile_files = {
                  "python/merlin/rsi_pipeline.py": (
                      "merlin/rsi-validation/python/merlin/rsi_pipeline.py",
                      "34557113cf335694a77222a74d57ef5cdc6c2e6e",
                  ),
                  "tests/test_rsi_pipeline.py": (
                      "merlin/rsi-validation/tests/test_rsi_pipeline.py",
                      "65599d63c12aedea7dfe66dc894936e07b89472f",
                  ),
                  "config/benchmarks/merlin_rsi_multidomain_holdout_v1.json": (
                      "merlin/rsi-validation/config/benchmarks/merlin_rsi_multidomain_holdout_v1.json",
                      "e38004514228b84ac052dace756d00f3022524b6",
                  ),
              }
              file_receipts = {}
              for relative_path, (repository_path, expected_blob_sha) in profile_files.items():
                  file_bytes, actual_blob_sha = fetch_contents(repository_path)
                  if actual_blob_sha != expected_blob_sha:
                      raise SystemExit("RSI validation rejected: pinned source snapshot blob mismatch for " + relative_path)
                  target = profile_root / relative_path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(file_bytes)
                  file_receipts[relative_path] = {
                      "repository_blob_sha": actual_blob_sha,
                      "sha256": hashlib.sha256(file_bytes).hexdigest(),
                      "size_bytes": len(file_bytes),
                  }
              benchmark = json.loads((profile_root / "config/benchmarks/merlin_rsi_multidomain_holdout_v1.json").read_text(encoding="utf-8"))
              if benchmark.get("status") != "frozen" or len(benchmark.get("cases", [])) != 25:
                  raise SystemExit("RSI validation rejected: pinned benchmark contract invalid")
              test_env = dict(os.environ)
              test_env["PYTHONPATH"] = str(profile_root / "python")
              compile_result = subprocess.run(
                  [sys.executable, "-m", "py_compile", "python/merlin/rsi_pipeline.py"],
                  cwd=profile_root, env=test_env, capture_output=True, text=True, timeout=90,
              )
              test_result = None
              if compile_result.returncode == 0:
                  test_result = subprocess.run(
                      [sys.executable, "-m", "unittest", "discover", "-s", "tests", "-p", "test_rsi_pipeline.py", "-v"],
                      cwd=profile_root, env=test_env, capture_output=True, text=True, timeout=180,
                  )
              (artifact_dir / "rsi-pycompile.stdout.txt").write_text(compile_result.stdout[-20000:], encoding="utf-8")
              (artifact_dir / "rsi-pycompile.stderr.txt").write_text(compile_result.stderr[-20000:], encoding="utf-8")
              if test_result is not None:
                  (artifact_dir / "rsi-unittest.stdout.txt").write_text(test_result.stdout[-30000:], encoding="utf-8")
                  (artifact_dir / "rsi-unittest.stderr.txt").write_text(test_result.stderr[-30000:], encoding="utf-8")
              rsi_validation = {
                  "status": "passed" if compile_result.returncode == 0 and test_result is not None and test_result.returncode == 0 else "failed",
                  "source_repo": request["source_repo"],
                  "source_commit": request["source_commit"],
                  "source_files": file_receipts,
                  "benchmark_suite_id": benchmark.get("suite_id"),
                  "benchmark_case_count": len(benchmark.get("cases", [])),
                  "python_version": sys.version.split()[0],
                  "cryptography_version": cryptography.__version__,
                  "compile_returncode": compile_result.returncode,
                  "test_returncode": test_result.returncode if test_result is not None else None,
                  "test_stdout": test_result.stdout[-30000:] if test_result is not None else "",
                  "test_stderr": test_result.stderr[-30000:] if test_result is not None else "",
                  "package_installation": False,
                  "host_mutations": False,
              }
          cace_bundle_contract = None
          if operation == "cace_rsi_bundle_contract":
              digest_fields = (
                  "candidate_digest", "benchmark_manifest_sha256",
                  "evaluator_receipt_sha256", "expected_bundle_sha256",
              )
              if any(not re.fullmatch(r"[0-9a-f]{64}", str(request[name])) for name in digest_fields):
                  raise SystemExit("request rejected: CACE bundle contract requires lowercase SHA-256 digests")
              if not re.fullmatch(r"[0-9a-f]{40}", str(request["source_commit"])):
                  raise SystemExit("request rejected: source_commit must be a 40-character Git commit")
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", str(request["source_repo"])):
                  raise SystemExit("request rejected: source_repo must be owner/name")
              if not re.fullmatch(r"[A-Za-z0-9._:-]{1,128}", str(request["candidate_id"])):
                  raise SystemExit("request rejected: invalid candidate_id")

              package = types.ModuleType("cace_studio")
              package.__path__ = []
              core_package = types.ModuleType("cace_studio.core")
              core_package.__path__ = []
              sys.modules["cace_studio"] = package
              sys.modules["cace_studio.core"] = core_package

              def load_pinned_cace_module(module_name, path, expected_blob_sha):
                  raw, blob_sha = fetch_contents(path)
                  if blob_sha != expected_blob_sha:
                      raise SystemExit(f"CACE source pin mismatch for {path}")
                  loaded = types.ModuleType(module_name)
                  loaded.__file__ = path
                  loaded.__package__ = module_name.rpartition(".")[0]
                  sys.modules[module_name] = loaded
                  exec(compile(raw.decode("utf-8"), path, "exec"), loaded.__dict__)
                  return blob_sha, loaded

              cace_graph_sha, _ = load_pinned_cace_module(
                  "cace_studio.core.graph", "cace_studio/core/graph.py",
                  "cffb146a6be9becc45f0c6789707766b7c8e4222")
              cace_repro_sha, cace_repro = load_pinned_cace_module(
                  "cace_studio.core.reproducibility", "cace_studio/core/reproducibility.py",
                  "8c6e7cfe7204ee557a112091a9d451e300e43210")
              cace_ledger_sha, cace_ledger = load_pinned_cace_module(
                  "cace_studio.core.evidence_ledger", "cace_studio/core/evidence_ledger.py",
                  "25104f432bb50339d980754a58cbc4a004f504ec")

              manifest = {
                  "schema": "merlin-rsi-evidence-manifest-v1",
                  "candidate_id": request["candidate_id"],
                  "candidate_digest": request["candidate_digest"],
                  "benchmark_manifest_sha256": request["benchmark_manifest_sha256"],
                  "evaluator_receipt_sha256": request["evaluator_receipt_sha256"],
                  "source_repo": request["source_repo"],
                  "source_commit": request["source_commit"],
              }
              manifest_bytes = cace_repro.canonical_json_bytes(manifest)
              bindings = {
                  "candidate_id": request["candidate_id"],
                  "candidate_digest": request["candidate_digest"],
                  "benchmark_manifest_sha256": request["benchmark_manifest_sha256"],
                  "evaluator_receipt_sha256": request["evaluator_receipt_sha256"],
                  "source_repo": request["source_repo"],
                  "source_commit": request["source_commit"],
                  "authority": "verification-only",
              }
              artifact = cace_ledger.EvidenceArtifact.from_bytes(
                  "merlin-rsi-evidence-manifest", manifest_bytes,
                  role="rsi-evidence-manifest", media_type="application/json",
                  path="merlin-rsi-evidence-manifest.json", metadata={})
              bundle = cace_ledger.EvidenceBundle(
                  artifacts=(artifact,), bindings=bindings,
                  notes=("Merlin RSI exact-artifact independent verification",))
              actual_bundle_sha = cace_ledger.verify_bundle(bundle)
              if actual_bundle_sha != request["expected_bundle_sha256"]:
                  raise SystemExit("CACE EvidenceBundle digest does not match the Merlin adapter")
              cace_bundle_contract = {
                  "status": "matched",
                  "bundle_sha256": actual_bundle_sha,
                  "manifest_sha256": hashlib.sha256(manifest_bytes).hexdigest(),
                  "artifact_leaf_sha256": cace_ledger.artifact_leaf_hash(artifact),
                  "pinned_source_blobs": {
                      "graph.py": cace_graph_sha,
                      "reproducibility.py": cace_repro_sha,
                      "evidence_ledger.py": cace_ledger_sha,
                  },
                  "verification_scope": "CACE EvidenceBundle identity only; not a signed attestation or candidate verification",
              }

          cpp_test_results = None
          if operation == "merlin_cpp_ledger_tests":
              if request["source_repo"] != "Mannyspiro/expert-robot":
                  raise SystemExit("request rejected: C++ source repository is not allowlisted")
              if not re.fullmatch(r"[0-9a-f]{40}", str(request["source_commit"])):
                  raise SystemExit("request rejected: C++ source commit must be a 40-character Git commit")
              cpp_blob_names = {
                  "generation_lineage_cpp", "episode_ledger_cpp", "state_machine_cpp",
                  "sha256_cpp", "generation_lineage_hpp", "episode_ledger_hpp",
                  "state_machine_hpp", "sha256_hpp", "personality_hpp",
                  "interoception_hpp", "neuromodulation_hpp",
                  "generation_lineage_test", "episode_ledger_test", "rsi_module",
                  "sqlite3_compat",
              }
              cpp_blob_shas = request["cpp_blob_shas"]
              if not isinstance(cpp_blob_shas, dict) or set(cpp_blob_shas) != cpp_blob_names:
                  raise SystemExit("request rejected: C++ source blob manifest keys do not match fixed allowlist")
              if any(not re.fullmatch(r"[0-9a-f]{40}", str(value)) for value in cpp_blob_shas.values()):
                  raise SystemExit("request rejected: C++ source blob manifest contains an invalid Git SHA")

              compiler = shutil.which("g++") or shutil.which("c++")
              sqlite_library = ctypes.util.find_library("sqlite3")
              sqlite_runtime_loaded = False
              if sqlite_library:
                  try:
                      ctypes.CDLL(sqlite_library)
                      sqlite_runtime_loaded = True
                  except OSError:
                      sqlite_runtime_loaded = False
              if not compiler or not sqlite_runtime_loaded:
                  cpp_test_results = {
                      "status": "unavailable",
                      "reason": "preinstalled C++ compiler or SQLite runtime library is unavailable; no packages were installed",
                      "compiler_found": bool(compiler),
                      "sqlite_runtime_loaded": sqlite_runtime_loaded,
                      "sqlite_library": sqlite_library,
                  }
              else:
                  cpp_test_root = artifact_dir / "merlin-cpp-ledger-validation"
                  if cpp_test_root.exists():
                      raise SystemExit("refusing to overwrite existing C++ validation directory")
                  cpp_test_root.mkdir(parents=True)
                  vendor_map = {
                      "generation_lineage_cpp": ("vendor/merlin-cpp-ledger-validation/cpp/src/growth/generation_lineage.cpp", "cpp/src/growth/generation_lineage.cpp"),
                      "episode_ledger_cpp": ("vendor/merlin-cpp-ledger-validation/cpp/src/research/episode_ledger.cpp", "cpp/src/research/episode_ledger.cpp"),
                      "state_machine_cpp": ("vendor/merlin-cpp-ledger-validation/cpp/src/research/state_machine.cpp", "cpp/src/research/state_machine.cpp"),
                      "sha256_cpp": ("vendor/merlin-cpp-ledger-validation/cpp/src/sha256.cpp", "cpp/src/sha256.cpp"),
                      "generation_lineage_hpp": ("vendor/merlin-cpp-ledger-validation/cpp/include/expert_robot/growth/generation_lineage.hpp", "cpp/include/expert_robot/growth/generation_lineage.hpp"),
                      "episode_ledger_hpp": ("vendor/merlin-cpp-ledger-validation/cpp/include/expert_robot/research/episode_ledger.hpp", "cpp/include/expert_robot/research/episode_ledger.hpp"),
                      "state_machine_hpp": ("vendor/merlin-cpp-ledger-validation/cpp/include/expert_robot/research/state_machine.hpp", "cpp/include/expert_robot/research/state_machine.hpp"),
                      "sha256_hpp": ("vendor/merlin-cpp-ledger-validation/cpp/include/expert_robot/sha256.hpp", "cpp/include/expert_robot/sha256.hpp"),
                      "personality_hpp": ("vendor/merlin-cpp-ledger-validation/cpp/include/expert_robot/cognition/personality.hpp", "cpp/include/expert_robot/cognition/personality.hpp"),
                      "interoception_hpp": ("vendor/merlin-cpp-ledger-validation/cpp/include/expert_robot/cognition/interoception.hpp", "cpp/include/expert_robot/cognition/interoception.hpp"),
                      "neuromodulation_hpp": ("vendor/merlin-cpp-ledger-validation/cpp/include/expert_robot/cognition/neuromodulation.hpp", "cpp/include/expert_robot/cognition/neuromodulation.hpp"),
                      "generation_lineage_test": ("vendor/merlin-cpp-ledger-validation/tests/generation_lineage_smoke.cpp", "tests/generation_lineage_smoke.cpp"),
                      "episode_ledger_test": ("vendor/merlin-cpp-ledger-validation/tests/research_episode_ledger_smoke.cpp", "tests/research_episode_ledger_smoke.cpp"),
                      "rsi_module": ("merlin/rsi-validation/python/merlin/rsi_pipeline.py", "python/merlin/rsi_pipeline.py"),
                      "sqlite3_compat": ("vendor/merlin-cpp-ledger-validation/compat/sqlite3.h", "compat/sqlite3.h"),
                  }
                  copied_cpp = {}
                  for label, (repo_path, relative_path) in vendor_map.items():
                      raw, actual_blob_sha = fetch_contents(repo_path)
                      if actual_blob_sha != cpp_blob_shas[label]:
                          raise SystemExit(f"C++ source blob mismatch for {label}")
                      destination = cpp_test_root / relative_path
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(raw)
                      copied_cpp[label] = {
                          "repo_path": repo_path, "git_blob_sha": actual_blob_sha,
                          "sha256": hashlib.sha256(raw).hexdigest(), "size_bytes": len(raw),
                      }

                  build_dir = cpp_test_root / "build"
                  tmp_dir = cpp_test_root / "tmp"
                  build_dir.mkdir()
                  tmp_dir.mkdir()
                  include_dir = cpp_test_root / "cpp/include"
                  compat_dir = cpp_test_root / "compat"
                  cpp_env = dict(os.environ)
                  cpp_env["TMPDIR"] = str(tmp_dir)
                  cpp_env["TMP"] = str(tmp_dir)
                  cpp_env["TEMP"] = str(tmp_dir)
                  cpp_env["PYTHONPATH"] = str(cpp_test_root / "python")
                  sqlite_link_arg = ("-l:" + Path(sqlite_library).name
                                     if "/" not in sqlite_library else sqlite_library)
                  compiler_version = subprocess.run(
                      [compiler, "--version"], stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT, text=True, timeout=15, check=False).stdout.splitlines()[0]

                  commands = [
                      [compiler, "-std=c++20", "-O0", "-I", str(compat_dir), "-I", str(include_dir),
                       str(cpp_test_root / "tests/generation_lineage_smoke.cpp"),
                       str(cpp_test_root / "cpp/src/growth/generation_lineage.cpp"),
                       str(cpp_test_root / "cpp/src/sha256.cpp"), sqlite_link_arg,
                       "-o", str(build_dir / "generation_lineage_smoke")],
                      [str(build_dir / "generation_lineage_smoke")],
                      [compiler, "-std=c++20", "-O0", "-I", str(compat_dir), "-I", str(include_dir),
                       str(cpp_test_root / "tests/research_episode_ledger_smoke.cpp"),
                       str(cpp_test_root / "cpp/src/research/episode_ledger.cpp"),
                       str(cpp_test_root / "cpp/src/research/state_machine.cpp"),
                       str(cpp_test_root / "cpp/src/sha256.cpp"), sqlite_link_arg,
                       "-o", str(build_dir / "research_episode_ledger_smoke")],
                      [str(build_dir / "research_episode_ledger_smoke")],
                  ]
                  command_results = []
                  for command in commands:
                      completed = subprocess.run(
                          command, cwd=str(cpp_test_root), env=cpp_env,
                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                          text=True, timeout=90, check=False)
                      command_results.append({
                          "command": command, "returncode": completed.returncode,
                          "output": completed.stdout[-12000:],
                      })
                      (artifact_dir / "cpp-test-progress.json").write_text(
                          json.dumps({"commands": command_results}, indent=2, sort_keys=True) + "\n",
                          encoding="utf-8")
                      if completed.returncode != 0:
                          raise SystemExit("fixed C++ ledger compile or smoke test failed:\n" + completed.stdout[-6000:])

                  interop_db = cpp_test_root / "python-cpp-interop.sqlite3"
                  episode_id = "merlin-rsi-python-cpp-interop"
                  python_writer = (
                      "import sys; from merlin.rsi_pipeline import AppendOnlyLedger; "
                      "ledger=AppendOnlyLedger(sys.argv[1]); "
                      "ledger.append('rsi.python_cpp_interop', sys.argv[2], "
                      "{'source_repo':sys.argv[3],'source_commit':sys.argv[4]})"
                  )
                  written = subprocess.run(
                      [sys.executable, "-c", python_writer, str(interop_db), episode_id,
                       request["source_repo"], request["source_commit"]],
                      cwd=str(cpp_test_root), env=cpp_env,
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, timeout=30, check=False)
                  if written.returncode != 0:
                      raise SystemExit("Python-to-C++ interop fixture creation failed")

                  harness_path = cpp_test_root / "python_cpp_ledger_interop.cpp"
                  harness_path.write_text(
                      '#include "expert_robot/research/episode_ledger.hpp"\n'
                      '#include <iostream>\n'
                      'int main(int argc, char** argv) {\n'
                      '  if (argc != 3) return 2;\n'
                      '  expert_robot::research::ResearchEpisodeLedger ledger(argv[1]);\n'
                      '  const auto result = ledger.verify(argv[2]);\n'
                      '  if (!result.valid || result.event_count != 1) {\n'
                      '    std::cerr << "ledger verification failed: " << result.reason << "\\n";\n'
                      '    return 1;\n'
                      '  }\n'
                      '  std::cout << "python_to_cpp_episode_verified root=" << result.root_hash << "\\n";\n'
                      '  return 0;\n'
                      '}\n',
                      encoding="utf-8")
                  interop_binary = build_dir / "python_cpp_ledger_interop"
                  interop_compile = [
                      compiler, "-std=c++20", "-O0", "-I", str(compat_dir), "-I", str(include_dir),
                      str(harness_path), str(cpp_test_root / "cpp/src/research/episode_ledger.cpp"),
                      str(cpp_test_root / "cpp/src/research/state_machine.cpp"),
                      str(cpp_test_root / "cpp/src/sha256.cpp"), sqlite_link_arg,
                      "-o", str(interop_binary),
                  ]
                  compiled = subprocess.run(
                      interop_compile, cwd=str(cpp_test_root), env=cpp_env,
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, timeout=90, check=False)
                  command_results.append({"command": interop_compile,
                      "returncode": compiled.returncode, "output": compiled.stdout[-12000:]})
                  (artifact_dir / "cpp-test-progress.json").write_text(
                      json.dumps({"commands": command_results}, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8")
                  if compiled.returncode != 0:
                      raise SystemExit("Python-to-C++ interop harness compilation failed:\n" + compiled.stdout[-6000:])
                  interop = subprocess.run(
                      [str(interop_binary), str(interop_db), episode_id],
                      cwd=str(cpp_test_root), env=cpp_env,
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, timeout=30, check=False)
                  command_results.append({"command": [str(interop_binary), str(interop_db), episode_id],
                      "returncode": interop.returncode, "output": interop.stdout[-12000:]})
                  (artifact_dir / "cpp-test-progress.json").write_text(
                      json.dumps({"commands": command_results}, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8")
                  if interop.returncode != 0:
                      raise SystemExit("Python-to-C++ research episode interoperability failed:\n" + interop.stdout[-6000:])

                  cpp_test_results = {
                      "status": "passed", "source_repo": request["source_repo"],
                      "source_commit": request["source_commit"],
                      "compiler": compiler, "compiler_version": compiler_version,
                      "sqlite_library": sqlite_library,
                      "sqlite_header_mode": "vendored-minimal-abi-declarations",
                      "source_files": copied_cpp,
                      "commands": command_results,
                      "python_cpp_interop": {
                          "status": "passed", "episode_id": episode_id,
                          "database_sha256": hashlib.sha256(interop_db.read_bytes()).hexdigest(),
                          "output": interop.stdout[-4000:],
                      },
                      "execution_scope": "fixed C++20 compile/smoke tests and Python-to-C++ ledger verification; no package installation; unique runner-temp paths",
                  }

          completed_at = datetime.now(timezone.utc).isoformat()
          receipt = {
              "schema": "merlin-oci-job-receipt-v1",
              "request_id": path_request_id,
              "request_blob_sha": request_blob_sha,
              "request_sha256": hashlib.sha256(request_bytes).hexdigest(),
              "operation": request["operation"],
              "actor_id": (event.get("sender") or {}).get("login", "unknown"),
              "repository": repo,
              "request_commit_sha": commit,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_name": os.environ.get("RUNNER_NAME", "unknown"),
              "runner_os": os.environ.get("RUNNER_OS", "unknown"),
              "runner_arch": os.environ.get("RUNNER_ARCH", "unknown"),
              "inventory_module_blob_sha": module_blob_sha,
              "inventory_module_sha256": module_sha256,
              "started_at_utc": started_at,
              "completed_at_utc": completed_at,
              "status": (
                  rsi_validation["status"] if rsi_validation is not None else
                  "succeeded" if mcp_probe is None or mcp_probe.get("status") == "succeeded" else "completed_with_probe_error"
              ),
              "qualification": False,
              "proof_implication": "none",
              "host_mutations": False,
              "arbitrary_shell_enabled": False,
              "resource_limits": {
                  "job_timeout_minutes": 3,
                  "per_probe_timeout_seconds": 5,
                  "network_scope": "GitHub API content reads plus localhost MCP only" if request["operation"] == "mcp_readonly_probe" else "GitHub API content reads only",
                  "package_installation": False,
                  "cache_mutation": False,
              },
              "inventory": inventory,
              "mcp_probe": mcp_probe,
              "rsi_validation": rsi_validation,
              "cace_bundle_contract": cace_bundle_contract,
              "cpp_test_results": cpp_test_results,
          }
          (artifact_dir / "job-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (artifact_dir / "runner-inventory.json").write_text(
              json.dumps(inventory, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({k: v for k, v in receipt.items() if k != "inventory"}, indent=2, sort_keys=True))
          print("MERLIN_OCI_JOB_STATUS=" + receipt["status"])
          if receipt["status"] != "succeeded" and receipt["status"] != "passed":
              raise SystemExit("approved OCI profile completed with a failed status")
          PY

      - name: Upload job receipt and inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merlin-oci-job-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merlin-oci-job-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
