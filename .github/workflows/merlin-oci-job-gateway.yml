          print("MERLIN_OCI_JOB_STATUS=" + receipt["status"])
          if receipt["status"] != "succeeded":
              raise SystemExit("approved OCI profile failed or was unavailable")
          PY

      - name: Upload job receipt and inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merlin-oci-job-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merlin-oci-job-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
