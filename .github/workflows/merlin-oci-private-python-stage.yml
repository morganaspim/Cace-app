name: Merlin OCI unprivileged CPython private staging

"on":
  push:
    branches: ["merlin/browser-operations-20261121"]
    paths: ["merlin/oci-private-python-stage-requests/**"]

permissions:
  contents: read
  actions: read

concurrency:
  group: merlin-dot-oci-operations
  cancel-in-progress: false

jobs:
  private-stage:
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 12
    steps:
      - name: Admit exact request, verify source and tests, no execution of archive
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          import ast,base64,datetime,hashlib,json,os,platform,re,stat,sys,urllib.request,uuid
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];commit=os.environ['GITHUB_SHA']
          run_id=int(os.environ['GITHUB_RUN_ID']);attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          if (repo!='morganaspim/Cace-app' or
              os.environ['GITHUB_REF']!='refs/heads/merlin/browser-operations-20261121'
              or os.environ.get('RUNNER_NAME')!='cace-oci-a1'
              or os.geteuid()!=1000 or platform.machine()!='aarch64'
              or sys.version_info[:2]!=(3,9) or attempt!=1 or
              not re.fullmatch(r'[0-9a-f]{40}',commit)):
              raise RuntimeError('fixed unprivileged ARM64 runner required')
          root=Path(os.environ['RUNNER_TEMP'])/('merlin-oci-private-python-stage-%d-%d'%(run_id,attempt))
          root.mkdir(mode=0o700,exist_ok=False)
          ev=root/'evidence';ev.mkdir(mode=0o700)
          src=root/'source'
          (src/'scripts').mkdir(mode=0o700,parents=True)
          (src/'tests').mkdir(mode=0o700)
          (root/'stage-parent').mkdir(mode=0o700)
          def unique(pairs):
              d={}
              for k,v in pairs:
                  if k in d: raise ValueError('duplicate JSON key')
                  d[k]=v
              return d
          def api(repository,path):
              url='https://api.github.com/repos/'+repository+'/'+path
              req=urllib.request.Request(url,headers={
                  'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GITHUB_TOKEN']})
              with urllib.request.urlopen(req,timeout=16) as response:
                  data=response.read(2*1024*1024+1)
              if len(data)>2*1024*1024: raise RuntimeError('API byte ceiling')
              return json.loads(data,object_pairs_hook=unique)
          def blob(data):
              return hashlib.sha1(('blob %d\0'%len(data)).encode()+data).hexdigest()
          def fetch(repository,path,ref,pin):
              item=api(repository,'contents/'+path+'?ref='+ref)
              if item.get('encoding')!='base64': raise RuntimeError('unexpected Git content encoding')
              data=base64.b64decode(''.join(item['content'].split()),validate=True)
              if (len(data)!=pin['bytes'] or hashlib.sha256(data).hexdigest()!=pin['sha256']
                  or blob(data)!=pin['git_blob'] or item['sha']!=pin['git_blob']):
                  raise RuntimeError('exact source identity mismatch')
              return data
          stage='request_admission'
          try:
              changes=api(repo,'commits/'+commit).get('files',[])
              if len(changes)!=1 or changes[0].get('status')!='added':
                  raise RuntimeError('one new stage request file required')
              path=changes[0].get('filename','')
              match=re.fullmatch(r'merlin/oci-private-python-stage-requests/([0-9a-f-]{36})\.json',path)
              if not match: raise RuntimeError('wrong request namespace')
              item=api(repo,'contents/'+path+'?ref='+commit)
              raw=base64.b64decode(''.join(item['content'].split()),validate=True)
              if len(raw)>4096 or blob(raw)!=item['sha']: raise RuntimeError('request bytes differ')
              request=json.loads(raw,object_pairs_hook=unique)
              if (set(request)!={'schema','request_id','operation','created_at'}
                  or request['schema']!='merlin-oci-private-python-stage-request/1'
                  or request['operation']!='stage-cpython-3.11.18-aarch64-without-execution'
                  or request['request_id']!=match.group(1)
                  or str(uuid.UUID(request['request_id']))!=request['request_id']
                  or datetime.datetime.strptime(request['created_at'],'%Y-%m-%dT%H:%M:%SZ').strftime(
                        '%Y-%m-%dT%H:%M:%SZ')!=request['created_at']):
                  raise RuntimeError('invalid fixed stage request')
              (ev/'request.json').write_bytes(raw)
              stage='source_admission'
              source_commit='71e6405a3475eb449d150b961915922edd3e9fb0'
              pins={
                'scripts/merlin_python_private_stage.py':{
                  'bytes':13722,'sha256':'2aaf1375f8969006c57e5523e91fd2a5b157990f069503b29764ec38c097ee82',
                  'git_blob':'b78089d302c9dced6cf4ecc9d4a5ccb9cc54bc6b'},
                'tests/test_merlin_python_private_stage.py':{
                  'bytes':9756,'sha256':'7536f2e43ac280e3140b5153b3e49dc48932dd52c7fd29a2960b3ad7d543efd1',
                  'git_blob':'2cdc4160097492eed755c528ae2c40f3696ccee4'}}
              for path,pin in pins.items():
                  source=fetch('Mannyspiro/expert-robot',path,source_commit,pin)
                  ast.parse(source,feature_version=(3,9))
                  (src/path).write_bytes(source)
                  (src/path).chmod(0o600)
              (ev/'admission.json').write_text(json.dumps({
                  'schema':'merlin-oci-cpython-stage-admission/1','request_commit':commit,
                  'source_commit':source_commit,'pins':pins,'archive_artifact_id':14748604091,
                  'interpreter_installed':False,'native_interpreter_executed':False,
                  'model_calls':0,'production_qualified':False},sort_keys=True,indent=2))
              print(json.dumps({'status':'stage_source_admitted','source_commit':source_commit,
                                'host_installation':False,'native_interpreter_executed':False}))
          except BaseException as exc:
              (ev/'failure.json').write_text(json.dumps({
                  'status':'blocked','stage':stage,'error_type':type(exc).__name__,
                  'native_interpreter_executed':False,'production_qualified':False},sort_keys=True))
              raise
          PY
      - name: Download the already reviewed, hash-bound archive evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14748604091
          run-id: 45009078432
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/merlin-oci-private-python-stage-${{ github.run_id }}-${{ github.run_attempt }}/input
      - name: Execute exact old-Python fixture tests and temporary stage, then restore
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os,platform,re,shutil,signal,stat,subprocess,sys,time
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/('merlin-oci-private-python-stage-%s-%s'%(os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT']))
          ev=root/'evidence';parent=root/'stage-parent';download=root/'input'
          source=root/'source';script=source/'scripts/merlin_python_private_stage.py'
          archive=download/'archive.data'
          status='blocked';error=None;stage_leaf=None;cleaned=False
          def require(v,why):
              if not v: raise RuntimeError(why)
          def proc(argv,seconds,log):
              clean={'PATH':'/usr/bin:/bin','LANG':'C','LC_ALL':'C','HOME':'/var/empty',
                     'PYTHONDONTWRITEBYTECODE':'1','TMPDIR':'/tmp'}
              p=subprocess.Popen(argv,cwd='/',env=clean,stdin=subprocess.DEVNULL,
                     stdout=subprocess.PIPE,stderr=subprocess.STDOUT,start_new_session=True)
              try: raw,_=p.communicate(timeout=seconds)
              except subprocess.TimeoutExpired:
                  try: os.killpg(p.pid,signal.SIGKILL)
                  except ProcessLookupError: pass
                  p.communicate(timeout=5)
                  raise RuntimeError('bounded child deadline exceeded')
              require(len(raw)<=128*1024,'bounded child output ceiling')
              log.write_bytes(raw)
              require(p.returncode==0,'child returned nonzero')
              return raw
          try:
              require(os.geteuid()==1000 and platform.machine()=='aarch64' and sys.version_info[:2]==(3,9),
                      'fixed host identity changed')
              require(stat.S_IMODE(os.lstat(root).st_mode)==0o700 and
                      stat.S_IMODE(os.lstat(parent).st_mode)==0o700,
                      'private directory changed')
              require(archive.is_file() and not archive.is_symlink() and archive.stat().st_size==49469868,
                      'expected pinned archive data missing')
              h=hashlib.sha256()
              with archive.open('rb') as f:
                  while True:
                      block=f.read(1024*1024)
                      if not block: break
                      h.update(block)
              require(h.hexdigest()=='623a370be4489d8c35c7a274be02f3007a030618cda29025780beb416c6c8861',
                      'archive hash mismatch')
              test_log=ev/'private-stage-tests.log'
              observed=proc(['/usr/bin/python3','-I','-B','-m','unittest','discover',
                         '-s',str(source/'tests'),'-p','test_merlin_python_private_stage.py','-v'],55,test_log)
              require(b'Ran 14 tests' in observed and b'OK' in observed
                      and b'skipped=' not in observed and b'FAILED' not in observed,
                      '14 native nonroot tests not all accepted')
              result=proc(['/usr/bin/python3','-I','-B',str(script),'--archive',str(archive),
                           '--parent',str(parent),'--stage'],180,ev/'private-stage.stdout')
              receipt=json.loads(result)
              stage_leaf=Path(receipt['staging_path'])
              require(stage_leaf.parent==parent and not stage_leaf.is_symlink() and
                      stat.S_IMODE(os.lstat(stage_leaf).st_mode)==0o700,
                      'stage leaf identity changed')
              require(receipt['archive_members']==4949 and receipt['staged_files']==3900 and
                      receipt['symlink_entries']==1049 and receipt['staged_total_file_bytes']==153418201 and
                      receipt['entrypoint_sha256']=='6cfad927461ace659b09716fad2efa828c6a4b084b7be8181c3982a9f36f464c'
                      and receipt['native_interpreter_executed'] is False and
                      receipt['host_system_installation'] is False and
                      receipt['production_qualified'] is False and receipt['python_startup_verified'] is False,
                      'stage acceptance receipt mismatch')
              entry=stage_leaf/'python/bin/python3.11'
              require(entry.is_file() and entry.stat().st_size==56723673,'staged interpreter identity mismatch')
              h=hashlib.sha256()
              with entry.open('rb') as f:
                  while True:
                      block=f.read(1024*1024)
                      if not block: break
                      h.update(block)
              require(h.hexdigest()==receipt['entrypoint_sha256'],'staged interpreter SHA differs')
              (ev/'stage-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2))
              status='stage_verified_cleanup_pending'
          except BaseException as exc:
              error=type(exc).__name__
          finally:
              try:
                  if stage_leaf is not None and stage_leaf.parent==parent and stage_leaf.exists():
                      shutil.rmtree(stage_leaf)
                  # A failed stage can leave a child before its JSON receipt.
                  for item in parent.iterdir():
                      if item.name.startswith('merlin-cpython-stage-') and item.is_dir() and not item.is_symlink():
                          shutil.rmtree(item)
                  require(not list(parent.iterdir()),'residual_stage_leaf')
                  if download.exists() and download.is_dir() and not download.is_symlink():
                      shutil.rmtree(download)
                  require(not download.exists(),'residual_archive')
                  cleaned=True
              except BaseException as exc:
                  error=error or type(exc).__name__
                  cleaned=False
              (ev/'result.json').write_text(json.dumps({
                  'schema':'merlin-oci-private-python-stage-result/1','status':'passed' if status=='stage_verified_cleanup_pending' and cleaned and not error else 'blocked',
                  'error_type':error,'native_tests_expected':14,'archive_members_expected':4949,
                  'cleanup_verified':cleaned,'interpreter_installed':False,
                  'native_interpreter_executed':False,'model_calls':0,
                  'studio_product_tests_run':0,'production_qualified':False},sort_keys=True,indent=2))
              print((ev/'result.json').read_text())
          if status!='stage_verified_cleanup_pending' or not cleaned or error:
              raise SystemExit(2)
          PY
      - name: Retain native evidence, including negative outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merlin-oci-private-python-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merlin-oci-private-python-stage-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
