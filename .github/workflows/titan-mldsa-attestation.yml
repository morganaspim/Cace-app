name: Titan ML-DSA Attestation v2

on:
  push:
    branches:
      - "feat/titan-mldsa-attestation-v2-20261105"
    paths:
      - "cace_studio/core/pqc_attestation.py"
      - "schema/signed-attestation-v2-mldsa.schema.json"
      - "tests/test_titan_mldsa_v2.py"
      - "tests/test_titan_bundle_verifier.py"
      - "tests/test_titan_avrea_mldsa_receipt.py"
      - ".github/workflows/titan-mldsa-attestation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-mldsa-attestation-v2-oci
  cancel-in-progress: true

jobs:
  mldsa-v2:
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned native provider
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="/tmp/cace-pqc-${GITHUB_RUN_ID}"
          mkdir -p "$WORK_DIR"
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          if command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y openssl-devel
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y openssl-devel
          else
            echo "No supported package manager for OpenSSL headers" >&2
            exit 1
          fi
          python3 -m pip install --user "uv==0.9.11" "cmake==3.31.6" "ninja==1.11.1.3"
          export PATH="$HOME/.local/bin:$PATH"
          command -v gcc
          command -v g++
          cmake --version | head -1
          ninja --version
          uv python install 3.12.11
          LIBOQS_TAG_SHA="$(git ls-remote https://github.com/open-quantum-safe/liboqs.git refs/tags/0.16.0 | awk '{print $1}')"
          test "$LIBOQS_TAG_SHA" = "5a1a854b0dc9f2141bdc771c555ee60c37950183"
          git clone --filter=blob:none https://github.com/open-quantum-safe/liboqs.git $WORK_DIR/liboqs
          git -C $WORK_DIR/liboqs checkout --detach 5a1a854b0dc9f2141bdc771c555ee60c37950183
          test "$(git -C $WORK_DIR/liboqs rev-parse HEAD)" = "$LIBOQS_TAG_SHA"
          cmake -S $WORK_DIR/liboqs -B $WORK_DIR/liboqs/build -GNinja -DCMAKE_BUILD_TYPE=Release -DOQS_ALGS_ENABLED=STD -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DCMAKE_INSTALL_PREFIX=$WORK_DIR/liboqs-install
          cmake --build $WORK_DIR/liboqs/build --parallel 4
          cmake --install $WORK_DIR/liboqs/build
      - name: Install pinned liboqs-python source
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --seed --python 3.12.11 $WORK_DIR/venv
          $WORK_DIR/venv/bin/python -m pip install "hatchling==1.27.0" "pytest==8.4.2"
          OQS_PYTHON_TAG_SHA="$(git ls-remote https://github.com/open-quantum-safe/liboqs-python.git refs/tags/0.16.0.2 | awk '{print $1}')"
          test "$OQS_PYTHON_TAG_SHA" = "64c76ad0a80d6c69f2003219eb27b253782a3d68"
          git clone --filter=blob:none https://github.com/open-quantum-safe/liboqs-python.git $WORK_DIR/liboqs-python
          git -C $WORK_DIR/liboqs-python checkout --detach 64c76ad0a80d6c69f2003219eb27b253782a3d68
          test "$(git -C $WORK_DIR/liboqs-python rev-parse HEAD)" = "$OQS_PYTHON_TAG_SHA"
          OQS_INSTALL_PATH=$WORK_DIR/liboqs-install LD_LIBRARY_PATH=$WORK_DIR/liboqs-install/lib $WORK_DIR/venv/bin/python -m pip install --no-deps --no-build-isolation $WORK_DIR/liboqs-python
      - name: Verify provider version and run CACE receipt tests
        id: run-tests
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$WORK_DIR/liboqs-install/lib"
          export OQS_INSTALL_PATH="$WORK_DIR/liboqs-install"
          $WORK_DIR/venv/bin/python - <<'PY'
          import oqs
          assert oqs.oqs_python_version() == "0.16.0.2", oqs.oqs_python_version()
          assert oqs.oqs_version() == "0.16.0", oqs.oqs_version()
          assert "ML-DSA-65" in oqs.get_enabled_sig_mechanisms()
          print("liboqs-python", oqs.oqs_python_version(), "liboqs", oqs.oqs_version())
          PY
          set +e
          PYTHONPATH=. $WORK_DIR/venv/bin/python -m pytest -q tests/test_titan_mldsa_v2.py tests/test_titan_bundle_verifier.py tests/test_titan_avrea_mldsa_receipt.py
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Record ML-DSA provider and CACE test evidence
        if: always()
        shell: bash
        env:
          TEST_EXIT_CODE: ${{ steps.run-tests.outputs.exit_code }}
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$WORK_DIR/liboqs-install/lib"
          export OQS_INSTALL_PATH="$WORK_DIR/liboqs-install"
          $WORK_DIR/venv/bin/python - <<'PY'
          import json, os, pathlib, subprocess
          def git(path):
              try: return subprocess.check_output(["git","-C",path,"rev-parse","HEAD"],text=True).strip()
              except Exception: return None
          try:
              import importlib.metadata
              pyver=importlib.metadata.version("liboqs-python")
          except Exception:
              pyver=None
          try:
              import oqs
              libver=oqs.oqs_version()
          except Exception:
              libver=None
          rc=os.environ.get("TEST_EXIT_CODE")
          report={
            "schema_version":1,
            "evidence_type":"cace-titan-mldsa-v2",
            "workflow_run_id":os.environ.get("GITHUB_RUN_ID"),
            "workflow_run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
            "cace_source_commit":os.environ.get("GITHUB_SHA"),
            "provider":{"repository":"https://github.com/open-quantum-safe/liboqs","version":libver,"commit":git(os.path.join(os.environ["WORK_DIR"],"liboqs"))},
            "python_binding":{"repository":"https://github.com/open-quantum-safe/liboqs-python","version":pyver,"commit":git(os.path.join(os.environ["WORK_DIR"],"liboqs-python"))},
            "test_exit_code":int(rc) if rc and rc.isdigit() else None,
            "test_result":"pass" if rc=="0" else ("fail" if rc else "not_completed"),
            "signature_algorithm":"ML-DSA-65",
            "proof_effect":"none",
            "fips_140_validation_claim":False,
            "production_eligible":False
          }
          pathlib.Path("titan-mldsa-v2-evidence.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          PY

      - name: Upload ML-DSA test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-mldsa-v2-${{ github.run_id }}
          path: titan-mldsa-v2-evidence.json
          if-no-files-found: warn
          retention-days: 30
