name: Merlin browser reconciliation contract (non-deploying)

"on":
  push:
    branches:
      - fix/merlin-browser-reconciliation-preflight-20261122
    paths:
      - ops/merlin_browser/reconcile_orphan_socket.py
      - ops/merlin_browser/test_reconcile_orphan_socket.py
      - .github/workflows/merlin-browser-reconciliation-contract.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: merlin-browser-reconciliation-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read source at exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Retrieve fixed prior read-only host evidence (no OCI access)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14763396209
          run-id: 45045149558
          merge-multiple: true
          github-token: ${{ github.token }}
          path: browser-inspection-source
      - name: Check no-hardware, no-privilege contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 --version | tee runtime-version.txt
          git rev-parse HEAD | tee source-commit.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m compileall -q \
            ops/merlin_browser/reconcile_orphan_socket.py \
            ops/merlin_browser/test_reconcile_orphan_socket.py
          python3 -B -m unittest discover -s ops/merlin_browser \
            -p 'test_reconcile_orphan_socket.py' -v 2>&1 | tee contract-tests.log
          sha256sum ops/merlin_browser/reconcile_orphan_socket.py \
            ops/merlin_browser/test_reconcile_orphan_socket.py \
            > source-digests.txt
      - name: Bind and classify exact observed browser-host receipt
        shell: bash
        run: |
          set -euo pipefail
          file=browser-inspection-source/root-evidence/state-inspection.json
          test -f "$file" && test ! -L "$file"
          test "$(sha256sum "$file" | cut -d ' ' -f 1)" = \
            "0a5079914b4e0586dc8feabd0f5e76fadf0f7a5bda440f7cd59173f6b638934f"
          python3 -B ops/merlin_browser/reconcile_orphan_socket.py \
            --input "$file" --output reconciliation-plan.json \
            --expected-run-id 45045149558 \
            --expected-workflow-commit f4f7a4799c8a309a277b879f38209b3568d87c6c
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("reconciliation-plan.json").read_text())
          assert result["status"]=="candidate_for_separate_locked_reinspection"
          assert result["authority_granted"] is False
          assert result["may_unlink_socket"] is False
          assert result["host_mutations"] == 0
          assert result["native_browser_qualified"] is False
          print(json.dumps({"status":result["status"],"source_receipt_sha256":result["source_receipt_sha256"],"authority_granted":False},sort_keys=True))
          PY
      - name: Preserve exact test and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merlin-browser-reconcile-${{ github.run_id }}
          path: |
            runtime-version.txt
            source-commit.txt
            contract-tests.log
            source-digests.txt
            reconciliation-plan.json
          retention-days: 14
          if-no-files-found: warn
