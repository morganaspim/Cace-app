# One-shot development validator for the final H1 Bessel/Riesz normalization frontier.
# DEVELOPMENT_PROBE_ONLY: never qualification evidence.
name: CACE H¹ final normalization probe

on:
  workflow_dispatch:
  push:
    branches: [executor/cace-proof-qualification-locked]
    paths:
      - '.github/workflows/cace-h1-final-normalization-probe.yml'

permissions:
  contents: read

concurrency:
  group: cace-h1-final-normalization-probe
  cancel-in-progress: false

jobs:
  h1-final-normalization:
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 45
    env:
      CACE_TOOLCHAIN: leanprover/lean4:v4.32.1
      CACE_MATHLIB_COMMIT: 520045ab14e26149ee970e2e617ca04b09bde5d6
      ELAN_HOME: /var/lib/cace-cache/elan
      CACE_PACKAGE_CACHE: /var/lib/cace-cache/mathlib/v4.32.1-520045ab14e26149ee970e2e617ca04b09bde5d6/packages
      CACE_PACKAGE_CACHE_LOCK: /var/lib/cace-cache/mathlib/v330-prewarm.lock
      CACE_BUILD_CACHE_BASE: /var/lib/cace-cache/canonical-qualification-build/leanprover_lean4_v4.32.1/520045ab14e26149ee970e2e617ca04b09bde5d6
      CACE_HEARTBEAT_SECONDS: '30'
      CACE_STALL_WARN_SECONDS: '600'
      CACE_STALL_KILL_SECONDS: '1800'

    steps:
      - name: Checkout exact probe commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 64
          clean: true
          persist-credentials: false

      - name: Establish exact head and isolated tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          root="$(mktemp -d /var/tmp/cace-h1-final.XXXXXXXX)"
          status="$RUNNER_TEMP/cace-h1-final-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$root/formal" "$root/cache" "$root/output" "$status"
          cp -a formal/cace_formal/. "$root/formal/"
          rm -rf "$root/formal/.lake/build"
          echo "CACE_BUILD_ROOT=$root" >> "$GITHUB_ENV"
          echo "CACE_FORMAL_DIR=$root/formal" >> "$GITHUB_ENV"
          echo "CACE_STATUS_DIR=$status" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$root/cache" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$status/exact_head.txt"

      - name: Seed pinned dependencies and Lean
        shell: bash
        run: |
          set -euo pipefail
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$ELAN_HOME/bin:$PATH"
          test -x "$ELAN_HOME/bin/elan"
          elan toolchain install "$CACE_TOOLCHAIN"
          test "$(cat "$CACE_FORMAL_DIR/lean-toolchain")" = "$CACE_TOOLCHAIN"
          test -d "$CACE_PACKAGE_CACHE/mathlib/.git"
          exec 9>"$CACE_PACKAGE_CACHE_LOCK"
          flock -s -w 900 9
          test "$(git -C "$CACE_PACKAGE_CACHE/mathlib" rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
          mkdir -p "$CACE_FORMAL_DIR/.lake"
          cp -a --reflink=auto "$CACE_PACKAGE_CACHE" "$CACE_FORMAL_DIR/.lake/packages"
          flock -u 9
          bundle=''
          for candidate in /etc/pki/tls/certs/ca-bundle.crt /etc/ssl/certs/ca-certificates.crt /etc/ssl/cert.pem; do
            if [[ -s "$candidate" ]]; then bundle="$candidate"; break; fi
          done
          test -n "$bundle"
          echo "CURL_CA_BUNDLE=$bundle" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"
          (cd "$CACE_FORMAL_DIR" && lean --version && lake --version)

      - name: Resolve exact dependency closure
        shell: bash
        working-directory: ${{ env.CACE_FORMAL_DIR }}
        run: |
          set -euo pipefail
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
          lake build +Cache.Main
          rm -rf .lake/build

      - name: Restore verified nearest ancestor cache
        shell: bash
        run: |
          set -euo pipefail
          baseline_commit=''
          baseline_cache=''
          while read -r ancestor; do
            tree="$(git rev-parse "$ancestor:formal/cace_formal" 2>/dev/null || true)"
            [[ -n "$tree" ]] || continue
            candidate="$CACE_BUILD_CACHE_BASE/$tree"
            if [[ -d "$candidate/build" ]] &&
               [[ "$(cat "$candidate/mathlib_commit.txt" 2>/dev/null || true)" = "$CACE_MATHLIB_COMMIT" ]] &&
               [[ "$(cat "$candidate/lean_toolchain.txt" 2>/dev/null || true)" = "$CACE_TOOLCHAIN" ]]; then
              baseline_commit="$ancestor"
              baseline_cache="$candidate"
              printf '%s\n' "$tree" > "$CACE_STATUS_DIR/cache_baseline_tree.txt"
              break
            fi
          done < <(git rev-list --first-parent --max-count=63 HEAD^)
          test -n "$baseline_cache"
          mapfile -t changed < <(git diff --name-only "$baseline_commit" "$GITHUB_SHA" -- formal/cace_formal)
          printf '%s\n' "${changed[@]}" > "$CACE_STATUS_DIR/changed_formal_paths.txt"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'formal/cace_formal/CACEFormal/H1BesselRieszReduction.lean'
          mkdir -p "$CACE_FORMAL_DIR/.lake"
          cp -a --reflink=auto "$baseline_cache/build" "$CACE_FORMAL_DIR/.lake/build"
          touch "$CACE_FORMAL_DIR/CACEFormal/H1BesselRieszReduction.lean"
          touch "$CACE_FORMAL_DIR/CACEFormal/H1GraphConverse.lean"
          echo CACE_H1_FINAL_ANCESTOR_CACHE_PASS

      - name: Reject unfinished H1 proof tokens
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit)\b|OPEN OBLIGATION' \
            formal/cace_formal/CACEFormal/H1BesselRieszReduction.lean \
            formal/cace_formal/CACEFormal/H1GraphConverse.lean

      - name: Compile Bessel-Riesz reduction
        shell: bash
        working-directory: ${{ env.CACE_FORMAL_DIR }}
        env:
          LEAN_ABORT_ON_PANIC: '1'
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/scripts/cace_run_with_heartbeat.py" \
            --phase h1-bessel-riesz-final -- \
            lake build CACEFormal.H1BesselRieszReduction

      - name: Compile H1 graph converse
        shell: bash
        working-directory: ${{ env.CACE_FORMAL_DIR }}
        env:
          LEAN_ABORT_ON_PANIC: '1'
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/scripts/cace_run_with_heartbeat.py" \
            --phase h1-graph-converse-final -- \
            lake build CACEFormal.H1GraphConverse

      - name: Kernel axiom probe
        shell: bash
        working-directory: ${{ env.CACE_FORMAL_DIR }}
        run: |
          set -euo pipefail
          probe="$CACE_BUILD_ROOT/H1FinalAxiomProbe.lean"
          cat > "$probe" <<'LEAN'
          import CACEFormal.H1GraphConverse
          #print axioms CACEFormal.Continuum.besselRiesz_reconstruction
          #print axioms CACEFormal.Continuum.inH1_of_besselRiesz_reconstruction
          #print axioms CACEFormal.Continuum.inH1_of_mem_H1DistributionalGraphSubmodule
          #print axioms CACEFormal.Continuum.inH1_iff_exists_distributionalGraphRepresentative
          LEAN
          output="$(lake env lean "$probe")"
          printf '%s\n' "$output" | tee "$CACE_STATUS_DIR/h1_axioms.txt"
          ! grep -q 'sorryAx' <<<"$output"
          python3 - "$output" <<'PY'
          import re, sys
          text = sys.argv[1]
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          reports = re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", text)
          if len(reports) != 4:
              raise SystemExit(f'expected 4 axiom reports, got {len(reports)}')
          for name, body in reports:
              axioms = {x.strip() for x in body.split(',') if x.strip()}
              bad = axioms - allowed
              if bad:
                  raise SystemExit(f'{name}: non-whitelisted axioms {sorted(bad)}')
          print('CACE_H1_FINAL_AXIOM_PROBE_PASS')
          PY

      - name: Final exact-head source check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          diff -qr --exclude=.lake --exclude=lake-manifest.json formal/cace_formal "$CACE_FORMAL_DIR"
          echo CACE_H1_FINAL_NORMALIZATION_PROBE_PASS

      - name: Persist development cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -d "${CACE_FORMAL_DIR:-}/.lake/build" ]] || exit 0
          tree="$(git rev-parse "$GITHUB_SHA:formal/cace_formal")"
          dest="$CACE_BUILD_CACHE_BASE/$tree"
          mkdir -p "$dest"
          staging="$dest/build.staging.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          rm -rf "$staging"
          cp -a --reflink=auto "$CACE_FORMAL_DIR/.lake/build" "$staging"
          rm -rf "$dest/build"
          mv "$staging" "$dest/build"
          printf '%s\n' "$tree" > "$dest/formal_tree_sha.txt"
          printf '%s\n' "$CACE_MATHLIB_COMMIT" > "$dest/mathlib_commit.txt"
          printf '%s\n' "$CACE_TOOLCHAIN" > "$dest/lean_toolchain.txt"
          printf '%s\n' 'development-acceleration-only; never qualification evidence' > "$dest/cache_policy.txt"

      - name: Upload development diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-h1-final-normalization-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ env.CACE_STATUS_DIR }}

      - name: Remove temporary build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CACE_BUILD_ROOT:-}" == /var/tmp/cace-h1-final.* && -O "$CACE_BUILD_ROOT" && ! -L "$CACE_BUILD_ROOT" ]]; then
            rm -rf -- "$CACE_BUILD_ROOT"
          fi
