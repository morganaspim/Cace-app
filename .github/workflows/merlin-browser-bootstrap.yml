name: Merlin fixed public browser bootstrap

"on":
  push:
    branches: ["merlin/browser-operations-20261121"]
    paths: ["merlin/browser-bootstrap-requests/**"]

permissions:
  contents: read

concurrency:
  group: merlin-dot-oci-operations
  cancel-in-progress: false

jobs:
  fixed-browser-bootstrap:
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 30
    steps:
      - name: Verify, install and exercise the fixed isolated public browser
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import ast,base64,hashlib,io,json,os,re,selectors,signal,stat,subprocess,sys,time,urllib.request,zipfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];commit=os.environ['GITHUB_SHA']
          if (repo!='morganaspim/Cace-app' or os.environ['GITHUB_REF']!='refs/heads/merlin/browser-operations-20261121'
              or os.environ.get('RUNNER_NAME')!='cace-oci-a1' or os.geteuid()!=1000
              or sys.version_info[:2]!=(3,9) or not re.fullmatch('[0-9a-f]{40}',commit)):
              raise RuntimeError('unexpected native bootstrap execution identity')
          run_id=int(os.environ['GITHUB_RUN_ID']);attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          if run_id<=0 or attempt!=1: raise RuntimeError('first bootstrap attempt required')
          pins={'bootstrap_browser.py': {'bytes': 58576, 'sha256': '9709d2dc42c09cd71d5e454a984ebd2a9f51dab367778e33c6355fbf4f018bf8', 'git_blob': 'faaeec462490aa533f6def2f95095681906d2036'}, 'launch_episode.py': {'bytes': 24631, 'sha256': '621e2557785492e7de3c6c5b7161653f2a05fb8080f9711d7b72d11900d57bfe', 'git_blob': '4f18d4fcfba7e2fcbe6dda98a318a51b250dfe3e'}, 'smoke_renderer.py': {'bytes': 8108, 'sha256': 'a9cc3ab7b67ec2511a7ed56b2af4d829a424ad3a00f2632e0e860ceddc59e2f9', 'git_blob': '9bd9849ab14bfbd443eded108f2807c6c857de3b'}, 'test_bootstrap_browser.py': {'bytes': 11934, 'sha256': '3080a63c57f4fe00b0cd0f5d08024d9b31c8d41ffaed1f146d504365dac79d4c', 'git_blob': '32442ce0373e5b688a3cc336a24a407c7125aedb'}}
          runtime_pin={'bytes': 66068, 'expert_source_commit': '8e2f1d69371d5b4f7e01e3bbd5aa02a666ddd506', 'git_blob': 'eef7ecfca629800726beae7eed46f4acd0a49a31', 'sha256': '58f9b4fee8b03db777a07e76149ef5fedcc8c1c9b3309c16499b3cadecfbac90'}
          runtime_path='ops/merlin_browser/releases/'+runtime_pin['sha256']+'.zip'
          clean={'PATH':'/usr/sbin:/usr/bin:/sbin:/bin','LANG':'C.UTF-8','LC_ALL':'C.UTF-8',
                 'HOME':'/var/empty','XDG_CONFIG_HOME':'/var/empty','XDG_CACHE_HOME':'/var/empty',
                 'XDG_DATA_HOME':'/var/empty','PYTHONDONTWRITEBYTECODE':'1','PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD':'1'}
          def unique(items):
              value={}
              for key,item in items:
                  if key in value: raise ValueError('duplicate JSON field')
                  value[key]=item
              return value
          def api(path):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,
                headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=20) as response: raw=response.read(4*1024*1024+1)
              if len(raw)>4*1024*1024: raise RuntimeError('bounded API response exceeded')
              return json.loads(raw,object_pairs_hook=unique)
          def blob(raw): return hashlib.sha1(('blob %d\0'%len(raw)).encode()+raw).hexdigest()
          def fetch(path):
              item=api('contents/'+path+'?ref='+commit)
              raw=base64.b64decode(''.join(item['content'].split()),validate=True)
              if blob(raw)!=item['sha']: raise RuntimeError('Git bytes differ')
              return raw,item['sha']
          def check(raw,pin):
              if len(raw)!=pin['bytes'] or hashlib.sha256(raw).hexdigest()!=pin['sha256'] or blob(raw)!=pin['git_blob']:
                  raise RuntimeError('fixed source/runtime pin differs')
          out=Path(os.environ['RUNNER_TEMP'])/('merlin-browser-bootstrap-%d-%d'%(run_id,attempt))
          out.mkdir(mode=0o700,exist_ok=False)
          def fixed(argv,name,seconds,maximum=8*1024*1024):
              # No ambient GitHub credential, proxy or user configuration in children.
              # Every byte of partial stdout/stderr is written before any failure is raised.
              process=subprocess.Popen(argv,cwd='/',env=clean,stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,stderr=subprocess.STDOUT,start_new_session=True)
              selector=selectors.DefaultSelector();selector.register(process.stdout,selectors.EVENT_READ)
              start=time.monotonic();deadline=start+seconds;total=0;error=None
              try:
                  with (out/name).open('xb') as log:
                      while selector.get_map():
                          left=deadline-time.monotonic()
                          if left<=0: raise TimeoutError('fixed child absolute process deadline')
                          for key,_ in selector.select(min(.2,left)):
                              raw=os.read(key.fd,65536)
                              if not raw: selector.unregister(key.fileobj);continue
                              if total+len(raw)>maximum: raise RuntimeError('fixed child output ceiling')
                              log.write(raw);log.flush();total+=len(raw)
                      code=process.wait(timeout=max(.01,deadline-time.monotonic()))
                      if code: raise RuntimeError('fixed child exit '+str(code))
              except BaseException as exc:
                  error=exc
                  if process.poll() is None:
                      try: os.killpg(process.pid,signal.SIGTERM)
                      except (PermissionError,ProcessLookupError):
                          try: process.terminate()
                          except (PermissionError,ProcessLookupError): pass
                      try: process.wait(timeout=5)
                      except subprocess.TimeoutExpired: pass
                  # Kill every remaining unprivileged descendant even if its parent had
                  # already exited before this handler. Root descendants are bounded by
                  # the separately verified systemd control group below.
                  try: os.killpg(process.pid,signal.SIGKILL)
                  except (PermissionError,ProcessLookupError): pass
                  raise
              finally:
                  selector.close();process.stdout.close()
                  (out/(name+'.json')).write_text(json.dumps({'argv_sha256':hashlib.sha256(json.dumps(argv).encode()).hexdigest(),
                    'returncode':process.returncode,'elapsed_seconds':time.monotonic()-start,'stdout_stderr_bytes':total,
                    'absolute_deadline_seconds':seconds,'error_type':type(error).__name__ if error else None},indent=2))
          try:
              changed=api('commits/'+commit)['files']
              if len(changed)!=1 or changed[0]['status']!='added': raise RuntimeError('one additive bootstrap request required')
              path=changed[0]['filename']
              if not re.fullmatch(r'merlin/browser-bootstrap-requests/[0-9a-f-]{36}\.json',path): raise RuntimeError('fixed request path required')
              raw,_=fetch(path)
              if len(raw)>16000: raise RuntimeError('request byte ceiling')
              request=json.loads(raw,object_pairs_hook=unique)
              if (not isinstance(request,dict) or set(request)!={'schema','request_id','operation','created_at'}
                  or request['schema']!='merlin-browser-bootstrap-request/1' or request['operation']!='bootstrap'
                  or path!='merlin/browser-bootstrap-requests/'+request['request_id']+'.json'):
                  raise RuntimeError('fixed bootstrap request contract required')
              (out/'request.json').write_bytes(raw)
              for name,pin in pins.items():
                  raw,_=fetch('ops/merlin_browser/'+name);check(raw,pin)
                  ast.parse(raw,feature_version=(3,9));(out/name).write_bytes(raw)
              workflow,workflow_blob=fetch('.github/workflows/merlin-browser-bootstrap.yml')
              (out/'workflow-definition.yml').write_bytes(workflow)
              runtime,_=fetch(runtime_path);check(runtime,runtime_pin);(out/'runtime.zip').write_bytes(runtime)
              (out/'runtime-pins.json').write_text(json.dumps(runtime_pin,sort_keys=True,indent=2))
              (out/'source-identities.json').write_text(json.dumps({'sources':pins,'runtime':runtime_pin,
                 'workflow_git_blob':workflow_blob,'workflow_sha256':hashlib.sha256(workflow).hexdigest()},sort_keys=True,indent=2))
              execution={'repository':repo,'ref':os.environ['GITHUB_REF'],'runner':os.environ['RUNNER_NAME'],
                 'workflow_commit':commit,'run_id':run_id,'run_attempt':attempt,'controller_sha256':pins['bootstrap_browser.py']['sha256'],
                 'python':sys.version}
              (out/'identity.json').write_text(json.dumps(execution,sort_keys=True,indent=2))
              # Exact native package and host controls are prerequisites, not qualification.
              code="import sys,unittest,json;sys.path.insert(0,sys.argv[1]);suite=unittest.defaultTestLoader.discover(sys.argv[1],pattern='test_bootstrap_browser.py');r=unittest.TextTestRunner(verbosity=2).run(suite);print(json.dumps({'tests':r.testsRun,'errors':len(r.errors),'failures':len(r.failures),'skipped':len(r.skipped)}));sys.exit(0 if r.wasSuccessful() and not r.skipped and r.testsRun==23 else 1)"
              fixed(['/usr/bin/python3','-I','-B','-c',code,str(out)],'host-controls.txt',40)
              product=out/'native-product';product.mkdir(mode=0o700)
              with zipfile.ZipFile(io.BytesIO(runtime)) as archive:
                  names=archive.namelist()
                  if len(names)!=len(set(names)) or not 1<len(names)<=512: raise RuntimeError('bounded unique runtime ZIP required')
                  manifest_raw=archive.read('manifest.json')
                  if len(manifest_raw)>1048576: raise RuntimeError('runtime manifest byte ceiling')
                  manifest=json.loads(manifest_raw,object_pairs_hook=unique)
                  if manifest.get('schema')!='merlin-browser-runtime/1' or manifest.get('expert_source_commit')!=runtime_pin['expert_source_commit']:
                      raise RuntimeError('published expert source binding differs')
                  files=manifest.get('files')
                  if not isinstance(files,list) or set(names)!={'manifest.json'}|{entry['path'] for entry in files}:
                      raise RuntimeError('runtime exact source closure differs')
                  total=0
                  for entry in files:
                      name=entry['path'];member=Path(name)
                      if (member.is_absolute() or '..' in member.parts or not name.startswith(('python/','bin/'))
                          or not re.fullmatch(r'(?:[A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+',name)):
                          raise RuntimeError('unsafe runtime member path')
                      info=archive.getinfo(name)
                      if stat.S_IFMT(info.external_attr>>16) not in (0,stat.S_IFREG) or info.file_size>2*1024*1024:
                          raise RuntimeError('runtime member type/size differs')
                      body=archive.read(name);total+=len(body)
                      check(body,entry)
                      if total>16*1024*1024: raise RuntimeError('runtime decompressed byte ceiling')
                      target=product/name;target.parent.mkdir(mode=0o700,parents=True,exist_ok=True);target.write_bytes(body)
                  (product/'manifest.json').write_bytes(manifest_raw)
              code="import sys,unittest,json;sys.path.insert(0,sys.argv[1]);suite=unittest.defaultTestLoader.discover(sys.argv[2],pattern='test_public_browser.py');r=unittest.TextTestRunner(verbosity=2).run(suite);print(json.dumps({'tests':r.testsRun,'errors':len(r.errors),'failures':len(r.failures),'skipped':len(r.skipped)}));sys.exit(0 if r.wasSuccessful() and not r.skipped and r.testsRun==33 else 1)"
              fixed(['/usr/bin/python3','-I','-B','-c',code,str(product/'python'),str(product/'python'/'tests')],'native-product-tests.txt',60)
              for name,pin in pins.items(): check((out/name).read_bytes(),pin)
              check((out/'runtime.zip').read_bytes(),runtime_pin)
              code="import sys,json;sys.path.insert(0,sys.argv[1]);import bootstrap_browser as m;print(json.dumps(m.acquire(sys.argv[2]),sort_keys=True))"
              fixed(['/usr/bin/python3','-I','-B','-c',code,str(out),str(out/'acquisition')],'acquisition-log.txt',600)
              acquisition_sha=hashlib.sha256((out/'acquisition'/'acquisition.json').read_bytes()).hexdigest()
              source=(out/'bootstrap_browser.py').read_bytes();check(source,pins['bootstrap_browser.py'])
              check((out/'runtime.zip').read_bytes(),runtime_pin)
              root_code='import hashlib,json,signal;body='+repr(source)+';assert hashlib.sha256(body).hexdigest()=='+repr(pins['bootstrap_browser.py']['sha256'])+';n={"__name__":"pinned_browser_bootstrap"};exec(compile(body,"pinned-browser-bootstrap","exec"),n)\n'
              root_code+='def expire(signum,frame): raise n["BootstrapError"]("root controller absolute deadline")\nsignal.signal(signal.SIGALRM,expire);signal.alarm(900)\n'
              root_code+='result=n["install"]('+','.join(repr(v) for v in (str(out/'acquisition'),acquisition_sha,str(out/'runtime.zip'),runtime_pin,request,execution,str(out)))+');signal.alarm(0);print(json.dumps(result,sort_keys=True))\n'
              if len(root_code.encode())>115000: raise RuntimeError('bounded fixed privileged code exceeded')
              # PID1 owns a real whole-descendant cgroup, including detached RPM/pip
              # process groups. The inner alarm first permits orderly evidence/cleanup.
              unit='merlin-browser-bootstrap-%d-%d.service'%(run_id,attempt)
              fixed(['/usr/bin/sudo','-n','/usr/bin/systemd-run','--unit='+unit,'--quiet','--wait','--pipe',
                 '--service-type=exec','--property=RuntimeMaxSec=930','--property=TimeoutStopSec=15',
                 '--property=KillMode=control-group','--property=MemoryMax=2G','--property=MemorySwapMax=0',
                 '--property=CPUQuota=100%','--property=TasksMax=256','--property=UMask=0022','--',
                 '/usr/bin/env','-i','PATH=/usr/sbin:/usr/bin:/sbin:/bin','LANG=C.UTF-8','LC_ALL=C.UTF-8',
                 'HOME=/var/empty','/usr/bin/python3','-I','-B','-c',root_code],'root-operation-log.txt',950)
              print(json.dumps({'status':'fixed_browser_bootstrap_finished','run_id':run_id,'runtime_sha256':runtime_pin['sha256'],
                'source_commit':runtime_pin['expert_source_commit'],'model_calls':0,'qualification':False},sort_keys=True))
          except BaseException as exc:
              (out/'operation-error.json').write_text(json.dumps({'status':'failed','type':type(exc).__name__,
                'message':str(exc)[:2000],'workflow_commit':commit,'run_id':run_id,'run_attempt':attempt},indent=2))
              raise
          PYCODE
      - name: Preserve complete browser bootstrap and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/
            !${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/acquisition/rpms/**
            !${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/acquisition/wheels/**
            !${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/acquisition/cache/**
            !${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/acquisition/persist/**
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve exact third-party dependency acquisition
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merlin-browser-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/acquisition/rpms/
            ${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/acquisition/wheels/
            ${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/acquisition/cache/
            ${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/acquisition/persist/
            ${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/acquisition/acquisition.json
            ${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/acquisition/resolved-transaction.json
            ${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/acquisition/candidate-plan.json
            ${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/acquisition/candidate-rejection.json
            ${{ runner.temp }}/merlin-browser-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/source-identities.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
