name: Merlin packaged Studio UI/restart contract (no model downloads)

"on":
  push:
    branches: ["fix/merlin-native-offline-zip-source-20261122"]
    paths:
      - ops/merlin_model_isolated/run_packaged_studio_smoke.py
      - ops/merlin_model_isolated/test_packaged_studio_smoke.py
      - .github/workflows/merlin-packaged-studio-ui-contract.yml

permissions:
  contents: read

jobs:
  fixed-offline-studio-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Check exact source, compile, and run synthetic negatives
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee source-commit.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m py_compile \
            ops/merlin_model_isolated/run_packaged_studio_smoke.py \
            ops/merlin_model_isolated/test_packaged_studio_smoke.py
          python3 -B -m unittest discover \
            -s ops/merlin_model_isolated -p 'test_packaged_studio_smoke.py' -v \
            2>&1 | tee studio-contract-tests.log
          sha256sum ops/merlin_model_isolated/run_packaged_studio_smoke.py \
            ops/merlin_model_isolated/test_packaged_studio_smoke.py \
            > reviewed-source-sha256.txt
      - name: Retain exact synthetic contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merlin-packaged-studio-contract-${{ github.run_id }}
          path: |
            source-commit.txt
            studio-contract-tests.log
            reviewed-source-sha256.txt
          retention-days: 14
          if-no-files-found: warn
