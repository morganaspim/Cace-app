name: CACE Exact-Pin Lean Preflight

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Lean module path. Default is a stable root import; compile_root=true checks the full audited root.'
        required: true
        default: 'CACEFormal/P1RT0Element.lean'
      compile_root:
        description: 'Also compile CACEFormal.lean after the targeted module'
        required: true
        type: boolean
        default: true
      prewarm_mathlib_cache:
        description: 'Explicitly refresh the pinned Mathlib build cache before compiling (network allowed)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cace-canonical-qualification-oci
  cancel-in-progress: false

jobs:
  exact-pin-lean-preflight:
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 45
    env:
      CACE_TOOLCHAIN: leanprover/lean4:v4.32.1
      CACE_MATHLIB_COMMIT: 520045ab14e26149ee970e2e617ca04b09bde5d6
      CACE_PERSISTENT_ELAN_HOME: /var/lib/cace-cache/elan
      CACE_PACKAGE_CACHE: /var/lib/cace-cache/mathlib/v4.32.1-520045ab14e26149ee970e2e617ca04b09bde5d6/packages
      CACE_PACKAGE_CACHE_LOCK: /var/lib/cace-cache/mathlib/v330-prewarm.lock
      CACE_MANIFEST_CACHE_DIR: /var/lib/cace-cache/mathlib/manifests
      LAKE_ARTIFACT_CACHE: 'true'
      LAKE_CACHE_DIR: /var/lib/cace-cache/lake
      MATHLIB_NO_CACHE_ON_UPDATE: '1'

    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Establish exact head and serialize CACE Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          python scripts/cace_actions_serialization_guard.py --current-run-id "$GITHUB_RUN_ID"
          printf 'exact_head=%s\n' "$GITHUB_SHA"

      - name: Validate requested target and audited-root reachability
        id: target
        shell: bash
        env:
          REQUESTED_MODULE_RAW: ${{ inputs.module }}
        run: |
          set -euo pipefail
          REQUESTED_MODULE="$(printf '%s' "$REQUESTED_MODULE_RAW" | sed -E 's/^Module:[[:space:]]*//; s/[[:space:]]+compile_root:.*$//; s/^[[:space:]]+//; s/[[:space:]]+$//')"
          echo "normalized_module=$REQUESTED_MODULE"
          case "$REQUESTED_MODULE" in
            CACEFormal/*.lean) ;;
            *) echo "Target must be a CACEFormal/*.lean path." >&2; exit 2 ;;
          esac
          test -f "formal/cace_formal/$REQUESTED_MODULE"
          module_name="${REQUESTED_MODULE%.lean}"
          module_name="${module_name//\//.}"
          if ! grep -Fqx "import $module_name" formal/cace_formal/CACEFormal.lean; then
            echo "Requested module is not directly imported by audited CACEFormal.lean root: $module_name" >&2
            exit 3
          fi
          printf 'module=%s\n' "$REQUESTED_MODULE" >> "$GITHUB_OUTPUT"
          printf 'module_name=%s\n' "$module_name" >> "$GITHUB_OUTPUT"

      - name: Validate permanent proof guardrails and freeze proof plan
        id: guardrails
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.module }}
          COMPILE_ROOT: ${{ inputs.compile_root }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 scripts/cace_proof_guardrails.py validate
          python3 scripts/check_cace_workflow_guardrails.py

          base_ref="origin/$DEFAULT_BRANCH"
          git rev-parse --verify "$base_ref^{commit}" >/dev/null
          merge_base="$(git merge-base HEAD "$base_ref")"
          test -n "$merge_base"
          printf 'CACE_GUARDRAIL_MERGE_BASE=%s\n' "$merge_base"

          python3 scripts/cace_proof_guardrails.py impacted \
            --base-ref "$merge_base" > cace-impacted-modules.txt
          if grep -vE '^(CACEFormal\.[A-Za-z0-9_.]+)?$' cace-impacted-modules.txt; then
            echo "Impacted-module planner emitted non-module output." >&2
            exit 31
          fi
          if test "$(sort cace-impacted-modules.txt | uniq -d | wc -l)" -ne 0; then
            echo "Impacted-module planner emitted duplicate modules." >&2
            exit 32
          fi
          impacted_count="$(grep -cve '^[[:space:]]*$' cace-impacted-modules.txt || true)"
          printf 'CACE_IMPACTED_MODULE_COUNT=%s\n' "$impacted_count"
          cat cace-impacted-modules.txt

          python3 scripts/cace_proof_guardrails.py plan-hash \
            --toolchain "$CACE_TOOLCHAIN" \
            --mathlib-commit "$CACE_MATHLIB_COMMIT" \
            --target "$TARGET" \
            --compile-root "$COMPILE_ROOT" \
            --impacted-file cace-impacted-modules.txt \
            > cace-proof-plan.json

          plan_sha256="$(python3 -c 'import json; print(json.load(open("cace-proof-plan.json"))["plan_sha256"])')"
          test -n "$plan_sha256"
          printf 'CACE_PROOF_PLAN_SHA256=%s\n' "$plan_sha256"
          printf 'plan_sha256=%s\n' "$plan_sha256" >> "$GITHUB_OUTPUT"
          printf 'merge_base=%s\n' "$merge_base" >> "$GITHUB_OUTPUT"
          printf 'impacted_count=%s\n' "$impacted_count" >> "$GITHUB_OUTPUT"

      - name: Reject malformed Lean source seams
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.module }}
          COMPILE_ROOT: ${{ inputs.compile_root }}
        run: |
          set -euo pipefail
          if test "$COMPILE_ROOT" = "true"; then
            python3 scripts/check_lean_source_sanity.py formal/cace_formal
          else
            python3 scripts/check_lean_source_sanity.py "formal/cace_formal/$TARGET"
          fi

      - name: Restore pinned Lean and exact Mathlib package tree
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$CACE_PERSISTENT_ELAN_HOME"
          export PATH="$ELAN_HOME/bin:$PATH"
          test -x "$ELAN_HOME/bin/elan"
          elan toolchain install "$CACE_TOOLCHAIN"
          test "$(cat formal/cace_formal/lean-toolchain)" = "$CACE_TOOLCHAIN"
          mkdir -p formal/cace_formal/.lake
          rm -rf formal/cace_formal/.lake/packages
          exec 9>"$CACE_PACKAGE_CACHE_LOCK"
          flock -s -w 900 9
          test -d "$CACE_PACKAGE_CACHE/mathlib/.git"
          test "$(git -C "$CACE_PACKAGE_CACHE/mathlib" rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
          cp -a --reflink=auto "$CACE_PACKAGE_CACHE" formal/cace_formal/.lake/packages
          flock -u 9
          cd formal/cace_formal
          lean --version
          lake --version
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"

          mkdir -p "$CACE_MANIFEST_CACHE_DIR"
          manifest_key="$(
            {
              printf '%s\n' "$CACE_TOOLCHAIN"
              sha256sum lakefile.lean
            } | sha256sum | awk '{print $1}'
          )"
          manifest_cache="$CACE_MANIFEST_CACHE_DIR/$manifest_key.json"
          if test -s "$manifest_cache"; then
            cp "$manifest_cache" lake-manifest.json
            echo "CACE_MANIFEST_CACHE_HIT key=$manifest_key"
          else
            echo "CACE_MANIFEST_CACHE_MISS key=$manifest_key"
            MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
            test -s lake-manifest.json
            install -m 0644 lake-manifest.json "$manifest_cache.tmp-$GITHUB_RUN_ID"
            mv "$manifest_cache.tmp-$GITHUB_RUN_ID" "$manifest_cache"
          fi
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"

      - name: Explicitly prewarm pinned Mathlib artifacts
        if: ${{ inputs.prewarm_mathlib_cache }}
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$CACE_PERSISTENT_ELAN_HOME"
          export PATH="$ELAN_HOME/bin:$PATH"
          cd formal/cace_formal

          cache_origin="https://lakecache.blob.core.windows.net/mathlib4-master"
          ca_bundle=""
          for candidate in /etc/pki/tls/certs/ca-bundle.crt /etc/ssl/certs/ca-certificates.crt /etc/ssl/cert.pem
          do
            if test -r "$candidate" && curl --cacert "$candidate" -sSI --max-time 15 "$cache_origin" >/dev/null; then
              ca_bundle="$candidate"
              break
            fi
          done
          if test -z "$ca_bundle"; then
            echo "No working system CA bundle found for the Mathlib cache origin." >&2
            exit 20
          fi
          export CURL_CA_BUNDLE="$ca_bundle"
          export SSL_CERT_FILE="$ca_bundle"
          echo "CACE_MATHLIB_CA_BUNDLE=$ca_bundle"

          lake exe cache get

          exec 9>"$CACE_PACKAGE_CACHE_LOCK"
          flock -x -w 900 9
          staging="${CACE_PACKAGE_CACHE}.staging-${GITHUB_RUN_ID}"
          backup="${CACE_PACKAGE_CACHE}.backup-${GITHUB_RUN_ID}"
          rm -rf "$staging" "$backup"
          cp -a --reflink=auto .lake/packages "$staging"
          test "$(git -C "$staging/mathlib" rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
          if test -d "$CACE_PACKAGE_CACHE"; then
            mv "$CACE_PACKAGE_CACHE" "$backup"
          fi
          mv "$staging" "$CACE_PACKAGE_CACHE"
          rm -rf "$backup"
          flock -u 9

      - name: Verify normal proof run is cache-local
        if: ${{ ! inputs.prewarm_mathlib_cache }}
        shell: bash
        run: |
          set -euo pipefail
          if ! find formal/cace_formal/.lake/packages/mathlib/.lake/build -type f -name '*.olean' -print -quit 2>/dev/null | grep -q .; then
            echo "Pinned Mathlib package cache has no compiled .olean artifacts." >&2
            echo "Run this workflow once with prewarm_mathlib_cache=true; ordinary proof runs intentionally refuse network downloads." >&2
            exit 21
          fi

      - name: Compile proof API canaries
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$CACE_PERSISTENT_ELAN_HOME"
          export PATH="$ELAN_HOME/bin:$PATH"
          cd formal/cace_formal
          start="$(date +%s)"
          lake build +CACEFormal.GuardrailCanaries
          stop="$(date +%s)"
          printf 'CACE_GUARDRAIL_CANARY_OK elapsed_seconds=%s exact_head=%s\n' "$((stop-start))" "$GITHUB_SHA"

      - name: Compile changed modules and audited reverse dependents
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$CACE_PERSISTENT_ELAN_HOME"
          export PATH="$ELAN_HOME/bin:$PATH"
          mapfile -t modules < <(grep -ve '^[[:space:]]*$' cace-impacted-modules.txt || true)
          if test "${#modules[@]}" -eq 0; then
            echo "CACE_IMPACTED_COMPILE_SKIPPED no audited-root Lean modules changed relative to merge base"
          else
            targets=()
            for module in "${modules[@]}"; do
              targets+=("+$module")
            done
            cd formal/cace_formal
            start="$(date +%s)"
            lake build "${targets[@]}"
            stop="$(date +%s)"
            printf 'CACE_IMPACTED_COMPILE_OK modules=%s elapsed_seconds=%s exact_head=%s\n' \
              "${#modules[@]}" "$((stop-start))" "$GITHUB_SHA"
          fi

      - name: Compile requested Lean module
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.module }}
          TARGET_MODULE: ${{ steps.target.outputs.module_name }}
        run: |
          set -euo pipefail
          export ELAN_HOME="$CACE_PERSISTENT_ELAN_HOME"
          export PATH="$ELAN_HOME/bin:$PATH"
          cd formal/cace_formal
          start="$(date +%s)"
          lake build "+$TARGET_MODULE"
          stop="$(date +%s)"
          printf 'CACE_PREFLIGHT_TARGET_OK target=%s elapsed_seconds=%s exact_head=%s\n' "$TARGET" "$((stop-start))" "$GITHUB_SHA"

      - name: Reverify frozen proof plan before audited root
        if: ${{ inputs.compile_root }}
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.module }}
          COMPILE_ROOT: ${{ inputs.compile_root }}
          EXPECTED_PLAN_SHA256: ${{ steps.guardrails.outputs.plan_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/cace_proof_guardrails.py plan-hash \
            --toolchain "$CACE_TOOLCHAIN" \
            --mathlib-commit "$CACE_MATHLIB_COMMIT" \
            --target "$TARGET" \
            --compile-root "$COMPILE_ROOT" \
            --impacted-file cace-impacted-modules.txt \
            > cace-proof-plan-recheck.json
          actual="$(python3 -c 'import json; print(json.load(open("cace-proof-plan-recheck.json"))["plan_sha256"])')"
          test "$actual" = "$EXPECTED_PLAN_SHA256"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'CACE_PROOF_PLAN_RECHECK_OK sha256=%s exact_head=%s\n' "$actual" "$GITHUB_SHA"

      - name: Compile audited root
        if: ${{ inputs.compile_root }}
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$CACE_PERSISTENT_ELAN_HOME"
          export PATH="$ELAN_HOME/bin:$PATH"
          cd formal/cace_formal
          start="$(date +%s)"
          lake build CACEFormal
          stop="$(date +%s)"
          printf 'CACE_PREFLIGHT_ROOT_OK elapsed_seconds=%s exact_head=%s\n' "$((stop-start))" "$GITHUB_SHA"

      - name: Emit non-qualification summary
        if: always()
        shell: bash
        run: |
          cat > cace-exact-pin-preflight-summary.txt <<EOF
          evidence_class=engineering/formal-preflight
          qualification=false
          exact_head=$GITHUB_SHA
          lean_toolchain=$CACE_TOOLCHAIN
          mathlib_commit=$CACE_MATHLIB_COMMIT
          target=${{ inputs.module }}
          compile_root=${{ inputs.compile_root }}
          prewarm_mathlib_cache=${{ inputs.prewarm_mathlib_cache }}
          proof_plan_sha256=${{ steps.guardrails.outputs.plan_sha256 }}
          merge_base=${{ steps.guardrails.outputs.merge_base }}
          impacted_module_count=${{ steps.guardrails.outputs.impacted_count }}
          guardrail_policy=validate -> canary -> reverse-dependents -> plan-recheck -> audited-root
          cache_policy=ordinary proof runs are network-free; only explicit prewarm may download Mathlib artifacts
          note=This preflight catches policy drift, API canary failures, impacted-module failures, Lean elaboration/typechecking/import failures, and exact-plan drift. It never replaces canonical exact-current-head qualification, theorem metadata, kernel axiom audit, or attestation.
          EOF
          cat cace-exact-pin-preflight-summary.txt

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-exact-pin-lean-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cace-exact-pin-preflight-summary.txt
            cace-proof-plan.json
            cace-proof-plan-recheck.json
            cace-impacted-modules.txt
          if-no-files-found: warn
          retention-days: 14
