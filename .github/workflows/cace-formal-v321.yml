name: CACE Formal v3.21

on:
  workflow_dispatch:
  push:
    paths:
      - 'formal/cace_formal/**'
      - 'cace_studio/core/mesh_orthogonality_bridge.py'
      - 'cace_studio/formal/**'
      - 'cace_studio/modules/formal_v321.py'
      - 'tests/test_formal_v321.py'
      - 'pyproject.toml'
      - '.github/workflows/cace-formal-v321.yml'
  pull_request:
    paths:
      - 'formal/cace_formal/**'
      - 'cace_studio/core/mesh_orthogonality_bridge.py'
      - 'cace_studio/formal/**'
      - 'cace_studio/modules/formal_v321.py'
      - 'tests/test_formal_v321.py'
      - 'pyproject.toml'
      - '.github/workflows/cace-formal-v321.yml'

permissions:
  contents: read

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python regression environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]'

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean toolchain
        working-directory: formal/cace_formal
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(cat lean-toolchain)"
          elan toolchain install "$TOOLCHAIN"
          elan default "$TOOLCHAIN"
          lean --version
          lake --version

      - name: Resolve pinned mathlib
        working-directory: formal/cace_formal
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Check proof sources are closed
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.lean' -E '\bsorry\b|OPEN OBLIGATION' \
              formal/cace_formal/CACEFormal formal/cace_formal/CACEFormal.lean; then
            echo 'Unclosed Lean proof obligation found.' >&2
            exit 1
          fi

      - name: Build CACE Formal
        working-directory: formal/cace_formal
        shell: bash
        env:
          LEAN_ABORT_ON_PANIC: '1'
        run: |
          set -euo pipefail
          lake build CACEFormal

      - name: Run independent exact checker regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_formal_v321.py

      - name: Write formal build attestation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root=pathlib.Path('.')
          formal=root/'formal'/'cace_formal'
          files=sorted((formal/'CACEFormal').rglob('*.lean')) + [formal/'CACEFormal.lean']
          h=hashlib.sha256()
          for p in files:
              h.update(str(p.relative_to(root)).encode()); h.update(b'\0'); h.update(p.read_bytes()); h.update(b'\0')
          def out(cmd,cwd=None):
              return subprocess.check_output(cmd,cwd=cwd,text=True).strip()
          data={
              'release':'3.21.0',
              'status':'PASS',
              'lean_version':out(['lean','--version']),
              'lake_version':out(['lake','--version']),
              'formal_source_sha256':h.hexdigest(),
              'theorem':'CACEFormal.mesh_admissibility_to_orthogonality',
              'discrete_prager_synge_theorem':'CACEFormal.discrete_prager_synge_from_mesh_admissibility',
              'proof_sources_closed':True,
              'external_machine_formal':True
          }
          (root/'v321_github_formal_build_attestation.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n\n')
          print(json.dumps(data,indent=2,sort_keys=True))
          PY

      - name: Upload attestation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cace-v321-formal-attestation
          path: v321_github_formal_build_attestation.json
