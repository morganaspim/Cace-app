name: CACE Quarantined Lean Standalone Preflight

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Quarantined Lean module path to compile standalone.'
        required: true
        default: 'CACEFormal/HDivDensityReduction.lean'

permissions:
  contents: read
  actions: read

concurrency:
  group: cace-canonical-qualification-oci
  cancel-in-progress: false

jobs:
  standalone-quarantine-preflight:
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 45
    env:
      CACE_TOOLCHAIN: leanprover/lean4:v4.32.1
      CACE_MATHLIB_COMMIT: 520045ab14e26149ee970e2e617ca04b09bde5d6
      CACE_PERSISTENT_ELAN_HOME: /var/lib/cace-cache/elan
      CACE_PACKAGE_CACHE: /var/lib/cace-cache/mathlib/v4.32.1-520045ab14e26149ee970e2e617ca04b09bde5d6/packages
      CACE_PACKAGE_CACHE_LOCK: /var/lib/cace-cache/mathlib/v330-prewarm.lock
      CACE_MANIFEST_CACHE_DIR: /var/lib/cace-cache/mathlib/manifests
      LAKE_ARTIFACT_CACHE: 'true'
      LAKE_CACHE_DIR: /var/lib/cace-cache/lake
      MATHLIB_NO_CACHE_ON_UPDATE: '1'

    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Establish exact head and serialize CACE Actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          python scripts/cace_actions_serialization_guard.py --current-run-id "$GITHUB_RUN_ID"
          printf 'exact_head=%s\n' "$GITHUB_SHA"

      - name: Validate quarantined standalone target
        id: target
        shell: bash
        env:
          REQUESTED_MODULE_RAW: ${{ inputs.module }}
        run: |
          set -euo pipefail
          REQUESTED_MODULE="$(printf '%s' "$REQUESTED_MODULE_RAW" | sed -E 's/^Module:[[:space:]]*//; s/^[[:space:]]+//; s/[[:space:]]+$//')"
          case "$REQUESTED_MODULE" in
            CACEFormal/*.lean) ;;
            *) echo "Target must be a CACEFormal/*.lean path." >&2; exit 2 ;;
          esac
          test -f "formal/cace_formal/$REQUESTED_MODULE"
          module_name="${REQUESTED_MODULE%.lean}"
          module_name="${module_name//\//.}"
          MODULE_NAME="$module_name" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          module = os.environ["MODULE_NAME"]
          cfg = json.loads(Path("formal/cace_formal/proof_guardrails.json").read_text())
          quarantine = set(cfg.get("quarantined_root_imports", []))
          allowed = set(cfg.get("allowed_root_imports", []))
          if module not in quarantine:
              raise SystemExit(f"standalone target is not explicitly quarantined: {module}")
          if module in allowed:
              raise SystemExit(f"standalone target is already approved for audited root: {module}")
          root = Path("formal/cace_formal/CACEFormal.lean").read_text().splitlines()
          if f"import {module}" in root:
              raise SystemExit(f"standalone target is already imported by audited root: {module}")
          print(f"CACE_STANDALONE_QUARANTINE_TARGET_OK module={module}")
          PY
          python3 scripts/cace_proof_guardrails.py validate
          python3 scripts/check_cace_workflow_guardrails.py
          python3 scripts/check_cace_known_failure_regressions.py
          python3 scripts/audit_cace_actions_policy.py
          printf 'module=%s\n' "$REQUESTED_MODULE" >> "$GITHUB_OUTPUT"
          printf 'module_name=%s\n' "$module_name" >> "$GITHUB_OUTPUT"

      - name: Reject malformed target source
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.module }}
        run: |
          set -euo pipefail
          python3 scripts/check_lean_source_sanity.py "formal/cace_formal/$TARGET"

      - name: Restore pinned Lean and exact Mathlib package tree
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$CACE_PERSISTENT_ELAN_HOME"
          export PATH="$ELAN_HOME/bin:$PATH"
          test -x "$ELAN_HOME/bin/elan"
          elan toolchain install "$CACE_TOOLCHAIN"
          test "$(cat formal/cace_formal/lean-toolchain)" = "$CACE_TOOLCHAIN"
          mkdir -p formal/cace_formal/.lake
          rm -rf formal/cace_formal/.lake/packages
          exec 9>"$CACE_PACKAGE_CACHE_LOCK"
          flock -s -w 900 9
          test -d "$CACE_PACKAGE_CACHE/mathlib/.git"
          test "$(git -C "$CACE_PACKAGE_CACHE/mathlib" rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
          cp -a --reflink=auto "$CACE_PACKAGE_CACHE" formal/cace_formal/.lake/packages
          flock -u 9
          cd formal/cace_formal
          lean --version
          lake --version
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"

          mkdir -p "$CACE_MANIFEST_CACHE_DIR"
          manifest_key="$(
            {
              printf '%s\n' "$CACE_TOOLCHAIN"
              sha256sum lakefile.lean
            } | sha256sum | awk '{print $1}'
          )"
          manifest_cache="$CACE_MANIFEST_CACHE_DIR/$manifest_key.json"
          if test -s "$manifest_cache"; then
            cp "$manifest_cache" lake-manifest.json
            echo "CACE_MANIFEST_CACHE_HIT key=$manifest_key"
          else
            echo "CACE_MANIFEST_CACHE_MISS key=$manifest_key"
            MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
            test -s lake-manifest.json
            install -m 0644 lake-manifest.json "$manifest_cache.tmp-$GITHUB_RUN_ID"
            mv "$manifest_cache.tmp-$GITHUB_RUN_ID" "$manifest_cache"
          fi
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"

      - name: Verify proof run is cache-local
        shell: bash
        run: |
          set -euo pipefail
          if ! find formal/cace_formal/.lake/packages/mathlib/.lake/build -type f -name '*.olean' -print -quit 2>/dev/null | grep -q .; then
            echo "Pinned Mathlib package cache has no compiled .olean artifacts." >&2
            exit 21
          fi

      - name: Compile proof API canaries
        id: canary_compile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$CACE_PERSISTENT_ELAN_HOME"
          export PATH="$ELAN_HOME/bin:$PATH"
          cd formal/cace_formal
          lake build +CACEFormal.GuardrailCanaries 2>&1 | tee "$GITHUB_WORKSPACE/cace-standalone-canary-build.log"

      - name: Compile quarantined target standalone
        id: target_compile
        continue-on-error: true
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.module }}
          TARGET_MODULE: ${{ steps.target.outputs.module_name }}
        run: |
          set -euo pipefail
          export ELAN_HOME="$CACE_PERSISTENT_ELAN_HOME"
          export PATH="$ELAN_HOME/bin:$PATH"
          cd formal/cace_formal
          lake build "+$TARGET_MODULE" 2>&1 | tee "$GITHUB_WORKSPACE/cace-standalone-target-build.log"
          printf 'CACE_STANDALONE_TARGET_OK target=%s exact_head=%s\n' "$TARGET" "$GITHUB_SHA"

      - name: Aggregate standalone compile failures
        if: always()
        shell: bash
        env:
          CANARY_OUTCOME: ${{ steps.canary_compile.outcome }}
          TARGET_OUTCOME: ${{ steps.target_compile.outcome }}
        run: |
          set -euo pipefail
          failures=0
          : > cace-standalone-compile-failures.txt
          for pair in "canary=$CANARY_OUTCOME" "target=$TARGET_OUTCOME"; do
            label="${pair%%=*}"
            outcome="${pair#*=}"
            case "$outcome" in
              success|skipped) ;;
              *)
                printf '%s=%s\n' "$label" "$outcome" >> cace-standalone-compile-failures.txt
                failures=$((failures + 1))
                ;;
            esac
          done
          if test "$failures" -ne 0; then
            cat cace-standalone-compile-failures.txt
            exit 40
          fi
          echo "CACE_STANDALONE_DIAGNOSTIC_SWEEP_OK"

      - name: Emit standalone engineering summary
        if: always()
        shell: bash
        run: |
          cat > cace-standalone-preflight-summary.txt <<EOF
          evidence_class=engineering/formal-standalone-preflight
          qualification=false
          promotion_state_candidate=STANDALONE_COMPILED
          exact_head=$GITHUB_SHA
          lean_toolchain=$CACE_TOOLCHAIN
          mathlib_commit=$CACE_MATHLIB_COMMIT
          target=${{ inputs.module }}
          note=This standalone compile is required before any quarantined module may be promoted into the audited root. It is not root compilation, axiom audit, or exact-head qualification.
          EOF
          cat cace-standalone-preflight-summary.txt

      - name: Upload standalone preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-standalone-lean-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cace-standalone-preflight-summary.txt
            cace-standalone-compile-failures.txt
            cace-standalone-canary-build.log
            cace-standalone-target-build.log
          if-no-files-found: warn
          retention-days: 14
