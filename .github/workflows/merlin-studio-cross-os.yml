name: Merlin Studio source ZIP Windows/macOS native verification
"on":
  push:
    branches: ["merlin/browser-operations-20261121"]
    paths: ["merlin/studio-cross-os-requests/**"]
permissions:
  contents: read
  actions: read
concurrency:
  group: merlin-studio-cross-os-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  request-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Admit exactly one typed cross-platform test request
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import base64,datetime,hashlib,json,os,re,urllib.request,uuid
          repo=os.environ['GITHUB_REPOSITORY'];commit=os.environ['GITHUB_SHA']
          assert repo=='morganaspim/Cace-app'
          assert os.environ['GITHUB_REF']=='refs/heads/merlin/browser-operations-20261121'
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,
                  headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
                           'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  raw=response.read(500000)
              return json.loads(raw)
          changes=api('commits/'+commit)['files']
          if len(changes)!=1 or changes[0].get('status')!='added':
              raise RuntimeError('exactly one new cross-OS request required')
          name=changes[0]['filename']
          m=re.fullmatch(r'merlin/studio-cross-os-requests/([0-9a-f-]{36})\.json',name)
          if not m: raise RuntimeError('cross-OS request path changed')
          item=api('contents/'+name+'?ref='+commit)
          raw=base64.b64decode(''.join(item['content'].split()),validate=True)
          if len(raw)>4096 or hashlib.sha1(('blob %d\0'%len(raw)).encode()+raw).hexdigest()!=item['sha']:
              raise RuntimeError('request bytes not Git-verified')
          obj=json.loads(raw)
          if (set(obj)!={'schema','request_id','operation','created_at'}
              or obj['schema']!='merlin-studio-cross-os-request/1'
              or obj['operation']!='verify-reviewed-universal-source-zip-on-windows-and-macos'
              or obj['request_id']!=m.group(1)
              or str(uuid.UUID(obj['request_id']))!=obj['request_id']
              or datetime.datetime.strptime(obj['created_at'],'%Y-%m-%dT%H:%M:%SZ').strftime('%Y-%m-%dT%H:%M:%SZ')!=obj['created_at']):
              raise RuntimeError('typed cross-OS request differs')
          print(json.dumps({'status':'admitted','request_sha256':hashlib.sha256(raw).hexdigest(),
            'model_calls':0,'host_installation':False,'production_qualified':False}))
          PY
  cross-platform:
    needs: request-admission
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Set up private Python 3.11 for test
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve previously reviewed exact ZIP by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 14760704858
          run-id: 45040029316
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/merlin-universal-source
      - name: Execute exact host OS loopback and restart test
        shell: bash
        env:
          MERLIN_PACKAGE: ${{ runner.temp }}/merlin-universal-source/Merlin-Studio-universal-source.zip
          MERLIN_REPORT: ${{ runner.temp }}/merlin-cross-os-evidence/report.json
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Mannyspiro/expert-robot.git merlin-cross-smoke
          cd merlin-cross-smoke
          git fetch origin 205a3354e073380dca8d2261debbcf972db06d90
          git checkout --detach 205a3354e073380dca8d2261debbcf972db06d90
          test "$(git rev-parse HEAD)" = "205a3354e073380dca8d2261debbcf972db06d90"
          python -B scripts/merlin_portable_cross_os_smoke.py --package "$MERLIN_PACKAGE" --source-sha c5b029956ded7594485bcbe1772294676cbb1322 --output "$MERLIN_REPORT"
      - name: Retain typed result and negative evidence for each native OS
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Merlin-Studio-cross-os-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/merlin-cross-os-evidence/
          if-no-files-found: warn
          retention-days: 30
