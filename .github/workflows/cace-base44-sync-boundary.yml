name: CACE Base44 Sync Boundary

on:
  pull_request:
    paths:
      - 'CACE_BASE44_GITHUB_SYNC_POLICY.json'
      - 'BASE44.md'
      - 'docs/BASE44_GITHUB_SYNC_ARCHITECTURE.md'
      - 'web/**'
      - 'base44/**'
      - 'api/**'
      - 'schema/public/**'
      - 'docs/help/**'
      - 'formal/**'
      - 'cpp/**'
      - 'cace_studio/core/**'
      - 'cace_studio/modules/**'
      - 'cace_studio/data/proof_*.json'
      - 'cace_studio/accounts.py'
      - 'cace_studio/trial_entitlement.py'
      - 'cace_studio/ai/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/cace-base44-sync-boundary.yml'
      - 'CACE_*POLICY.json'
      - 'CACE_AGENT_BOOTSTRAP.json'
      - 'CACE_CODE_BUILDER_BOOTSTRAP.json'
      - 'CACE_BUILD_LITE.json'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cace-canonical-qualification-oci
  cancel-in-progress: false

jobs:
  base44-sync-boundary:
    runs-on: [self-hosted, cace, oci, aarch64]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Establish exact head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          printf 'exact_head=%s\n' "$expected"

      - name: Refuse concurrent CACE runner work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/cace_actions_serialization_guard.py --current-run-id "${GITHUB_RUN_ID}" --ignore-workflow-name "CACE Collaboration Coordination Validation" --ignore-workflow-name "CACE Lean Source Sanity"

      - name: Classify changed paths and enforce Base44 boundary
        env:
          BASE44_GITHUB_ACTOR: ${{ vars.BASE44_GITHUB_ACTOR }}
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}" --depth=1
          git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/cace_changed_paths.txt

          strict=0
          actor_lower="${GITHUB_ACTOR_NAME,,}"
          if [[ "${actor_lower}" == *base44* ]]; then
            strict=1
          fi
          if [[ -n "${BASE44_GITHUB_ACTOR}" && "${GITHUB_ACTOR_NAME}" == "${BASE44_GITHUB_ACTOR}" ]]; then
            strict=1
          fi
          if [[ "${HEAD_REF}" == base44/* ]]; then
            strict=1
          fi

          args=(--paths-file /tmp/cace_changed_paths.txt --json)
          if [[ "${strict}" == "1" ]]; then
            args+=(--base44)
          fi
          python scripts/check_base44_sync_contract.py "${args[@]}"

      - name: Run Base44 sync policy regressions
        run: python -m pytest -q tests/test_base44_sync_contract.py
