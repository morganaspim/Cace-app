name: CACE OCI MCP Install

on:
  push:
    branches:
      - deploy/cace-oci-production-locked
    paths:
      - .github/workflows/cace-oci-mcp-install.yml

permissions:
  contents: read

concurrency:
  group: cace-canonical-qualification-oci
  cancel-in-progress: false

jobs:
  install-oci-mcp:
    name: install-oci-mcp
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 20

    env:
      CACE_MCP_SHA: 0691317d64c1286662f93f2730bdd73b78d25739
      CACE_FORMAL_BASELINE_SHA: 7091548766deef4301ac8d62d3445d95945662e7
      UV_VERSION: 0.12.13
      PYTHON_VERSION: 3.13.15

    steps:
      - name: Checkout validated MCP source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CACE_MCP_SHA }}
          fetch-depth: 64
          clean: true
          persist-credentials: false

      - name: Verify source and baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CACE_MCP_SHA"
          git merge-base --is-ancestor "$CACE_FORMAL_BASELINE_SHA" "$CACE_MCP_SHA"
          test -f ops/oci_mcp/server.py
          test -f tests/test_oci_mcp_policy.py
          sudo -n true

      - name: Install isolated MCP runtime
        shell: bash
        run: |
          set -euo pipefail

          root=/opt/cace-oci-mcp
          release="$root/releases/$CACE_MCP_SHA"
          python_root="$root/python"
          venv="$root/venv"

          sudo dnf -y install curl policycoreutils-python-utils
          if ! id cace-mcp >/dev/null 2>&1; then
            sudo useradd --system --create-home --home-dir /var/lib/cace-oci-mcp --shell /sbin/nologin cace-mcp
          fi
          if getent group systemd-journal >/dev/null 2>&1; then
            sudo usermod -a -G systemd-journal cace-mcp
          fi

          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" |
            env UV_INSTALL_DIR="$RUNNER_TEMP/cace-mcp-uv" sh
          uv="$RUNNER_TEMP/cace-mcp-uv/uv"

          sudo mkdir -p "$root/releases" "$python_root" /var/lib/cace-oci-mcp/cache
          sudo chown -R "$(id -un):$(id -gn)" "$root" /var/lib/cace-oci-mcp

          UV_PYTHON_INSTALL_DIR="$python_root" "$uv" python install "$PYTHON_VERSION"
          python_bin="$(find "$python_root" -type f -path '*/bin/python3.13' -perm -u+x | head -n 1)"
          test -n "$python_bin"

          rm -rf "$release"
          mkdir -p "$release/ops"
          cp -a ops/oci_mcp "$release/ops/"
          touch "$release/ops/__init__.py"

          rm -rf "$venv"
          "$uv" venv --python "$python_bin" "$venv"
          "$uv" pip install --python "$venv/bin/python" -r "$release/ops/oci_mcp/requirements.txt"
          "$uv" pip install --python "$venv/bin/python" pytest

          "$venv/bin/python" -m py_compile "$release/ops/oci_mcp/server.py"
          "$venv/bin/python" -m pytest -q tests/test_oci_mcp_policy.py

          ln -sfn "$release" "$root/current"

          sudo install -o root -g root -m 0644 \
            "$release/ops/oci_mcp/cace-oci-mcp.service" \
            /etc/systemd/system/cace-oci-mcp.service
          sudo install -o root -g root -m 0440 \
            "$release/ops/oci_mcp/cace-oci-mcp.sudoers" \
            /etc/sudoers.d/cace-oci-mcp
          sudo visudo -cf /etc/sudoers.d/cace-oci-mcp

          if [[ ! -f /etc/cace-oci-mcp.env ]]; then
            printf '%s\n' \
              'CACE_OCI_MCP_ALLOW_SERVICE_RESTART=false' \
              'CACE_OCI_MCP_ALLOW_NETWORK_WRITE=false' |
              sudo tee /etc/cace-oci-mcp.env >/dev/null
            sudo chmod 0600 /etc/cace-oci-mcp.env
          fi

          sudo install -d -o cace-mcp -g cace-mcp -m 0700 \
            /var/lib/cace-oci-mcp /var/lib/cace-oci-mcp/cache
          sudo chown -R root:root "$release"
          sudo chmod -R go-w "$release"

          sudo systemctl daemon-reload
          sudo systemctl enable --now cace-oci-mcp
          sudo systemctl restart cace-oci-mcp

      - name: Verify fail-closed MCP service
        shell: bash
        run: |
          set -euo pipefail

          ready=0
          for attempt in {1..30}; do
            if sudo systemctl is-active --quiet cace-oci-mcp &&
               ss -ltn | grep -q '127.0.0.1:8765'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1

          sudo grep -q '^CACE_OCI_MCP_ALLOW_SERVICE_RESTART=false$' /etc/cace-oci-mcp.env
          sudo grep -q '^CACE_OCI_MCP_ALLOW_NETWORK_WRITE=false$' /etc/cace-oci-mcp.env

          curl -fsS \
            -H 'Authorization: Bearer Oracle' \
            http://169.254.169.254/opc/v2/instance/ >/tmp/cace-imds.json

          python - <<'PY'
          import json
          with open('/tmp/cace-imds.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload.get('id', '').startswith('ocid1.instance.')
          assert payload.get('compartmentId', '').startswith(('ocid1.compartment.', 'ocid1.tenancy.'))
          print(
              'CACE_OCI_MCP_IMDS_OK '
              'instance_id=' + payload['id'] +
              ' compartment_id=' + payload['compartmentId']
          )
          PY

          echo "CACE_OCI_MCP_SERVICE_PASS source_sha=$CACE_MCP_SHA endpoint=http://127.0.0.1:8765/mcp writes=disabled"

      - name: Emit MCP diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          sudo systemctl status cace-oci-mcp --no-pager -l
          sudo journalctl -u cace-oci-mcp -n 160 --no-pager
          ss -ltnp
