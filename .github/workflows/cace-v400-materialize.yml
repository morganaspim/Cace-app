name: CACE v4.00 materialize

on:
  push:
    branches: [merge/gui-canvas-web]

permissions:
  contents: write

concurrency:
  group: cace-v400-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify OCI runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$RUNNER_NAME arch=$RUNNER_ARCH os=$RUNNER_OS"
          test "$RUNNER_NAME" = "cace-oci-a1"
      - name: Verify and extract content-addressed v4.00 bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cat             .bootstrap/nov2_00             .bootstrap/nov2_01             .bootstrap/nov2_02             .bootstrap/tail4_00             .bootstrap/tail4_01             .bootstrap/tail4_02             .bootstrap/tail4_03             .bootstrap/t2a_00             .bootstrap/t2a_01             .bootstrap/t2b_00             .bootstrap/t2b_01 > "$RUNNER_TEMP/v400.b64"
          base64 -d "$RUNNER_TEMP/v400.b64" > "$RUNNER_TEMP/v400.tar.gz"
          echo '5bc3d607a241ddb5745992f913a743516218bb08535f9038baeb2c04a752e3a1  '"$RUNNER_TEMP/v400.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/v400.tar.gz" -C .
          python3 web/scripts/materialize_canvas.py
      - name: Isolated Python runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/0.12.13/install.sh | env UV_INSTALL_DIR="$RUNNER_TEMP/cace-v400-uv" UV_NO_MODIFY_PATH=1 sh
          "$RUNNER_TEMP/cace-v400-uv/uv" venv --seed --python 3.13.15 "$RUNNER_TEMP/cace-v400"
          "$RUNNER_TEMP/cace-v400/bin/python" -m pip install -e '.[test]'
          "$RUNNER_TEMP/cace-v400/bin/python" -m pip install -r requirements-runtime.txt
          echo "$RUNNER_TEMP/cace-v400/bin" >> "$GITHUB_PATH"
      - name: Focused v4.00 fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cace-v400/bin/python" -m pytest -q             tests/test_runtime_math_object_v400.py             tests/test_runtime_heartbeat_v400.py             tests/test_canvas_heartbeat_bridge_v400.py             tests/test_runtime_sandbox_v400.py             tests/test_runtime_entitlement_v400.py             tests/test_monero_payments_v400.py             tests/test_license_audit_v400.py             tests/test_growth_controller_v400.py
      - name: License policy and SBOM gate
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cace-v400/bin/python" scripts/audit_third_party_licenses.py --root .
          "$RUNNER_TEMP/cace-v400/bin/python" scripts/generate_sbom.py --root . --spdx runtime-v400.spdx.json --cyclonedx runtime-v400.cyclonedx.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Type-check and build canvas
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run build
      - name: Native C++ smoke
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cace-v400/bin/python" -m pip install 'cmake>=3.30,<4'
          CMAKE="$RUNNER_TEMP/cace-v400/bin/cmake"
          CTEST="$RUNNER_TEMP/cace-v400/bin/ctest"
          "$CMAKE" -S cpp -B "$RUNNER_TEMP/build-runtime-v400" -DCMAKE_BUILD_TYPE=Release
          "$CMAKE" --build "$RUNNER_TEMP/build-runtime-v400" -j2
          "$CTEST" --test-dir "$RUNNER_TEMP/build-runtime-v400" --output-on-failure
      - name: Reject formal proof changes
        shell: bash
        run: |
          set -euo pipefail
          if git status --short -- formal/ | grep -q .; then
            echo 'formal proof tree was modified by runtime materialization' >&2
            git status --short -- formal/
            exit 1
          fi
      - name: Replace bootstrap with reviewed source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap web/vendor .github/workflows/cace-v400-materialize.yml web/node_modules web/dist runtime-v400.spdx.json runtime-v400.cyclonedx.json
          git add -A
          if git diff --cached --name-only | grep -E '^formal/' ; then
            echo 'refusing to commit formal proof changes' >&2
            exit 1
          fi
          git config user.name 'cace-v400-materializer'
          git config user.email 'cace-v400-materializer@users.noreply.github.com'
          git commit -m 'runtime: add coordinateless heartbeat payment architecture v4.00'
          git push origin HEAD:merge/gui-canvas-web
