name: Merlin temporal witness formal research
on:
  push:
    branches: ['merlin/oci-jobs/xenomath-lean-20261119']
    paths: ['.github/workflows/merlin-xenomath-temporal.yml', 'research/xenomath-lean/temporal-dispatch.json']
permissions:
  contents: read
concurrency:
  group: cace-canonical-qualification-oci
  cancel-in-progress: false
jobs:
  bounded-formal-research:
    if: github.repository == 'morganaspim/Cace-app'
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 6
    steps:
      - name: Check exact core proof source and diagnose pinned imports
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,platform,re,resource,signal,subprocess,sys,time,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/('merlin-temporal-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']);root.mkdir(exist_ok=False)
          source='28557f065bff6805afad073c0769256d7d79fc48'
          url='https://api.github.com/repos/morganaspim/Cace-app/contents/research/xenomath-lean/TemporalWitness.lean?ref='+source
          q=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(q,timeout=20) as r: body=r.read(128*1024+1)
          if len(body)>128*1024: raise RuntimeError('bounded source response exceeded')
          p=json.loads(body)
          if p.get('encoding')!='base64': raise RuntimeError('source encoding')
          raw=base64.b64decode(''.join(p['content'].split()),validate=True)
          blob=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
          if blob!='0f825f5f316e1123606173900d07dafe996ef0cc' or p['sha']!=blob: raise RuntimeError('source pin')
          text=raw.decode('utf-8')
          if re.search(r'\b(sorry|admit|unsafe|run_cmd|native_decide|initialize)\b|(?m:^\s*axiom\s)',text): raise RuntimeError('proof source gate')
          names=re.findall(r'^#print axioms ([A-Za-z_][A-Za-z_0-9.]*)\s*$',text,re.M)
          if len(names)!=17 or len(set(names))!=17: raise RuntimeError('theorem manifest mismatch')
          (root/'TemporalWitness.lean').write_bytes(raw)
          env={'PATH':'/usr/bin:/bin','HOME':str(root),'LANG':'C.UTF-8','LEAN_NUM_THREADS':'1'}
          base=pathlib.Path('/var/lib/cace-cache/elan/toolchains/leanprover--lean4---v4.32.1')
          lean=base/'bin/lean'
          def limits():
              resource.setrlimit(resource.RLIMIT_CPU,(90,90));resource.setrlimit(resource.RLIMIT_AS,(3*1024**3,3*1024**3));resource.setrlimit(resource.RLIMIT_FSIZE,(4*1024**2,4*1024**2));resource.setrlimit(resource.RLIMIT_CORE,(0,0))
          def run(file,content=None,extra=None):
              if content is not None: (root/file).write_text(content)
              logfile=root/(file+'.log');e=dict(env);e.update(extra or {});start=time.monotonic();timed=False
              with logfile.open('wb') as stream:
                  proc=subprocess.Popen([str(lean),'-j','1','-s','16384','-M','2048',file],cwd=str(root),env=e,stdout=stream,stderr=subprocess.STDOUT,stdin=subprocess.DEVNULL,start_new_session=True,preexec_fn=limits)
                  try: rc=proc.wait(timeout=60)
                  except subprocess.TimeoutExpired: timed=True;os.killpg(proc.pid,signal.SIGKILL);rc=proc.wait()
              log=logfile.read_bytes()
              return {'exit_code':rc,'timed_out':timed,'elapsed_seconds':time.monotonic()-start,'log':logfile.name,'log_sha256':hashlib.sha256(log).hexdigest()},log.decode('utf-8',errors='replace')
          receipt={'schema':'merlin-temporal-formal-research/1','run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'workflow_commit':os.environ['GITHUB_SHA'],'source_commit':source,'source_blob':blob,'source_sha256':hashlib.sha256(raw).hexdigest(),'runner':os.environ.get('RUNNER_NAME'),'architecture':platform.machine(),'qualification':False,'promotion_authority':False,'independent_verification':'not_established','avrea_used':False,'cache_mutation':False,'production_mutation':False,'resource_limit_bytes':3*1024**3}
          try:
              version=subprocess.run([str(lean),'--version'],env=env,capture_output=True,text=True,timeout=10,check=True).stdout.strip()
              if not re.search(r'\b4\.32\.1\b',version): raise RuntimeError('version mismatch')
              receipt['version']=version
              positive,plog=run('TrueControl.lean','theorem true_control : (0 : Nat) = 0 := rfl\n')
              compiled,log=run('TemporalWitness.lean')
              negative,nlog=run('FalseControl.lean','theorem false_control : (0 : Nat) = 1 := by decide\n')
              negative_semantic,slog=run('FalseJoint.lean','theorem false_joint : Exists fun x : Bool => forall t : Bool, x = t := by decide\n')
              matches=re.findall(r"'([^']+)' (?:depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)",log,re.S)
              audits={n:[a.strip() for a in aa.split(',') if a.strip()] for n,aa in matches}
              def logical_rejection(result,log):
                  return result['exit_code']!=0 and not result['timed_out'] and 'false' in log.lower() and 'decide' in log and not any(x in log for x in ['failed to read','failed to create','memory','unknown module'])
              passed=(positive['exit_code']==0 and compiled['exit_code']==0 and len(matches)==17 and set(audits)==set(names) and all(set(a)<={'propext','Classical.choice','Quot.sound'} for a in audits.values()) and logical_rejection(negative,nlog) and logical_rejection(negative_semantic,slog))
              receipt.update({'positive':positive,'compile':compiled,'negative_arithmetic':negative,'negative_joint':negative_semantic,'negative_arithmetic_logical':logical_rejection(negative,nlog),'negative_joint_logical':logical_rejection(negative_semantic,slog),'axioms':audits,'theorem_count':len(names),'formal_status':'compiled_and_audited' if passed else 'failed'})
              diagnostics=[]
              for prefix in [base,base.resolve()]:
                  for suffix in ['lib/lean/Lean/Structure.ir','lib/lean/Lean/Structure.olean']:
                      path=prefix/suffix;entry={'path':str(path)}
                      try:
                          st=path.stat();entry.update({'size':st.st_size,'mode':oct(st.st_mode & 4095)})
                          with path.open('rb') as f: entry['one_byte_readable']=len(f.read(1))==1
                      except OSError as exc: entry.update({'error_class':type(exc).__name__,'errno':exc.errno})
                      diagnostics.append(entry)
              receipt['dependency_metadata']=diagnostics
              packages=pathlib.Path('/var/lib/cace-cache/mathlib/v4.32.1-520045ab14e26149ee970e2e617ca04b09bde5d6/packages')
              if (packages/'mathlib').is_dir():
                  check=subprocess.run(['/usr/bin/git','-C',str(packages/'mathlib'),'rev-parse','HEAD'],env=env,capture_output=True,text=True,timeout=10,check=True)
                  receipt['mathlib_revision']=check.stdout.strip()
                  if receipt['mathlib_revision']=='520045ab14e26149ee970e2e617ca04b09bde5d6':
                      lp=':'.join(str(p/'.lake/build/lib/lean') for p in sorted(packages.iterdir()) if (p/'.lake/build/lib/lean').is_dir())
                      receipt['narrow_import'],_=run('NarrowImport.lean','import Mathlib.Data.Real.Basic\ntheorem real_control (x : Real) : x = x := rfl\n',{'LEAN_PATH':lp})
              receipt['status']=receipt['formal_status']
          except Exception as exc: receipt.update({'status':'blocked_or_failed','error_class':type(exc).__name__})
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          print(json.dumps(receipt,indent=2,sort_keys=True))
          if receipt['status']!='compiled_and_audited': raise SystemExit('formal checks incomplete; retain all evidence')
          PY
      - name: Preserve exact proof artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merlin-temporal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merlin-temporal-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 30
          if-no-files-found: warn
