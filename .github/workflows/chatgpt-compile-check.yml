name: ChatGPT x64 web native deps

on:
  push:
    branches:
      - chatgpt/upload-compile-check-20260916

permissions:
  contents: read

jobs:
  x64-web-native-packages:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact x64 native helper packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/x64-packs"
          npm pack \
            @rollup/rollup-linux-x64-gnu@4.63.3 \
            @esbuild/linux-x64@0.25.12 \
            @tailwindcss/oxide-linux-x64-gnu@4.3.3 \
            lightningcss-linux-x64-gnu@1.32.0 \
            --pack-destination "$RUNNER_TEMP/x64-packs"
          ls -lh "$RUNNER_TEMP/x64-packs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-web-x64-native
          path: ${{ runner.temp }}/x64-packs/*.tgz
          compression-level: 0
          retention-days: 1
