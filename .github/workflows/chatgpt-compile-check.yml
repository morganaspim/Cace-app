name: ChatGPT compile check

on:
  push:
    branches:
      - chatgpt/upload-compile-check-20260916

permissions:
  contents: read

jobs:
  python-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' cmake
      - name: Compile Python sources
        run: python -m compileall -q cace_studio
      - name: Build native C++ runtime
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --parallel 2
          ctest --test-dir cpp/build --output-on-failure
      - name: CLI smoke test
        run: python -m cace_studio.cli registry > /tmp/cace-registry.json
      - name: Focused regression smoke tests
        run: python -m pytest -q tests/test_cli.py tests/test_claim_registry_v331.py tests/test_attest_cli_v336.py

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect web source
        id: detect
        shell: bash
        run: |
          if [[ -f package.json && -d src ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No web package found on this GitHub branch; uploaded ZIP contains additional web source.'
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Install web dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm install
      - name: Build web UI
        if: steps.detect.outputs.present == 'true'
        run: npm run build
