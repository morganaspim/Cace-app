name: ChatGPT compile check

on:
  push:
    branches:
      - chatgpt/upload-compile-check-20260916

permissions:
  contents: read

jobs:
  python-native:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bootstrap Python 3.13.15 with uv
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/0.12.13/install.sh |
            env UV_INSTALL_DIR="$RUNNER_TEMP/cace-uv" UV_NO_MODIFY_PATH=1 sh
          "$RUNNER_TEMP/cace-uv/uv" venv --seed --python 3.13.15 "$RUNNER_TEMP/cace-compile-check"
          echo "$RUNNER_TEMP/cace-compile-check/bin" >> "$GITHUB_PATH"
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]' cmake
      - name: Compile Python sources
        run: python -m compileall -q cace_studio
      - name: Build native C++ runtime
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --parallel 2
          ctest --test-dir cpp/build --output-on-failure
      - name: CLI smoke test
        run: python -m cace_studio.cli registry > /tmp/cace-registry.json
      - name: Focused regression smoke tests
        run: python -m pytest -q tests/test_cli.py tests/test_claim_registry_v331.py tests/test_attest_cli_v336.py

  web-source-check:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check whether matching GitHub branch contains uploaded web source
        shell: bash
        run: |
          if [[ -f package.json && -d src ]]; then
            echo 'Web source is present on branch.'
          else
            echo 'Uploaded ZIP web manifest is staged for dependency resolution, but src is only in the uploaded ZIP.'
          fi

  web-deps:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact uploaded web dependencies
        run: npm install
      - name: Pack dependency tree for uploaded ZIP build
        shell: bash
        run: tar -czf "$RUNNER_TEMP/cace-node-modules.tgz" node_modules package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-web-node-modules
          path: ${{ runner.temp }}/cace-node-modules.tgz
          compression-level: 0
          retention-days: 1
