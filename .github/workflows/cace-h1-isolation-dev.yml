name: CACE theorem metadata isolated repair probe

on:
  workflow_dispatch:
  push:
    branches: [implement/cace-rigor-playground-v337]
    paths:
      - '.github/workflows/cace-h1-isolation-dev.yml'

permissions:
  contents: read

# Non-qualifying development harness. The candidate repair is applied only in the
# runner workspace. Success is engineering evidence; exact-head canonical
# qualification remains mandatory after source promotion.
concurrency:
  group: cace-formal-isolation-dev
  cancel-in-progress: false

jobs:
  formal-isolation:
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 30
    env:
      CACE_TOOLCHAIN: leanprover/lean4:v4.32.1
      CACE_MATHLIB_COMMIT: 520045ab14e26149ee970e2e617ca04b09bde5d6
      ELAN_HOME: /var/lib/cace-cache/elan
      CACE_PACKAGE_CACHE: /var/lib/cace-cache/mathlib/v4.32.1-520045ab14e26149ee970e2e617ca04b09bde5d6/packages
      CACE_PACKAGE_CACHE_LOCK: /var/lib/cace-cache/mathlib/v330-prewarm.lock
      CACE_BUILD_CACHE_ROOT: /var/lib/cace-cache/canonical-qualification-build

    steps:
      - name: Checkout exact probe head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify exact probe boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/implement/cace-rigor-playground-v337'
          test "$RUNNER_NAME" = 'cace-oci-a1'
          test -z "$(git status --porcelain --untracked-files=no)"
          formal_tree="$(git rev-parse HEAD:formal/cace_formal)"
          toolchain_key="$(printf '%s' "$CACE_TOOLCHAIN" | tr '/:' '__')"
          build_cache="$CACE_BUILD_CACHE_ROOT/$toolchain_key/$CACE_MATHLIB_COMMIT/$formal_tree"
          echo "CACE_FORMAL_TREE_SHA=$formal_tree" >> "$GITHUB_ENV"
          echo "CACE_FORMAL_BUILD_CACHE=$build_cache" >> "$GITHUB_ENV"
          printf 'probe_head=%s\nformal_tree=%s\n' "$GITHUB_SHA" "$formal_tree"

      - name: Restore exact pinned dependencies and retained build frontier
        shell: bash
        working-directory: formal/cace_formal
        run: |
          set -euo pipefail
          export PATH="$ELAN_HOME/bin:$PATH"
          test -x "$ELAN_HOME/bin/elan"
          elan toolchain install "$CACE_TOOLCHAIN"
          test "$(cat lean-toolchain)" = "$CACE_TOOLCHAIN"
          lean --version
          lake --version

          mkdir -p .lake
          rm -rf .lake/packages .lake/build
          exec 9>"$CACE_PACKAGE_CACHE_LOCK"
          flock -s -w 900 9
          test -d "$CACE_PACKAGE_CACHE/mathlib/.git"
          test "$(git -C "$CACE_PACKAGE_CACHE/mathlib" rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"
          cp -a --reflink=auto "$CACE_PACKAGE_CACHE" .lake/packages
          flock -u 9
          echo CACE_METADATA_ISOLATION_DEPENDENCY_CACHE_HIT

          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$CACE_MATHLIB_COMMIT"

          if [[ -d "$CACE_FORMAL_BUILD_CACHE/build" ]]; then
            cp -a --reflink=auto "$CACE_FORMAL_BUILD_CACHE/build" .lake/build
            echo "CACE_METADATA_ISOLATION_BUILD_CACHE_HIT tree=$CACE_FORMAL_TREE_SHA"
          else
            echo "CACE_METADATA_ISOLATION_BUILD_CACHE_MISS tree=$CACE_FORMAL_TREE_SHA"
          fi

      - name: Apply exact-fingerprint metadata repair candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path('formal/cace_formal/CACEFormal/V330TheoremMetadata.lean')
          before = path.read_bytes()
          text = before.decode('utf-8')

          replacements = [
              ('  let .thmInfo theorem := info\n', '  let .thmInfo thm := info\n', 1, 'CACE-LEAN-METADATA-RESERVED-BINDER-001'),
              ('theorem.value', 'thm.value', 1, 'CACE-LEAN-METADATA-RESERVED-BINDER-001'),
              ('theorem.type', 'thm.type', 2, 'CACE-LEAN-METADATA-RESERVED-BINDER-001'),
              ('theorem.levelParams', 'thm.levelParams', 1, 'CACE-LEAN-METADATA-RESERVED-BINDER-001'),
              ('    liftIO <| IO.println s!"CACE_THEOREM_METADATA\\t{record.compress}"\n',
               '    IO.println s!"CACE_THEOREM_METADATA\\t{record.compress}"\n',
               1, 'CACE-LEAN-METADATA-LIFTIO-001'),
          ]
          for old, new, expected, fingerprint in replacements:
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{fingerprint}: expected {expected} occurrence(s), found {found}: {old!r}')
              text = text.replace(old, new)

          if 'let .thmInfo theorem := info' in text:
              raise SystemExit('CACE-LEAN-METADATA-RESERVED-BINDER-001 survived candidate repair')
          if 'liftIO <| IO.println' in text:
              raise SystemExit('CACE-LEAN-METADATA-LIFTIO-001 survived candidate repair')

          path.write_text(text, encoding='utf-8')
          after = path.read_bytes()
          Path('metadata-isolation-hashes.txt').write_text(
              f'{path.name} original_sha256={sha256(before).hexdigest()} patched_sha256={sha256(after).hexdigest()}\n',
              encoding='utf-8',
          )
          print(Path('metadata-isolation-hashes.txt').read_text(encoding='utf-8'), end='')
          PY

      - name: Compile exact failed theorem metadata target
        shell: bash
        working-directory: formal/cace_formal
        run: |
          set -euo pipefail
          export PATH="$ELAN_HOME/bin:$PATH"
          lake build CACEFormal.V330TheoremMetadata \
            2>&1 | tee "$GITHUB_WORKSPACE/metadata-isolation-target.log"

      - name: Write recurrence-prevention evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def digest(path):
              p = Path(path)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None

          hashes = Path('metadata-isolation-hashes.txt')
          payload = {
              'schema': 'cace-formal-isolation-probe-v3',
              'git_commit': os.environ.get('GITHUB_SHA'),
              'formal_tree_sha': os.environ.get('CACE_FORMAL_TREE_SHA'),
              'lean_toolchain': os.environ.get('CACE_TOOLCHAIN'),
              'mathlib_commit': os.environ.get('CACE_MATHLIB_COMMIT'),
              'failure_fingerprints': [
                  'CACE-LEAN-METADATA-RESERVED-BINDER-001',
                  'CACE-LEAN-METADATA-LIFTIO-001',
              ],
              'proof_effect': 'none',
              'qualification_effect': 'none',
              'candidate_source_hashes': hashes.read_text(encoding='utf-8').splitlines() if hashes.exists() else [],
              'target_build_log_sha256': digest('metadata-isolation-target.log'),
              'recurrence_prevention': [
                  'reject reserved theorem binder pattern',
                  'reject liftIO IO.println pattern in run_meta exporter',
                  'compile V330TheoremMetadata in isolation before canonical retry',
                  'do not retry unchanged failure fingerprint/input hash',
              ],
              'nonclaim': 'This probe is engineering evidence only. It does not qualify theorem metadata or any mathematical claim.',
          }
          Path('metadata-isolation-evidence.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload isolation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-theorem-metadata-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            metadata-isolation-hashes.txt
            metadata-isolation-target.log
            metadata-isolation-evidence.json
