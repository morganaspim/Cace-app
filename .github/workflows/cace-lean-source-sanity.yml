name: CACE Lean Source Sanity

on:
  pull_request:
    paths:
      - 'formal/**/*.lean'
      - 'scripts/check_lean_source_sanity.py'
      - 'scripts/cace_proof_guardrails.py'
      - 'formal/cace_formal/proof_guardrails.json'
      - 'formal/FAILURE_GUARDRAILS.md'
      - 'tests/test_lean_source_sanity.py'
      - 'tests/test_cace_proof_guardrails.py'
      - '.github/workflows/cace-lean-source-sanity.yml'

permissions:
  contents: read

jobs:
  source-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate permanent proof policy
        run: python3 scripts/cace_proof_guardrails.py validate

      - name: Reject malformed Lean source seams
        run: python3 scripts/check_lean_source_sanity.py formal/cace_formal
