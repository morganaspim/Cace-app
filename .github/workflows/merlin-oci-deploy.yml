name: Merlin OCI Preview Deploy

on:
  push:
    branches: ["merlin-deploy/**"]
    paths:
      - "bridge/merlin-request.json"
      - "bridge/merlin-source.tar.gz"
      - ".github/workflows/merlin-oci-deploy.yml"

permissions:
  contents: write

concurrency:
  group: merlin-oci-preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 25
    steps:
      - name: Check out deployment request
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          clean: true

      - name: Validate source archive and request
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          test -s bridge/merlin-request.json
          test -s bridge/merlin-source.tar.gz
          test -s bridge/merlin-evidence.tar.gz
          python3 - bridge/merlin-request.json bridge/merlin-source.tar.gz bridge/merlin-evidence.tar.gz <<'PY'
          import hashlib, json, pathlib, re, sys, tarfile
          req_path, source_path, evidence_path = map(pathlib.Path, sys.argv[1:])
          req = json.loads(req_path.read_text())
          source_raw, evidence_raw = source_path.read_bytes(), evidence_path.read_bytes()
          assert req.get("schema_version") == 1
          assert re.fullmatch(r"merlin-deploy-[0-9]+-[0-9a-f]{40}", req.get("request_id", ""))
          assert re.fullmatch(r"[0-9a-f]{40}", req.get("expert_robot_commit", ""))
          assert req.get("authority") == "qualification-only"
          assert req.get("promotion_authority") is False
          assert req.get("public_host") == "merlin.129.146.160.46.nip.io"
          assert req.get("exposure") == "bounded-interactive"
          assert req.get("archive_sha256") == hashlib.sha256(source_raw).hexdigest()
          assert req.get("archive_size_bytes") == len(source_raw)
          assert req.get("evidence_run_id") == 42069240351
          assert req.get("evidence_source_commit") == "51f0c8a8977a3095e2719d6759c91397c2e23352"
          assert req.get("evidence_artifact_id") == 13433224922
          assert req.get("evidence_artifact_sha256") == "14fe49cca132007ce4f1fd9e1e3507bb82f5c7e693f556916c4ea35786a374e8"
          assert req.get("evidence_archive_sha256") == hashlib.sha256(evidence_raw).hexdigest()
          assert req.get("evidence_archive_size_bytes") == len(evidence_raw)
          for archive_path, limit in ((source_path, 100*1024*1024), (evidence_path, 20*1024*1024)):
              expanded = 0
              with tarfile.open(archive_path, "r:gz") as archive:
                  for member in archive.getmembers():
                      p = pathlib.PurePosixPath(member.name)
                      assert not p.is_absolute() and ".." not in p.parts
                      assert not (member.issym() or member.islnk() or member.isdev() or member.isfifo())
                      expanded += max(0, member.size)
                      assert expanded <= limit
          print("MERLIN_DEPLOY_AND_EVIDENCE_REQUEST_VALID")
          print(req["request_id"], req["expert_robot_commit"])
          PY
          for field in request_id expert_robot_commit evidence_source_commit evidence_run_id evidence_artifact_id evidence_artifact_sha256 evidence_archive_sha256; do
            value="$(python3 -c 'import json,sys; print(json.load(open("bridge/merlin-request.json"))[sys.argv[1]])' "$field")"
            echo "$field=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Check OCI capacity and existing Nginx
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          if [ "$available_kb" -lt 262144 ]; then
            echo "::error::At least 256 MiB free is required; no cache or user data will be deleted."
            exit 1
          fi
          command -v python3
          command -v nginx
          command -v curl
          sudo -n true
          sudo systemctl is-active --quiet nginx
          echo "Existing CACE Nginx is active and will be preserved."

      - name: Install isolated Merlin release and run local smoke tests
        shell: bash
        env:
          REQUEST_ID: ${{ steps.validate.outputs.request_id }}
          EVIDENCE_SOURCE_SHA: ${{ steps.validate.outputs.evidence_source_commit }}
          EVIDENCE_RUN_ID: ${{ steps.validate.outputs.evidence_run_id }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.validate.outputs.evidence_artifact_id }}
          EVIDENCE_ARTIFACT_SHA: ${{ steps.validate.outputs.evidence_artifact_sha256 }}
        run: |
          set -euo pipefail
          app_user="$(id -un)"
          app_group="$(id -gn)"
          python_bin="$(find /opt/cace-web/python -type f -path '*/bin/python3.13' -perm -u+x 2>/dev/null | head -n 1)"
          if [ -z "$python_bin" ] && command -v python3.13 >/dev/null 2>&1; then python_bin="$(command -v python3.13)"; fi
          if [ -z "$python_bin" ]; then echo "::error::Pinned Python 3.13 runtime from the existing CACE deployment is unavailable."; exit 1; fi
          "$python_bin" -c 'import sys; assert sys.version_info >= (3,10)'
          root="/opt/merlin"
          release="$root/releases/$REQUEST_ID"
          data="/var/lib/merlin/data"
          test ! -e "$release"
          sudo mkdir -p "$release" "$data" /var/lib/merlin/home /var/www/merlin-acme /etc/nginx/ssl/merlin
          sudo chown -R "$app_user:$app_group" "$root" /var/lib/merlin /var/www/merlin-acme
          tar -xzf bridge/merlin-source.tar.gz --no-same-owner -C "$release"
          test -f "$release/python/merlin/app.py"
          test -f "$release/ui/merlin-hud/index.html"
          test -f "$release/scripts/init_merlin_dashboard_stores.py"
          test -f "$release/scripts/import_merlin_engineering_evidence.py"
          PYTHONPATH="$release/python" "$python_bin" -m compileall -q "$release/python/merlin" "$release/scripts/init_merlin_dashboard_stores.py" "$release/scripts/import_merlin_engineering_evidence.py"
          PYTHONPATH="$release/python" "$python_bin" "$release/scripts/init_merlin_dashboard_stores.py" \
            --data-dir "$data" --project-id merlin-main --project-name "Merlin Research Workbench" \
            > "$RUNNER_TEMP/merlin-bootstrap.json"
          python3 -m json.tool "$RUNNER_TEMP/merlin-bootstrap.json" >/dev/null

          evidence_dir="$RUNNER_TEMP/merlin-evidence"
          mkdir -p "$evidence_dir"
          tar -xzf bridge/merlin-evidence.tar.gz --no-same-owner -C "$evidence_dir"
          PYTHONPATH="$release/python" "$python_bin" "$release/scripts/import_merlin_engineering_evidence.py" \
            --evidence-dir "$evidence_dir" --data-dir "$data" \
            --source-commit "$EVIDENCE_SOURCE_SHA" --run-id "$EVIDENCE_RUN_ID" \
            --artifact-id "$EVIDENCE_ARTIFACT_ID" --artifact-sha256 "$EVIDENCE_ARTIFACT_SHA" \
            > "$RUNNER_TEMP/merlin-evidence-import.json"
          python3 -m json.tool "$RUNNER_TEMP/merlin-evidence-import.json" >/dev/null
          sudo cp "$RUNNER_TEMP/merlin-evidence-import.json" "$data/merlin-evidence-import.json"
          sudo chown "$app_user:$app_group" "$data/merlin-evidence-import.json"

          test_port=18765
          test_home="$RUNNER_TEMP/merlin-smoke-home"
          mkdir -p "$test_home"
          (
            source "$data/merlin-hud.env"
            export PYTHONPATH="$release/python"
            export HOME="$test_home"
            "$python_bin" -m merlin.app --port "$test_port" --db "$RUNNER_TEMP/merlin-smoke-events.sqlite3"
          ) > "$RUNNER_TEMP/merlin-smoke-server.log" 2>&1 &
          smoke_pid=$!
          cleanup() { kill "$smoke_pid" 2>/dev/null || true; wait "$smoke_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$test_port/health" > "$RUNNER_TEMP/merlin-health.json"; then healthy=1; break; fi
            sleep 1
          done
          test "$healthy" = 1
          curl -fsS "http://127.0.0.1:$test_port/hud" | grep -q "MERLIN"
          curl -fsS "http://127.0.0.1:$test_port/api/hud/activity" | python3 -c 'import json,sys; assert json.load(sys.stdin)["schema"]=="merlin-hud-activity/1"'
          curl -fsS "http://127.0.0.1:$test_port/api/hud/graph" | python3 -c 'import json,sys; d=json.load(sys.stdin); types={n["node_type"] for n in d["nodes"]}; assert d["schema_version"]=="1.0"; assert {"freecad_assembly","electrical_net","simulation_result"} <= types; assert len(d["nodes"]) >= 8' # python3 -c 'import json,sys; assert json.load(sys.stdin)["schema_version"]=="1.0"'
          curl -fsS "http://127.0.0.1:$test_port/api/capabilities" | python3 -c 'import json,sys; assert json.load(sys.stdin)["schema"]=="merlin-capabilities/1"'
          echo "MERLIN_LOCAL_API_AND_HUD_PASS"
          cleanup
          trap - EXIT

          sudo ln -sfn "$release" "$root/current"
          sudo tee /etc/systemd/system/merlin-web.service >/dev/null <<EOF
          [Unit]
          Description=Merlin Research API and read-only HUD
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=$app_user
          Group=$app_group
          WorkingDirectory=$root/current
          Environment=HOME=/var/lib/merlin/home
          Environment=PYTHONPATH=$root/current/python
          Environment=MERLIN_REGISTRY_ROOT=$data/registry
          Environment=MERLIN_GRAPH_DB_PATH=$data/knowledge-graph.sqlite3
          Environment=MERLIN_OUTBOX_DB_PATH=$data/event-outbox.sqlite3
          Environment=MERLIN_HYPOTHESES_DB_PATH=$data/hypotheses.sqlite3
          Environment=MERLIN_DB_PATH=$data/events.sqlite3
          Environment=MERLIN_PROJECT_ID=merlin-engineering-smoke
          ExecStart=$python_bin -m merlin.app --port 8765 --db $data/events.sqlite3
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=full
          ProtectHome=true
          ReadWritePaths=/var/lib/merlin
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable merlin-web
          sudo systemctl restart merlin-web
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/health >/dev/null
          echo "MERLIN_SYSTEMD_SERVICE_ACTIVE"

      - name: Configure read-only Nginx host and attempt HTTPS
        id: web
        shell: bash
        env:
          PUBLIC_HOST: merlin.129.146.160.46.nip.io
        run: |
          set -euo pipefail
          sudo tee /etc/nginx/conf.d/merlin-web.conf >/dev/null <<EOF
          limit_req_zone \$binary_remote_addr zone=merlin_read:10m rate=10r/s;
          limit_req_zone \$binary_remote_addr zone=merlin_write:10m rate=1r/s;
          server {
              listen 80;
              server_name $PUBLIC_HOST;
              client_max_body_size 64k;
              location ^~ /.well-known/acme-challenge/ { root /var/www/merlin-acme; }
              location = /api/council/prepare {
                  limit_except POST { deny all; }
                  limit_req zone=merlin_write burst=5 nodelay;
                  proxy_pass http://127.0.0.1:8765;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
              location / {
                  limit_except GET HEAD { deny all; }
                  limit_req zone=merlin_read burst=30 nodelay;
                  proxy_pass http://127.0.0.1:8765;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          EOF
          sudo nginx -t
          sudo systemctl reload nginx
          if systemctl is-active --quiet firewalld; then
            sudo firewall-cmd --permanent --add-service=http
            sudo firewall-cmd --permanent --add-service=https
            sudo firewall-cmd --reload
          fi
          tls_ready=false
          if getent ahostsv4 "$PUBLIC_HOST" | grep -q "129.146.160.46"; then
            if [ ! -x /opt/merlin/acme/acme.sh ]; then
              if ! curl -fsSL https://get.acme.sh | sudo sh -s -- --home /opt/merlin/acme --config-home /var/lib/merlin/acme-config --cert-home /var/lib/merlin/acme-certs --no-cron; then
                echo "ACME client installation failed; retain read-only HTTP preview."
              fi
            fi
            if sudo /opt/merlin/acme/acme.sh --issue --server letsencrypt -d "$PUBLIC_HOST" -w /var/www/merlin-acme --keylength ec-256; then
              sudo /opt/merlin/acme/acme.sh --install-cert -d "$PUBLIC_HOST" --ecc \
                --key-file /etc/nginx/ssl/merlin/merlin.key \
                --fullchain-file /etc/nginx/ssl/merlin/fullchain.cer \
                --reloadcmd "systemctl reload nginx"
              tls_ready=true
            fi
          fi
          if [ "$tls_ready" = true ]; then
            sudo tee /etc/nginx/conf.d/merlin-web.conf >/dev/null <<EOF
          limit_req_zone \$binary_remote_addr zone=merlin_read:10m rate=10r/s;
          limit_req_zone \$binary_remote_addr zone=merlin_write:10m rate=1r/s;
          server {
              listen 80;
              server_name $PUBLIC_HOST;
              client_max_body_size 64k;
              location ^~ /.well-known/acme-challenge/ { root /var/www/merlin-acme; }
              location = /api/council/prepare {
                  limit_except POST { deny all; }
                  limit_req zone=merlin_write burst=5 nodelay;
                  proxy_pass http://127.0.0.1:8765;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
              location / { return 301 https://\$host\$request_uri; }
          }
          server {
              listen 443 ssl;
              server_name $PUBLIC_HOST;
              client_max_body_size 64k;
              ssl_certificate /etc/nginx/ssl/merlin/fullchain.cer;
              ssl_certificate_key /etc/nginx/ssl/merlin/merlin.key;
              ssl_protocols TLSv1.2 TLSv1.3;
              add_header X-Content-Type-Options nosniff always;
              add_header Referrer-Policy no-referrer always;
              add_header X-Frame-Options DENY always;
              location = /api/council/prepare {
                  limit_except POST { deny all; }
                  limit_req zone=merlin_write burst=5 nodelay;
                  proxy_pass http://127.0.0.1:8765;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
              location / {
                  limit_except GET HEAD { deny all; }
                  limit_req zone=merlin_read burst=30 nodelay;
                  proxy_pass http://127.0.0.1:8765;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
              }
          }
          EOF
            sudo nginx -t
            sudo systemctl reload nginx
          fi
          if [ "$tls_ready" = true ]; then
            echo "tls_ready=true" >> "$GITHUB_OUTPUT"
            echo "deployment_url=https://$PUBLIC_HOST/hud" >> "$GITHUB_OUTPUT"
          else
            echo "tls_ready=false" >> "$GITHUB_OUTPUT"
            echo "deployment_url=http://$PUBLIC_HOST/hud" >> "$GITHUB_OUTPUT"
            echo "::warning::TLS issuance failed; the public HUD is GET-only over HTTP. Do not submit secrets or private research."
          fi

      - name: Verify public routing and read-only policy
        id: public
        shell: bash
        env:
          PUBLIC_HOST: merlin.129.146.160.46.nip.io
          TLS_READY: ${{ steps.web.outputs.tls_ready }}
          DEPLOYMENT_URL: ${{ steps.web.outputs.deployment_url }}
        run: |
          set -euo pipefail
          if [ "$TLS_READY" = true ]; then base="https://$PUBLIC_HOST"; else base="http://$PUBLIC_HOST"; fi
          curl --fail --silent --show-error "$base/health" > "$RUNNER_TEMP/merlin-public-health.json"
          grep -q '"service":"merlin"' "$RUNNER_TEMP/merlin-public-health.json"
          curl --fail --silent --show-error "$base/hud" | grep -q "MERLIN"
          curl --fail --silent --show-error "$base/api/hud/activity" | python3 -c 'import json,sys; assert json.load(sys.stdin)["schema"]=="merlin-hud-activity/1"'
          curl --fail --silent --show-error "$base/api/hud/graph" | python3 -c 'import json,sys; assert json.load(sys.stdin)["schema_version"]=="1.0"'
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST "$base/api/hud/graph")"
          test "$code" = "403"
          echo "MERLIN_PUBLIC_HTTP_PASS url=$DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "tls_ready=$TLS_READY" >> "$GITHUB_OUTPUT"

      - name: Persist deployment receipt on isolated result branch
        if: always() && steps.validate.outputs.request_id != ''
        shell: bash
        env:
          REQUEST_ID: ${{ steps.validate.outputs.request_id }}
          SOURCE_SHA: ${{ steps.validate.outputs.expert_robot_commit }}
          DEPLOYMENT_URL: ${{ steps.public.outputs.deployment_url }}
          TLS_READY: ${{ steps.web.outputs.tls_ready }}
          PUBLIC_PASS: ${{ steps.public.outcome == 'success' }}
        run: |
          set -euo pipefail
          result_branch="merlin-deploy-result/$REQUEST_ID"
          result_file="$RUNNER_TEMP/merlin-deploy-result.json"
          python3 - "$result_file" "$REQUEST_ID" "$SOURCE_SHA" "$DEPLOYMENT_URL" "$TLS_READY" "$PUBLIC_PASS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          out, request_id, source_sha, url, tls, public_pass, run_id, attempt, cace_sha = sys.argv[1:]
          result = {
              "schema_version": 1,
              "request_id": request_id,
              "expert_robot_commit": source_sha,
              "status": "pass" if public_pass == "true" else "fail",
              "deployment_url": url or None,
              "tls_ready": tls == "true",
              "public_read_only": True,
              "cace_repository": "morganaspim/Cace-app",
              "cace_commit": cace_sha,
              "cace_workflow_run_id": int(run_id),
              "cace_run_attempt": int(attempt),
              "authority": "qualification-only",
              "promotion_authority": False,
          }
          pathlib.Path(out).write_text(json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "cace-merlin-deployer"
          git config user.email "noreply@github.com"
          git checkout --orphan "$result_branch"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p bridge
          cp "$result_file" bridge/deploy-result.json
          git add bridge/deploy-result.json
          git commit -m "Record Merlin OCI deployment result: $REQUEST_ID"
          git push origin "HEAD:refs/heads/$result_branch"
          echo "MERLIN_DEPLOY_RESULT_BRANCH=$result_branch"

      - name: Emit service diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          sudo systemctl status merlin-web --no-pager -l
          sudo journalctl -u merlin-web -n 100 --no-pager
          sudo systemctl status nginx --no-pager -l
          sudo tail -n 100 /var/log/nginx/merlin-error.log
          df -h /
