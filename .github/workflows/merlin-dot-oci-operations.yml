name: Merlin dot OCI operations
'on':
  push:
    branches:
    - merlin/dot-ops/**
    paths:
    - merlin/dot-requests/**
permissions:
  contents: read
  actions: read
concurrency:
  group: merlin-dot-oci-operations
  cancel-in-progress: false
jobs:
  fixed-operation:
    runs-on:
    - self-hosted
    - cace
    - oci
    - aarch64
    timeout-minutes: 10
    steps:
    - name: Validate pinned runtime and perform fixed operation
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,re,urllib.request\nfrom pathlib import Path\nrepo=os.environ['GITHUB_REPOSITORY']; commit=os.environ['GITHUB_SHA']\nif repo!='morganaspim/Cace-app' or not os.environ['GITHUB_REF'].startswith('refs/heads/merlin/dot-ops/') or os.environ.get('RUNNER_NAME')!='cace-oci-a1': raise RuntimeError('unexpected execution identity')\ndef api(path):\n req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})\n with urllib.request.urlopen(req,timeout=20) as r: raw=r.read(4*1024*1024+1)\n if len(raw)>4*1024*1024: raise RuntimeError('API response limit')\n return json.loads(raw)\ndef fetch(path):\n obj=api('contents/'+path+'?ref='+commit)\n return base64.b64decode(obj['content'],validate=False),obj['sha']\nfiles=api('commits/'+commit)['files']\nif len(files)!=1 or files[0]['status']!='added': raise RuntimeError('one\
        \ additive request file required')\np=files[0]['filename']\nif not re.fullmatch(r'merlin/dot-requests/[0-9a-f-]{36}\\.json',p): raise RuntimeError('invalid request path')\nqraw,_=fetch(p)\nif len(qraw)>16000: raise RuntimeError('request size limit')\nq=json.loads(qraw)\nbase={'schema','request_id','operation','created_at'}\nif not isinstance(q,dict) or q.get('schema')!='merlin-dot-ops-request-v1' or q.get('operation') not in {'validate','deploy','inspect','tool_call'} or p!='merlin/dot-requests/'+q.get('request_id','')+'.json': raise RuntimeError('invalid request')\nexpected=base if q['operation'] in {'validate','inspect'} else (base|{'tool','arguments'} if q['operation']=='tool_call' else base|{'validation_run_id','validation_commit'})\nif set(q)!=expected: raise RuntimeError('request fields rejected')\nif q['operation']=='tool_call' and (q['tool'] not in {'health','context_status','context_search','context_fetch','virtual_circuit_demo'} or not isinstance(q['arguments'],dict) or\
        \ len(json.dumps(q['arguments']))>8000): raise RuntimeError('only bounded read/simulation tools are enabled')\nif q['operation']=='deploy' and (type(q['validation_run_id']) is not int or q['validation_run_id']<=0 or not re.fullmatch('[0-9a-f]{40}',q['validation_commit'])): raise RuntimeError('invalid validation binding')\ninstaller_source,sha=fetch('ops/merlin_dot/install_private.py')\nif sha!='6a486e665f82c563d7746bcbac431ec63adedd0d': raise RuntimeError('installer pin mismatch')\ninstaller={};exec(compile(installer_source,'pinned-installer','exec'),installer)\noperation_source,sha=fetch('ops/merlin_dot/run_operation.py')\nif sha!='9d67e30d3979761caf6eace753fce5e1f3ea81c7': raise RuntimeError('operation pin mismatch')\noperation={};exec(compile(operation_source,'pinned-operations','exec'),operation)\nout=Path(os.environ['RUNNER_TEMP'])/('merlin-dot-operation-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']);out.mkdir(exist_ok=False)\nresult=operation['run_operation'](q,api,fetch,installer,'72e075db191da3173e9c9ef7e882a190cfc03161','95e4985f5cf4af7b31bbb183047f6e2e4c4488034ec2d880e54f260feedb0b10',out)\n\
        if result['status']!='succeeded': raise SystemExit('fixed operation failed; inspect retained receipt/log')\nPY\n"
    - name: Preserve operation receipt
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: merlin-dot-operation-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/merlin-dot-operation-${{ github.run_id }}-${{ github.run_attempt }}/*.json

          ${{ runner.temp }}/merlin-dot-operation-${{ github.run_id }}-${{ github.run_attempt }}/*.txt'
        if-no-files-found: warn
        retention-days: 30
