name: Merlin fixed local model bootstrap

on:
  push:
    branches: ["merlin/dot-ops/model-bootstrap-20261121"]
    paths: ["merlin/model-requests/**"]

permissions:
  contents: read
  actions: read

concurrency:
  group: merlin-dot-oci-operations
  cancel-in-progress: false

jobs:
  fixed-model-operation:
    runs-on: [self-hosted, cace, oci, aarch64]
    timeout-minutes: 65
    steps:
      - name: Authenticate fixed request, test exact controller, and bootstrap pinned provider
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']; commit = os.environ['GITHUB_SHA']
          if repo != 'morganaspim/Cace-app' or os.environ['GITHUB_REF'] != 'refs/heads/merlin/dot-ops/model-bootstrap-20261121' or os.environ.get('RUNNER_NAME') != 'cace-oci-a1':
              raise RuntimeError('unexpected fixed execution identity')
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1': raise RuntimeError('automatic retry is not authorized')
          out = Path(os.environ['RUNNER_TEMP']) / ('merlin-model-bootstrap-' + os.environ['GITHUB_RUN_ID'] + '-1')
          out.mkdir(exist_ok=False)
          def unique(items):
              result = {}
              for key, value in items:
                  if key in result: raise ValueError('duplicate JSON field')
                  result[key] = value
              return result
          def api(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path, headers={'Authorization':'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=20) as response: raw = response.read(4 * 1024 * 1024 + 1)
              if len(raw) > 4 * 1024 * 1024: raise RuntimeError('API response limit')
              return json.loads(raw, object_pairs_hook=unique)
          def fetch(path):
              value = api('contents/' + path + '?ref=' + commit)
              raw = base64.b64decode(''.join(value['content'].split()), validate=True)
              blob = hashlib.sha1(('blob %d\0' % len(raw)).encode() + raw).hexdigest()
              if value.get('sha') != blob: raise RuntimeError('repository byte identity mismatch')
              return raw, blob
          root_output = Path('/var/lib/merlin-model-bootstrap/runs') / (os.environ['GITHUB_RUN_ID'] + '-1')
          try:
              files = api('commits/' + commit)['files']
              if len(files) != 1 or files[0]['status'] != 'added': raise RuntimeError('one additive fixed request required')
              path = files[0]['filename']
              if not re.fullmatch(r'merlin/model-requests/[0-9a-f-]{36}\.json', path): raise RuntimeError('request path')
              raw, request_blob = fetch(path)
              if len(raw) > 16000: raise RuntimeError('request size limit')
              request = json.loads(raw, object_pairs_hook=unique)
              if path != 'merlin/model-requests/' + request.get('request_id', '') + '.json': raise RuntimeError('request filename binding')
              pins = {
                  'controller': ('ops/merlin_dot/bootstrap_local_model.py', '18553adba51fbd7722b9277f8349cbd253cb228c', '7c7c4dcd342b57890853474dc68cba62ba5600d03f10d80b5967df93d82a6b4f'),
                  'tests': ('tests/test_bootstrap_local_model.py', '17f201560335059c01539e7832ea9914c0ad1a49', 'c1425d7241a8c9b5a4dfd5de8786dd2524bb849080f29043c22d90619f410fb0'),
              }
              sources = {}
              for label, (source_path, expected_blob, expected_sha) in pins.items():
                  body, actual_blob = fetch(source_path)
                  if actual_blob != expected_blob or hashlib.sha256(body).hexdigest() != expected_sha: raise RuntimeError('fixed source pin mismatch: ' + label)
                  sources[label] = body
              identity = {'run_id':int(os.environ['GITHUB_RUN_ID']), 'run_attempt':1, 'workflow_commit':commit,
                          'controller_sha256':pins['controller'][2], 'runner':'cace-oci-a1'}
              namespace = {'__name__':'pinned_model_bootstrap'}
              exec(compile(sources['controller'], 'pinned-model-controller', 'exec'), namespace)
              namespace['validate_request'](request, identity)
              controls = out / 'controller-tests'; controls.mkdir()
              (controls / 'bootstrap_local_model.py').write_bytes(sources['controller'])
              (controls / 'test_bootstrap_local_model.py').write_bytes(sources['tests'])
              test_code = "import sys,unittest,json;sys.path.insert(0,sys.argv[1]);s=unittest.defaultTestLoader.discover(sys.argv[1],pattern='test_bootstrap_local_model.py');r=unittest.TextTestRunner(verbosity=2).run(s);v={'tests':r.testsRun,'errors':len(r.errors),'failures':len(r.failures),'skipped':len(r.skipped)};print(json.dumps(v));sys.exit(0 if r.wasSuccessful() and not r.skipped and r.testsRun==32 else 1)"
              test = subprocess.run(['/usr/bin/python3','-I','-B','-c',test_code,str(controls)], cwd='/', env={'PATH':'/usr/sbin:/usr/bin:/sbin:/bin','LANG':'C.UTF-8'}, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=60)
              if len(test.stdout) > 256 * 1024: raise RuntimeError('controller test log limit')
              (out / 'controller-tests.log').write_bytes(test.stdout)
              if test.returncode: raise RuntimeError('fixed controller controls failed')
              loader = "import base64,hashlib,json,sys;raw=open(sys.argv[1],'rb').read(131073);assert len(raw)<=131072 and hashlib.sha256(raw).hexdigest()==sys.argv[2];ns={'__name__':'pinned_model_bootstrap'};exec(compile(raw,'authenticated-fixed-model-controller','exec'),ns);request=json.loads(base64.b64decode(sys.argv[3],validate=True),object_pairs_hook=ns['unique']);identity=json.loads(base64.b64decode(sys.argv[4],validate=True),object_pairs_hook=ns['unique']);print(json.dumps(ns['run'](request,identity),sort_keys=True))"
              args = ['/usr/bin/sudo','-n','/usr/bin/env','-i','PATH=/usr/sbin:/usr/bin:/sbin:/bin','LANG=C.UTF-8','/usr/bin/python3','-I','-B','-c',loader,str(controls / 'bootstrap_local_model.py'),pins['controller'][2],base64.b64encode(namespace['canonical'](request)).decode(),base64.b64encode(namespace['canonical'](identity)).decode()]
              result = subprocess.run(args, cwd='/', env={'PATH':'/usr/sbin:/usr/bin:/sbin:/bin','LANG':'C.UTF-8'}, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=3800)
              if len(result.stdout) > 65536: raise RuntimeError('bootstrap supervisor output limit')
              (out / 'supervisor.log').write_bytes(result.stdout)
              if result.returncode: raise RuntimeError('bootstrap rejected or failed; retained evidence records the phase')
          except Exception as error:
              (out / 'workflow-error.json').write_text(json.dumps({'status':'failed','type':type(error).__name__,'message':str(error)[:800],'workflow_commit':commit,'run_id':os.environ['GITHUB_RUN_ID']},indent=2))
              raise
          finally:
              names = ['bootstrap-receipt.json','manifest.json','failed-receipt.json','inspection.json','smoke-request.json','smoke-token-count.json','smoke-inference-intent.json','smoke-response.json','build.log','build-manager.log']
              for name in names:
                  source = root_output / name
                  if source.is_file():
                      with source.open('rb') as stream: data = stream.read(3 * 1024 * 1024 + 1)
                      if len(data) > 3 * 1024 * 1024: raise RuntimeError('retained artifact file limit')
                      (out / name).write_bytes(data)
          PY
      - name: Preserve bounded bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merlin-model-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/merlin-model-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/merlin-model-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/*.log
          retention-days: 30
          if-no-files-found: error
