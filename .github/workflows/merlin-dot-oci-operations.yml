name: Merlin dot OCI operations
'on':
  push:
    branches:
    - merlin/dot-ops/**
    paths:
    - merlin/dot-requests/**
permissions:
  contents: read
  actions: read
concurrency:
  group: merlin-dot-oci-operations
  cancel-in-progress: false
jobs:
  fixed-operation:
    runs-on:
    - self-hosted
    - cace
    - oci
    - aarch64
    timeout-minutes: 10
    steps:
    - name: Validate pinned runtime and perform fixed operation
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64,hashlib,json,os,re,urllib.request\n\
        from pathlib import Path\nrepo=os.environ['GITHUB_REPOSITORY']; commit=os.environ['GITHUB_SHA']\n\
        if repo!='morganaspim/Cace-app' or not os.environ['GITHUB_REF'].startswith('refs/heads/merlin/dot-ops/')\
        \ or os.environ.get('RUNNER_NAME')!='cace-oci-a1': raise RuntimeError('unexpected\
        \ execution identity')\ndef api(path):\n req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer\
        \ '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})\n\
        \ with urllib.request.urlopen(req,timeout=20) as r: raw=r.read(4*1024*1024+1)\n\
        \ if len(raw)>4*1024*1024: raise RuntimeError('API response limit')\n return\
        \ json.loads(raw)\ndef fetch(path):\n obj=api('contents/'+path+'?ref='+commit)\n\
        \ return base64.b64decode(obj['content'],validate=False),obj['sha']\nfiles=api('commits/'+commit)['files']\n\
        if len(files)!=1 or files[0]['status']!='added': raise RuntimeError('one additive\
        \ request file required')\np=files[0]['filename']\nif not re.fullmatch(r'merlin/dot-requests/[0-9a-f-]{36}\\\
        .json',p): raise RuntimeError('invalid request path')\nqraw,_=fetch(p)\nif\
        \ len(qraw)>16000: raise RuntimeError('request size limit')\nq=json.loads(qraw)\n\
        base={'schema','request_id','operation','created_at'}\nif not isinstance(q,dict)\
        \ or q.get('schema')!='merlin-dot-ops-request-v1' or q.get('operation') not\
        \ in {'validate','deploy','upgrade_research','resume_research','diagnose_research','probe_research','recovery_drill','inspect','tool_call'}\
        \ or p!='merlin/dot-requests/'+q.get('request_id','')+'.json': raise RuntimeError('invalid\
        \ request')\nexpected=base if q['operation'] in {'validate','inspect','diagnose_research','probe_research','recovery_drill'}\
        \ else (base|{'tool','arguments'} if q['operation']=='tool_call' else base|{'validation_run_id','validation_commit'})\n\
        if set(q)!=expected: raise RuntimeError('request fields rejected')\nif q['operation']=='tool_call'\
        \ and (q['tool'] not in {'health','context_status','context_search','context_fetch','virtual_circuit_demo','research_contract','research_episode_demo','mathematical_lenses_demo'}\
        \ or not isinstance(q['arguments'],dict) or len(json.dumps(q['arguments']))>8000):\
        \ raise RuntimeError('only bounded read/simulation tools are enabled')\nif\
        \ q['operation'] in {'deploy','upgrade_research','resume_research'} and (type(q['validation_run_id'])\
        \ is not int or q['validation_run_id']<=0 or not re.fullmatch('[0-9a-f]{40}',q['validation_commit'])):\
        \ raise RuntimeError('invalid validation binding')\ninstaller_source,sha=fetch('ops/merlin_dot/install_private.py')\n\
        if sha!='6a486e665f82c563d7746bcbac431ec63adedd0d': raise RuntimeError('installer\
        \ pin mismatch')\ninstaller={};exec(compile(installer_source,'pinned-installer','exec'),installer)\n\
        operation_source,sha=fetch('ops/merlin_dot/run_operation.py')\nif sha!='2e062d235f92e1260d051e5392991e7e3fd1eff9':\
        \ raise RuntimeError('operation pin mismatch')\noperation={};exec(compile(operation_source,'pinned-operations','exec'),operation)\n\
        if q['operation'] in {'upgrade_research','resume_research'}:\n upgrade_source,upgrade_sha=fetch('ops/merlin_dot/upgrade_research.py')\n\
        \ if upgrade_sha!='a68671122ce8e833ac340efa7cbb3a761562ab11': raise RuntimeError('upgrader\
        \ pin mismatch')\nif q['operation']=='resume_research':\n resume_source,resume_sha=fetch('ops/merlin_dot/resume_research.py')\n\
        \ if resume_sha!='f9392dfab442230d00500fdb8dd59ada3a7edd89': raise RuntimeError('resumer\
        \ pin mismatch')\nout=Path(os.environ['RUNNER_TEMP'])/('merlin-dot-operation-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']);out.mkdir(exist_ok=False)\n\
        result=operation['run_operation'](q,api,fetch,installer,'1d55b9a94ff843d847b0be9322f22257a21a2dbf','efe57bada5cd86f45118cac0036faf497f9aa60972508e036aed09f7b8cf04db',out)\n\
        if result['status']!='succeeded': raise SystemExit('fixed operation failed;\
        \ inspect retained receipt/log')\nPY\n"
    - name: Preserve operation receipt
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: merlin-dot-operation-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ runner.temp }}/merlin-dot-operation-${{ github.run_id }}-${{ github.run_attempt
          }}/*.json

          ${{ runner.temp }}/merlin-dot-operation-${{ github.run_id }}-${{ github.run_attempt
          }}/*.txt'
        if-no-files-found: warn
        retention-days: 30
