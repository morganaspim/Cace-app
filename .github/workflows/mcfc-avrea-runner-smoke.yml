name: MCFC Avrea runner smoke test
on:
  push:
    branches:
      - research/iteration38-lean-check-20261029
    paths:
      - '.github/workflows/mcfc-avrea-runner-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  avrea-smoke:
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 5
    steps:
      - name: Verify Avrea runner access
        shell: bash
        run: |
          set -euo pipefail
          echo "MCFC Avrea smoke run"
          echo "Runner name: ${RUNNER_NAME}"
          echo "Runner OS: ${RUNNER_OS}"
          echo "Runner architecture: ${RUNNER_ARCH}"
          uname -srm
          nproc
          free -h
          echo "AVREA_RUNNER_SMOKE_PASS"
