name: CACE Formal
on: [push, pull_request]
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/cace_formal
      - name: Exact Prager-Synge kernel
        run: python -m pytest -q tests/test_formal_v310.py tests/test_formal_v319.py
