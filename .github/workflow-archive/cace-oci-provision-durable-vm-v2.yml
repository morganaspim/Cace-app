name: CACE OCI durable VM provision v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cace-oci-provision-durable-vm-v2.yml'

permissions:
  contents: read

jobs:
  provision:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Provision or resume persistent A1 runner host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oci-durable-vm-v2
          exec > >(tee oci-durable-vm-v2/provision.txt) 2>&1

          CONFIG_FILE="${OCI_CLI_CONFIG_FILE:-$HOME/.oci/config}"
          PROFILE="${OCI_CLI_PROFILE:-DEFAULT}"
          read -r TENANCY_OCID REGION <<EOF
          $(python3 - "$CONFIG_FILE" "$PROFILE" <<'PY'
          import configparser, sys
          cfg=configparser.ConfigParser(); cfg.read(sys.argv[1]); p=cfg[sys.argv[2]]
          print(p['tenancy'].strip(), p.get('region', sys.argv[2]).strip())
          PY
          )
          EOF

          SUBNET_ID="$(oci network subnet list --compartment-id "$TENANCY_OCID" --all --query 'data[?"lifecycle-state"==`AVAILABLE`].id | [0]' --raw-output)"
          AD="$(oci iam availability-domain list --compartment-id "$TENANCY_OCID" --all --query 'data[-1].name' --raw-output)"
          IMAGE_ID="$(oci compute image list --compartment-id "$TENANCY_OCID" --all --operating-system 'Oracle Linux' --operating-system-version '8' --shape 'VM.Standard.A1.Flex' --sort-by TIMECREATED --sort-order DESC --query 'data[0].id' --raw-output)"
          test -n "$SUBNET_ID"; test "$SUBNET_ID" != null
          test -n "$AD"; test "$AD" != null
          test -n "$IMAGE_ID"; test "$IMAGE_ID" != null

          wait_terminated() {
            local iid="$1"
            for _ in $(seq 1 180); do
              state="$(oci compute instance get --instance-id "$iid" --query 'data."lifecycle-state"' --raw-output 2>/dev/null || echo TERMINATED)"
              echo "termination-state=$state"
              [[ "$state" == TERMINATED ]] && return 0
              sleep 5
            done
            echo "Instance did not terminate within 15 minutes: ${iid:0:36}..." >&2
            return 1
          }

          echo '=== discovering existing durable VM ==='
          DURABLE_JSON="$(oci compute instance list --compartment-id "$TENANCY_OCID" --all --output json)"
          DURABLE_ID="$(python3 - <<'PY' "$DURABLE_JSON"
          import json,sys
          for x in json.loads(sys.argv[1])['data']:
              if x.get('display-name') != 'cace-runner-a1' or x.get('lifecycle-state') == 'TERMINATED':
                  continue
              c=x.get('shape-config') or {}
              if x.get('shape')=='VM.Standard.A1.Flex' and float(c.get('ocpus') or 0)==2 and float(c.get('memory-in-gbs') or 0)==12:
                  print(x['id']); break
          PY
          )"

          if [[ -z "$DURABLE_ID" ]]; then
            echo '=== retiring only undersized/disposable A1 VMs ==='
            python3 - <<'PY' "$DURABLE_JSON" > /tmp/cace-retire-ids
          import json,sys
          for x in json.loads(sys.argv[1])['data']:
              if x.get('lifecycle-state') == 'TERMINATED':
                  continue
              if x.get('display-name') not in {'instance-20260914-1035','cace-runner-a1'}:
                  continue
              c=x.get('shape-config') or {}
              if x.get('display-name')=='cace-runner-a1' and float(c.get('ocpus') or 0)==2 and float(c.get('memory-in-gbs') or 0)==12:
                  continue
              print(x['id'])
          PY
            while read -r iid; do
              [[ -n "$iid" ]] || continue
              echo "Requesting termination of ${iid:0:36}..."
              oci compute instance terminate --instance-id "$iid" --force >/dev/null
              wait_terminated "$iid"
            done < /tmp/cace-retire-ids

            cat > /tmp/cace-userdata.sh <<'USERDATA'
          #!/bin/bash
          set -euxo pipefail
          hostnamectl set-hostname cace-oci-a1 || true
          id github-runner >/dev/null 2>&1 || useradd --create-home --shell /bin/bash github-runner
          dnf -y install curl git tar gzip unzip jq openssl rsync util-linux findutils procps-ng python3 sudo || true

          install -d -m 0755 /opt/actions-runner
          install -d -o github-runner -g github-runner -m 0755 \
            /var/lib/cace-cache/elan /var/lib/cace-cache/xdg /var/lib/cace-cache/uv \
            /var/lib/cace-cache/pip /var/lib/cace-cache/mathlib /var/lib/cace-cache/telemetry

          cd /opt/actions-runner
          curl -fL --retry 5 --retry-delay 3 https://github.com/actions/runner/releases/download/v2.337.0/actions-runner-linux-arm64-2.337.0.tar.gz -o /tmp/actions-runner.tgz
          tar xzf /tmp/actions-runner.tgz
          ./bin/installdependencies.sh || true
          chown -R github-runner:github-runner /opt/actions-runner

          cat > /etc/sudoers.d/101-oracle-cloud-agent-run-command <<'EOF'
          ocarun ALL=(ALL) NOPASSWD:ALL
          EOF
          chmod 0440 /etc/sudoers.d/101-oracle-cloud-agent-run-command
          visudo -cf /etc/sudoers.d/101-oracle-cloud-agent-run-command

          cat > /usr/local/sbin/cace-runner-watchdog <<'EOF'
          #!/bin/bash
          set -u
          T=/var/lib/cace-cache/telemetry
          mkdir -p "$T"
          while true; do
            ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "$ts" > "$T/heartbeat.tmp" && mv "$T/heartbeat.tmp" "$T/heartbeat"
            service="$(cat /opt/actions-runner/.service 2>/dev/null || true)"
            if [[ -n "$service" ]] && systemctl list-unit-files "$service" --no-legend 2>/dev/null | grep -q "$service"; then
              if ! systemctl is-active --quiet "$service"; then
                echo "$ts runner-inactive restart-requested service=$service" >> "$T/watchdog.log"
                systemctl restart "$service" || true
              fi
            fi
            {
              echo "timestamp=$ts"; echo "hostname=$(hostname)"; echo "runner_service=$service"
              [[ -n "$service" ]] && systemctl status "$service" --no-pager 2>&1 || true
              free -h || true; df -h / /var/lib/cace-cache || true
              ps -eo pid,ppid,pcpu,pmem,rss,vsz,etime,stat,cmd | grep -E 'Runner\.(Listener|Worker)|lake (build|env)|/lean( |$)|/lean-' | grep -v grep || true
              cat /sys/fs/cgroup/memory.events 2>/dev/null || true
              [[ -n "$service" ]] && journalctl -u "$service" -n 50 --no-pager 2>&1 || true
            } > "$T/latest.tmp"
            mv "$T/latest.tmp" "$T/latest.txt"
            sleep 30
          done
          EOF
          chmod 0755 /usr/local/sbin/cace-runner-watchdog

          cat > /etc/systemd/system/cace-runner-watchdog.service <<'EOF'
          [Unit]
          Description=CACE runner watchdog and telemetry
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/cace-runner-watchdog
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF

          cat > /usr/local/sbin/cace-register-runner <<'EOF'
          #!/bin/bash
          set -euo pipefail
          TOKEN="${1:-}"
          [[ -n "$TOKEN" ]] || { echo 'usage: sudo cace-register-runner <one-hour GitHub registration token>' >&2; exit 2; }
          cd /opt/actions-runner
          [[ ! -f .runner ]] || { echo 'Runner is already configured.' >&2; exit 3; }
          sudo -u github-runner ./config.sh --unattended \
            --url https://github.com/morganaspim/Cace-app --token "$TOKEN" \
            --name cace-oci-a1 --labels cace,oci,aarch64 --work _work
          ./svc.sh install github-runner
          SERVICE="$(cat .service)"
          mkdir -p "/etc/systemd/system/${SERVICE}.d"
          cat > "/etc/systemd/system/${SERVICE}.d/10-cace.conf" <<'UNIT'
          [Service]
          Restart=always
          RestartSec=5
          Environment=ELAN_HOME=/var/lib/cace-cache/elan
          Environment=XDG_CACHE_HOME=/var/lib/cace-cache/xdg
          Environment=UV_CACHE_DIR=/var/lib/cace-cache/uv
          Environment=PIP_CACHE_DIR=/var/lib/cace-cache/pip
          UNIT
          chown -R github-runner:github-runner /var/lib/cace-cache /opt/actions-runner
          systemctl daemon-reload
          systemctl enable --now "$SERVICE"
          systemctl restart cace-runner-watchdog.service
          systemctl status "$SERVICE" --no-pager
          EOF
          chmod 0755 /usr/local/sbin/cace-register-runner

          systemctl daemon-reload
          systemctl enable --now cace-runner-watchdog.service
          touch /var/lib/cace-bootstrap-ready
          USERDATA

            USERDATA_B64="$(base64 -w0 /tmp/cace-userdata.sh)"
            python3 - "$USERDATA_B64" <<'PY'
          import json,pathlib,sys
          pathlib.Path('/tmp/cace-metadata.json').write_text(json.dumps({'user_data':sys.argv[1]}))
          pathlib.Path('/tmp/cace-agent.json').write_text(json.dumps({
            'areAllPluginsDisabled':False,
            'isManagementDisabled':False,
            'isMonitoringDisabled':False,
            'pluginsConfig':[
              {'name':'Compute Instance Run Command','desiredState':'ENABLED'},
              {'name':'Compute Instance Monitoring','desiredState':'ENABLED'}
            ]
          }))
          PY

            echo '=== launching durable 2 OCPU / 12 GB / 140 GB A1 VM ==='
            DURABLE_ID="$(oci compute instance launch --compartment-id "$TENANCY_OCID" --availability-domain "$AD" \
              --display-name cace-runner-a1 --shape VM.Standard.A1.Flex --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --subnet-id "$SUBNET_ID" --image-id "$IMAGE_ID" --assign-public-ip false --boot-volume-size-in-gbs 140 \
              --metadata file:///tmp/cace-metadata.json --agent-config file:///tmp/cace-agent.json \
              --wait-for-state RUNNING --max-wait-seconds 900 --query 'data.id' --raw-output)"
          else
            echo 'Suitable cace-runner-a1 already exists; resuming instead of replacing it.'
            state="$(oci compute instance get --instance-id "$DURABLE_ID" --query 'data."lifecycle-state"' --raw-output)"
            if [[ "$state" == STOPPED ]]; then
              oci compute instance action --instance-id "$DURABLE_ID" --action START --wait-for-state RUNNING --max-wait-seconds 600 >/dev/null
            fi
          fi

          test -n "$DURABLE_ID"
          echo "instance_prefix=${DURABLE_ID:0:36}..."
          oci compute instance get --instance-id "$DURABLE_ID" --query 'data.{name:"display-name",state:"lifecycle-state",shape:shape,shapeConfig:"shape-config",ad:"availability-domain",agentConfig:"agent-config"}' --output json

          echo '=== waiting for Compute Instance Run Command plugin ==='
          plugin_status=''
          for _ in $(seq 1 90); do
            plugins="$(oci instance-agent plugin list --compartment-id "$TENANCY_OCID" --instanceagent-id "$DURABLE_ID" --all --output json 2>/dev/null || true)"
            if [[ -n "$plugins" ]]; then
              plugin_status="$(python3 - <<'PY' "$plugins"
          import json,sys
          for x in json.loads(sys.argv[1]).get('data',[]):
              if (x.get('name') or x.get('plugin-name')) == 'Compute Instance Run Command':
                  print(x.get('status','')); break
          PY
              )"
              echo "run-command-plugin=$plugin_status"
              [[ "$plugin_status" == RUNNING ]] && break
            fi
            sleep 10
          done

          printf 'durable_instance_prefix=%s\nrun_command_plugin=%s\n' "${DURABLE_ID:0:36}" "$plugin_status" > oci-durable-vm-v2/result.txt
          [[ "$plugin_status" == RUNNING ]]
          echo 'DURABLE_VM_READY_FOR_REGISTRATION'

      - name: Upload provisioning diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-oci-durable-vm-v2
          path: oci-durable-vm-v2/
