name: CACE runner watchdog install

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cace-runner-watchdog.yml'

permissions:
  contents: read

jobs:
  install-watchdog:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Install detached runner watchdog
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_ROOT="/home/morganaspi/actions-runner"
          STATE_DIR="$RUNNER_ROOT/.cace-watchdog"
          WATCHDOG="$STATE_DIR/watchdog.sh"
          mkdir -p "$STATE_DIR"
          chmod 700 "$STATE_DIR"

          cat > "$WATCHDOG" <<'EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          RUNNER_ROOT="/home/morganaspi/actions-runner"
          STATE_DIR="$RUNNER_ROOT/.cace-watchdog"
          LOG="$STATE_DIR/watchdog.log"
          HEARTBEAT="$STATE_DIR/heartbeat"
          PIDFILE="$STATE_DIR/watchdog.pid"
          LOCKFILE="$STATE_DIR/watchdog.lock"
          FORMAL_LOG="$STATE_DIR/formal-progress.log"
          FORMAL_SNAPSHOT="$STATE_DIR/formal-latest.txt"
          mkdir -p "$STATE_DIR"

          exec 9>"$LOCKFILE"
          if ! flock -w 20 9; then
            printf '%s failed-to-acquire-watchdog-lock\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$LOG"
            exit 1
          fi
          echo $$ > "$PIDFILE"
          trap 'rm -f "$PIDFILE"' EXIT

          log() {
            printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*" >> "$LOG"
          }

          formal_snapshot() {
            local build_root olean_count newest mem_avail_kb disk_avail_kb lake_pids lean_pids
            build_root="$(find /var/tmp -maxdepth 1 -type d -name 'cace-formal.*' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2- || true)"
            if [[ -z "$build_root" || ! -d "$build_root" ]]; then
              return 0
            fi

            olean_count="$(find "$build_root" -type f -name '*.olean' 2>/dev/null | wc -l | tr -d ' ')"
            newest="$(find "$build_root" -type f -name '*.olean' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2- || true)"
            mem_avail_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null || true)"
            disk_avail_kb="$(df -Pk "$build_root" 2>/dev/null | awk 'NR==2 {print $4}' || true)"
            lake_pids="$(pgrep -d, -f 'lake (build|env)' 2>/dev/null || true)"
            lean_pids="$(pgrep -d, -f '/lean( |$)|/lean-[^ ]*' 2>/dev/null || true)"

            printf '%s build_root=%q olean_count=%s newest=%q mem_available_kb=%s disk_available_kb=%s lake_pids=%q lean_pids=%q\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$build_root" "$olean_count" "$newest" \
              "$mem_avail_kb" "$disk_avail_kb" "$lake_pids" "$lean_pids" >> "$FORMAL_LOG"

            {
              echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "build_root=$build_root"
              echo "olean_count=$olean_count"
              echo "newest_olean=$newest"
              echo "mem_available_kb=$mem_avail_kb"
              echo "disk_available_kb=$disk_avail_kb"
              echo "lake_pids=$lake_pids"
              echo "lean_pids=$lean_pids"
              echo
              echo '=== formal processes ==='
              ps -eo pid,ppid,pcpu,pmem,rss,vsz,etime,stat,cmd | grep -E 'lake (build|env)|/lean( |$)|/lean-[^ ]*' | grep -v grep || true
              echo
              echo '=== memory ==='
              free -h || true
              echo
              echo '=== disk ==='
              df -h "$build_root" || true
              echo
              echo '=== cgroup memory events ==='
              cat /sys/fs/cgroup/memory.events 2>/dev/null || true
              echo
              echo '=== newest oleans ==='
              find "$build_root" -type f -name '*.olean' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 30 || true
              echo
              echo '=== newest files ==='
              find "$build_root" -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 30 || true
            } > "$FORMAL_SNAPSHOT.tmp"
            mv "$FORMAL_SNAPSHOT.tmp" "$FORMAL_SNAPSHOT"
          }

          log "watchdog-start pid=$$"
          tick=0
          while true; do
            date -u +%Y-%m-%dT%H:%M:%SZ > "$HEARTBEAT.tmp"
            mv "$HEARTBEAT.tmp" "$HEARTBEAT"

            listener_pid="$(pgrep -f '^/home/morganaspi/actions-runner/(bin|bin\.[^/]+)/Runner\.Listener run$' | head -n 1 || true)"
            runsh_pid="$(pgrep -f '^/bin/bash ./run\.sh$' | head -n 1 || true)"

            if [[ -n "$listener_pid" ]]; then
              printf '%s\n' "$listener_pid" > "$STATE_DIR/listener.pid"
            else
              rm -f "$STATE_DIR/listener.pid"
              if [[ -z "$runsh_pid" ]]; then
                log "listener-missing; restarting runner"
                (
                  cd "$RUNNER_ROOT"
                  exec env -u RUNNER_TRACKING_ID -u GITHUB_ACTION -u GITHUB_ACTIONS \
                    ./run.sh >> "$STATE_DIR/runner-restarts.log" 2>&1
                ) &
                child=$!
                printf '%s\n' "$child" > "$STATE_DIR/restart-child.pid"
                log "restart-launched child=$child"
                sleep 15
              else
                log "listener-missing but run.sh pid=$runsh_pid is present; waiting"
              fi
            fi

            tick=$((tick + 1))
            if (( tick % 3 == 0 )); then
              formal_snapshot || true
            fi
            sleep 10
          done
          EOF
          chmod 700 "$WATCHDOG"

          # Replace an older watchdog if one is present. It runs in its own session,
          # so terminate the whole process group to release any lock inherited by sleep.
          if [[ -f "$STATE_DIR/watchdog.pid" ]]; then
            old_pid="$(cat "$STATE_DIR/watchdog.pid" 2>/dev/null || true)"
            if [[ "$old_pid" =~ ^[0-9]+$ ]] && kill -0 "$old_pid" 2>/dev/null; then
              kill -TERM -- "-$old_pid" 2>/dev/null || kill "$old_pid" 2>/dev/null || true
              for _ in $(seq 1 40); do
                kill -0 "$old_pid" 2>/dev/null || break
                sleep 0.25
              done
            fi
          fi

          rm -f "$STATE_DIR/heartbeat"

          # GitHub Runner.Worker normally kills descendants at job cleanup using
          # RUNNER_TRACKING_ID. Remove that marker and create a new session so this
          # watchdog survives the job that installs it.
          env -u RUNNER_TRACKING_ID -u GITHUB_ACTION -u GITHUB_ACTIONS \
            setsid nohup "$WATCHDOG" </dev/null >> "$STATE_DIR/watchdog-launch.log" 2>&1 &
          watchdog_pid=$!

          # Require a heartbeat produced by this new process, not a stale prior file.
          for _ in $(seq 1 60); do
            if ! kill -0 "$watchdog_pid" 2>/dev/null; then
              echo "New watchdog process exited before producing a heartbeat." >&2
              tail -n 50 "$STATE_DIR/watchdog-launch.log" 2>/dev/null || true
              tail -n 50 "$STATE_DIR/watchdog.log" 2>/dev/null || true
              exit 1
            fi
            [[ -s "$STATE_DIR/heartbeat" ]] && break
            sleep 0.5
          done

          kill -0 "$watchdog_pid"
          test -s "$STATE_DIR/heartbeat"
          echo "watchdog_pid=$watchdog_pid"
          echo "heartbeat=$(cat "$STATE_DIR/heartbeat")"
          ps -p "$watchdog_pid" -o pid,ppid,sid,user,etime,cmd
          tail -n 20 "$STATE_DIR/watchdog.log" || true

      - name: Capture watchdog install state
        if: always()
        shell: bash
        run: |
          set -u
          RUNNER_ROOT="/home/morganaspi/actions-runner"
          STATE_DIR="$RUNNER_ROOT/.cace-watchdog"
          mkdir -p cace-watchdog-diagnostics
          {
            date -u
            echo '=== processes ==='
            ps -eo pid,ppid,sid,user,etime,cmd | grep -E 'cace-watchdog|Runner\.(Listener|Worker)|/bin/bash ./run\.sh' | grep -v grep || true
            echo '=== state dir ==='
            ls -la "$STATE_DIR" 2>/dev/null || true
            echo '=== heartbeat ==='
            cat "$STATE_DIR/heartbeat" 2>/dev/null || true
            echo '=== watchdog log ==='
            tail -n 100 "$STATE_DIR/watchdog.log" 2>/dev/null || true
            echo '=== restart log ==='
            tail -n 100 "$STATE_DIR/runner-restarts.log" 2>/dev/null || true
            echo '=== formal snapshot ==='
            cat "$STATE_DIR/formal-latest.txt" 2>/dev/null || true
          } > cace-watchdog-diagnostics/install.txt 2>&1

      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cace-runner-watchdog-install
          path: cace-watchdog-diagnostics/

  verify-watchdog:
    needs: install-watchdog
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Verify watchdog survived prior job cleanup
        shell: bash
        run: |
          set -euo pipefail
          STATE_DIR="/home/morganaspi/actions-runner/.cace-watchdog"
          test -s "$STATE_DIR/watchdog.pid"
          pid="$(cat "$STATE_DIR/watchdog.pid")"
          kill -0 "$pid"
          sleep 12
          kill -0 "$pid"
          test -s "$STATE_DIR/heartbeat"
          now="$(date +%s)"
          heartbeat_epoch="$(date -d "$(cat "$STATE_DIR/heartbeat")" +%s)"
          age=$((now - heartbeat_epoch))
          echo "watchdog_pid=$pid heartbeat_age_seconds=$age"
          if (( age > 30 )); then
            echo "Watchdog heartbeat is stale." >&2
            exit 1
          fi
          pgrep -af 'Runner\.Listener run' || true
          ps -p "$pid" -o pid,ppid,sid,user,etime,cmd
          tail -n 30 "$STATE_DIR/watchdog.log" || true
